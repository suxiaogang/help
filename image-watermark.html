<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片加水印</title>
  <meta name="description" content="给图片叠加 PNG 水印，可拖拽定位、旋转、平铺并调整透明度，纯前端处理，图片不上传" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    /* 与各工具子页面共用同一套色板，改这里即可整体换肤 */
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --warn: #ffb340;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      flex: 0 0 auto; padding: 11px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header .hint { font-size: 12px; color: var(--muted); }

    .layout {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(340px, 380px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
    }
    .column { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .column.left { border-right: 1px solid var(--border); }

    .col-head {
      flex: 0 0 auto; padding: 9px 16px;
      font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .5px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; border-bottom: 1px solid var(--border);
    }
    .col-head .actions { display: flex; gap: 6px; }

    .scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
      /* 细线把「选图」和「设置」两块区分开；配合 .panel 的上内边距，
         第二个槽不会再和下面的内容贴在一起 */
      border-top: 1px solid var(--border);
    }

    button {
      font: inherit; font-size: 12px; padding: 6px 12px;
      border-radius: 7px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text);
      cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    button:hover:not(:disabled) { background: #232c39; border-color: #3a4557; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #062315; font-weight: 600; }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
    button.mini { padding: 4px 9px; font-size: 11px; }

    /* ---- 两个图片槽 ---- */
    /* 左栏顶部提示行 */
    .tip {
      flex: 0 0 auto; padding: 11px 18px 0;
      font-size: 11px; line-height: 1.5; color: var(--muted);
    }
    .tip:not(:empty) { padding-bottom: 1px; }

    .slot {
      margin: 12px 18px 0;
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 13px 15px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: border-color .2s, background-color .2s;
    }
    .slot:hover, .slot.dragover { border-color: var(--accent); background: rgba(61, 214, 140, .06); }
    .slot.filled { border-style: solid; background: var(--panel); }
    .slot input[type="file"] { display: none; }
    .slot .icon { font-size: 18px; line-height: 1; flex: 0 0 auto; }
    .slot .tx { min-width: 0; flex: 1 1 auto; }
    .slot .t1 { font-size: 12.5px; }
    /* 第二个槽与下方分隔线之间必须留空：线紧贴槽底时，
       看起来像是槽自己的下边框，而不是两块区域的分界 */
    #markSlot { margin-bottom: 14px; }
    .slot .t1 b { font-weight: 600; }
    .slot .t2 { font-size: 11px; color: var(--muted); margin-top: 3px;
                font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot .thumb {
      flex: 0 0 auto; width: 36px; height: 36px; border-radius: 6px;
      border: 1px solid var(--border); background: #161b22;
      background-size: cover; background-position: center;
    }

    .panel { padding: 16px 18px 12px; }
    .group + .group { margin-top: 18px; }
    .group-title {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 11.5px; font-weight: 600; color: var(--muted);
      letter-spacing: .4px; margin-bottom: 9px;
    }
    .group-title small { color: var(--muted); font-weight: 400; margin-left: 5px; }

    .seg { display: grid; gap: 8px; }
    .seg.c2 { grid-template-columns: repeat(2, 1fr); }
    .seg button { padding: 8px 2px; font-size: 12px; }
    .seg button.on { background: var(--accent); border-color: var(--accent); color: #062315; font-weight: 600; }

    .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
    input[type="range"] {
      flex: 1 1 auto; min-width: 0; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: var(--border); border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    .slider-val {
      flex: 0 0 auto; min-width: 62px; text-align: right;
      font-family: var(--mono); font-size: 11px; color: var(--text);
    }
    .slider-label { flex: 0 0 auto; width: 50px; font-size: 11.5px; color: var(--muted); }

    select {
      font: inherit; font-size: 12px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 10px; cursor: pointer; width: 100%;
    }

    .hint-line { margin-top: 7px; font-size: 11px; line-height: 1.5; color: var(--muted); }
    .hint-line b { color: var(--text); font-weight: 600; }
    .hint-line.ok { color: var(--accent); }
    .hint-line.warn { color: var(--warn); }

    .actions-stack { display: flex; flex-direction: column; gap: 9px; }
    .actions-stack button { width: 100%; padding: 11px; font-size: 13px; }

    /* ---- 右列 ---- */
    .preview { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; overflow: hidden; padding: 12px; }

    /* 画布按输出分辨率渲染，仅用 CSS 缩放显示：所见即所得。
       缩放尺寸由 fitCanvas() 用 JS 算好写进 style——
       不能用 object-fit: contain，那会在画布元素内部留黑边，
       而拖拽换算和水印包围盒都以元素的 getBoundingClientRect() 为准，
       元素框一旦大于实际图像，位置就全错位了。 */
    .stage {
      flex: 0 0 auto; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 9px;
      overflow: hidden; background: #161b22; position: relative;
    }
    .stage canvas {
      display: block;
      /* 拖动水印时别触发页面滚动 */
      touch-action: none; cursor: default;
    }
    .stage.grab canvas { cursor: grab; }
    .stage.grabbing canvas { cursor: grabbing; }

    /* 拖拽时画出水印的包围盒，方便看清边界 */
    .stage .box {
      position: absolute; border: 1px dashed var(--accent);
      pointer-events: none; display: none; border-radius: 2px;
    }

    /* 输出信息住页脚：与状态文案并排，状态靠右 */
    .foot-meta {
      flex: 1 1 auto; min-width: 0;
      display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .foot-meta .k { color: var(--muted); }
    .foot-meta .v { color: var(--text); margin-left: 5px; }
    .foot-meta .v.hl { color: var(--accent); font-weight: 600; }
    .foot-status { flex: 0 0 auto; margin-left: 16px; text-align: right; }

    footer {
      flex: 0 0 auto; padding: 9px 20px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3542; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4557; }

    @media (max-width: 820px) {
      html, body { height: auto; }
      body { overflow: visible; }
      .layout { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      .column.left { border-right: none; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .scroll { overflow: visible; }
      .preview { min-height: 0; }
      .col-head { flex-wrap: wrap; padding: 9px 12px; }
      header { padding: 11px 14px; }
      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>图片加水印</h1>
    <span class="hint">拖拽定位 · 旋转 · 平铺 · 透明度可调 · 纯前端处理，图片不上传</span>
  </header>

  <div class="layout">

    <!-- ============ 左列 ============ -->
    <section class="column left">
      <div class="tip" id="viewHint"></div>
      <div class="slot" id="baseSlot">
        <span class="icon">🖼️</span>
        <span class="tx">
          <span class="t1"><b>原图</b> · 点击选择或拖入</span>
          <span class="t2" id="baseInfo">支持 JPG / PNG / WebP</span>
        </span>
        <input type="file" id="baseInput" accept="image/*" />
      </div>

      <div class="slot" id="markSlot">
        <span class="icon">🏷️</span>
        <span class="tx">
          <span class="t1"><b>水印图</b> · 建议用带透明通道的 PNG</span>
          <span class="t2" id="markInfo">未选择</span>
        </span>
        <input type="file" id="markInput" accept="image/*" />
      </div>

      <div class="scroll">
        <div class="panel">

          <div class="group">
            <div class="group-title"><span>水印</span><span id="markHint" style="color:var(--muted);font-weight:400"></span></div>

            <div class="slider-row">
              <span class="slider-label">大小</span>
              <input type="range" id="sizeRange" min="3" max="100" step="1" value="22" disabled />
              <span class="slider-val" id="sizeVal">22%</span>
            </div>

            <div class="slider-row">
              <span class="slider-label">角度</span>
              <input type="range" id="angleRange" min="-180" max="180" step="1" value="0" disabled />
              <span class="slider-val" id="angleVal">0°</span>
            </div>

            <div class="slider-row">
              <span class="slider-label">透明度</span>
              <input type="range" id="opRange" min="1" max="100" step="1" value="100" disabled />
              <span class="slider-val" id="opVal">100%</span>
            </div>

            <div class="seg c2" style="margin-top:14px">
              <button type="button" id="modeSingle" class="on" disabled>单个放置</button>
              <button type="button" id="modeTile" disabled>平铺整张</button>
            </div>

            <div class="slider-row" id="gapRow" style="display:none">
              <span class="slider-label">间距</span>
              <input type="range" id="gapRange" min="100" max="300" step="5" value="150" disabled />
              <span class="slider-val" id="gapVal">1.50×</span>
            </div>
            <div class="hint-line">在右侧预览图上<b>按住水印拖动</b>即可调整位置。</div>
          </div>

          <div class="group">
            <div class="group-title"><span>导出</span></div>
            <select id="sizeSel">
              <option value="0">保持原始尺寸</option>
              <option value="2560">最长边 2560</option>
              <option value="1920">最长边 1920</option>
              <option value="1440">最长边 1440</option>
              <option value="1080">最长边 1080</option>
              <option value="800">最长边 800</option>
            </select>
            <div class="slider-row" style="margin-top:7px">
              <span class="slider-label">格式</span>
              <select id="fmtSel">
                <option value="image/png" selected>PNG（保留透明）</option>
                <option value="image/jpeg">JPEG（体积小）</option>
                <option value="image/webp">WebP（体积小）</option>
              </select>
            </div>
            <div class="slider-row" id="qualityRow" style="display:none">
              <span class="slider-label">质量</span>
              <input type="range" id="qualityRange" min="40" max="100" step="5" value="92" />
              <span class="slider-val" id="qualityVal">92%</span>
            </div>
            <div class="actions-stack" style="margin-top:8px">
              <button type="button" class="primary" id="dlBtn" disabled>下载图片</button>
            </div>
            <div class="hint-line" id="statusLine"></div>
          </div>

        </div>
      </div>
    </section>

    <!-- ============ 右列 ============ -->
    <section class="column right">
      <div class="col-head">
        <span>预览</span>
        <div class="actions">
          <button type="button" class="mini" id="centerBtn" disabled>水印回到中心</button>
          <button type="button" class="mini" id="clearBtn" disabled>清空</button>
        </div>
      </div>

      <div class="preview" id="preview">
        <div class="stage" id="stage" hidden>
          <canvas id="cv"></canvas>
          <div class="box" id="markBox"></div>
        </div>

      </div>
    </section>
  </div>

  <footer>
    <span class="dot"></span>
    <span class="foot-meta" id="metaRow" hidden>
      <span><span class="k">输出</span><span class="v hl" id="mSize">—</span></span>
      <span><span class="k">原图</span><span class="v" id="mOrig">—</span></span>
      <span><span class="k">水印</span><span class="v" id="mMark">—</span></span>
      <span><span class="k">角度</span><span class="v" id="mAngle">—</span></span>
    </span>
    <span class="foot-status" id="statusText">等待选择原图…</span>
  </footer>

<script>
(function () {
  "use strict";

  /* =========================================================
     画布始终按「输出分辨率」渲染，页面里只用 CSS 把它缩到能显示的大小。
     这样屏幕上看到的位置、角度、大小跟导出的文件完全一致，
     拖水印时不必在两套坐标系之间来回换算。
     水印位置以画布宽高的比例保存，改输出尺寸时位置不会跑偏。
     ========================================================= */

  var $ = function (id) { return document.getElementById(id); };
  function setStatus(t) { $("statusText").textContent = t; }

  function humanSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(2) + " MB";
  }

  var cv = $("cv");
  var ctx = cv.getContext("2d");

  // ---- 状态 ----
  var baseImg = null, markImg = null;   // { img, name, w, h }
  var outW = 0, outH = 0;
  var mark = {
    fx: 0.5, fy: 0.5,      // 水印中心在画布中的相对位置（0~1）
    scale: 0.22,           // 水印宽度占输出宽度的比例
    angle: 0,              // 度
    opacity: 1,
    tile: false,
    gap: 1.5               // 平铺时中心间距 = 水印边长 × gap
  };
  var dragging = false;

  /* =========================================================
     图片读入
     ========================================================= */
  function readImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        res({ img: img, name: file.name, w: img.naturalWidth, h: img.naturalHeight });
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        rej(new Error("无法解码这张图片"));
      };
      img.src = url;
    });
  }

  function loadBase(file) {
    readImage(file).then(function (o) {
      o.fmt = file.type || "";        // 留着原始类型，导出时可判断能否直接交付原文件
      o.blob = file;                  // 同上：原文件字节
      baseImg = o;
      $("baseInfo").textContent = o.name + " · " + o.w + "×" + o.h;
      $("baseSlot").classList.add("filled");
      $("mOrig").textContent = o.w + "×" + o.h;
      syncControls();
      $("stage").hidden = false;
      $("metaRow").hidden = false;
      applyOutputSize();
      setStatus("已载入原图" + (markImg ? "" : "，接着选一张水印图"));
    }).catch(function (e) {
      $("statusLine").className = "hint-line warn";
      $("statusLine").textContent = "原图读取失败：" + (e.message || e);
    });
  }

  function loadMark(file) {
    readImage(file).then(function (o) {
      o.box = alphaBounds(o.img);
      markImg = o;
      $("markInfo").textContent = o.name + " · " + o.w + "×" + o.h;
      $("markSlot").classList.add("filled");
      $("mMark").textContent = o.w + "×" + o.h;
      syncControls();

      // PNG 带透明边距时说明一下：大小按可见内容算，不含边距
      var hasMargin = o.box && (Math.abs(o.box.w - o.w) > 1 || Math.abs(o.box.h - o.h) > 1);
      if (!o.box) {
        $("markHint").textContent = "整张都是透明的";
        $("statusLine").className = "hint-line warn";
        $("statusLine").textContent = "这张水印图没有任何不透明像素，铺上去看不出变化。";
      } else if (!hasMargin) {
        $("markHint").textContent = "";
      } else {
        $("markHint").textContent = "内容 " + Math.round(o.box.w) + "×" + Math.round(o.box.h);
        $("statusLine").className = "hint-line";
        $("statusLine").textContent = "这张 PNG 四周有透明边距，「大小」按可见内容计算，不含边距。";
      }
      render();
      setStatus("已载入水印图");
    }).catch(function (e) {
      $("statusLine").className = "hint-line warn";
      $("statusLine").textContent = "水印图读取失败：" + (e.message || e);
    });
  }

  /* =========================================================
     输出尺寸
     ========================================================= */
  function applyOutputSize() {
    if (!baseImg) return;
    var maxEdge = parseInt($("sizeSel").value, 10) || 0;
    var k = 1;
    if (maxEdge) k = Math.min(1, maxEdge / Math.max(baseImg.w, baseImg.h));
    outW = Math.max(1, Math.round(baseImg.w * k));
    outH = Math.max(1, Math.round(baseImg.h * k));

    // 画布面积有上限，超大图要提示，否则 toBlob 会失败
    if (outW * outH > 80000000) {
      $("statusLine").className = "hint-line warn";
      $("statusLine").textContent = "输出尺寸 " + outW + "×" + outH +
        " 过大，浏览器可能画不出来，请选一个更小的「输出尺寸」。";
    }

    cv.width = outW;
    cv.height = outH;
    $("mSize").textContent = outW + "×" + outH;
    render();
  }

  /* =========================================================
     渲染
     ========================================================= */
  /* 求水印图里真正有内容的范围。
     PNG 常带一圈透明边距，直接拿整张图去算大小、命中和拖拽边界都不准：
     拖到画布角上时看着「还有一点在画内」，其实有颜色的部分已经全出去了。 */
  function alphaBounds(img) {
    var W = img.naturalWidth, H = img.naturalHeight;
    if (!W || !H) return null;
    var c = document.createElement("canvas");
    // 缩到 256px 以内采样：边界精度足够，又不用逐像素扫大图
    var k = Math.min(1, 256 / Math.max(W, H));
    var w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
    c.width = w; c.height = h;
    var g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0, w, h);
    var d;
    try {
      d = g.getImageData(0, 0, w, h).data;
    } catch (e) {
      return { x: 0, y: 0, w: W, h: H };   // 读不到像素（跨域）时退回整张
    }
    var x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 8) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) return null;                 // 整张全透明
    return { x: x0 / k, y: y0 / k, w: (x1 - x0 + 1) / k, h: (y1 - y0 + 1) / k };
  }

  /* 水印宽度 = 输出宽度 × 比例，高度按「有内容的部分」的宽高比等比。
     注意不要再乘一次 markImg.w——比例本身相对输出宽度，
     乘上原图宽度会大出一整个数量级（200×0.22×800 而非 0.22×800）。 */
  function markSize() {
    var b = markImg.box || { w: markImg.w, h: markImg.h };
    var w = mark.scale * outW;                // 可见内容的宽度
    var k = w / b.w;                          // 原图 → 目标的缩放
    var fullW = markImg.w * k, fullH = markImg.h * k;
    // 把「内容中心」对到目标中心：PNG 的透明边距不该把水印挤偏。
    // 这里是反向平移——内容中心相对图像中心偏了多少，就往回挪多少。
    var offX = (markImg.w / 2 - (b.x + b.w / 2)) * k;
    var offY = (markImg.h / 2 - (b.y + b.h / 2)) * k;
    return { w: w, h: b.h * k, fullW: fullW, fullH: fullH, offX: offX, offY: offY };
  }

  function drawMarkAt(cx, cy) {
    var s = markSize();
    ctx.save();
    ctx.globalAlpha = mark.opacity;
    ctx.translate(cx, cy);
    ctx.rotate(mark.angle * Math.PI / 180);
    ctx.drawImage(markImg.img, -s.fullW / 2 + s.offX, -s.fullH / 2 + s.offY, s.fullW, s.fullH);
    ctx.restore();
  }

  function render() {
    if (!baseImg || !outW) return;
    fitCanvas();
    ctx.clearRect(0, 0, outW, outH);
    ctx.drawImage(baseImg.img, 0, 0, outW, outH);
    if (markImg) {
      if (mark.tile) renderTile();
      else drawMarkAt(mark.fx * outW, mark.fy * outH);
    }
    updateBox();
    $("mAngle").textContent = mark.angle + "°";
    updateTip();
  }

  /* 预览区只显示图像，所有引导文案都放在左栏顶部这行提示里。
     分四种状态说清楚下一步该做什么，免得用户对着空白的右侧猜。 */
  function updateTip() {
    var t;
    if (!baseImg) {
      t = "先选一张原图，再加一张带透明通道的 PNG 作为水印。";
    } else if (!markImg) {
      t = "接着选一张水印图，建议用带透明通道的 PNG。";
    } else if (mark.tile) {
      t = "平铺模式：在预览上拖动无效，可调角度与间距。";
    } else {
      t = "按住水印拖动即可调整位置（方向键微调 1px）。";
    }
    $("viewHint").textContent = t;
  }

  /* 把画布的显示尺寸缩放到刚好放进预览区，宽高都不超出。
     之前交给 CSS 的 max-width/max-height：横图够用，但竖图会按宽缩放后
     超出区域被 overflow 裁掉——那就不是所见即所得了。 */
  function fitCanvas() {
    if (!outW || !outH || $("stage").hidden) return;
    var p = $("preview"), cs = getComputedStyle(p);
    // 减掉 padding 和 .stage 的 1px 边框，剩下的才是画布能用的地方
    var aw = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
    var ah = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
    if (aw <= 0) return;
    /* 单列模式下预览区的高度本来就是被画布撑出来的（页面也能纵向滚），
       这时再拿高度去约束就成了循环依赖：高度取决于画布，画布又取决于高度。
       注意两种模式都得显式给宽高——canvas 和 img 不同，height:auto
       取的是 height 属性值，不会按宽度等比缩放（那样画布每次渲染都会长一截）。 */
    var k = window.matchMedia("(max-width: 820px)").matches
      ? aw / outW
      : (ah > 0 ? Math.min(aw / outW, ah / outH) : aw / outW);
    cv.style.width = Math.max(1, Math.round(outW * k)) + "px";
    cv.style.height = Math.max(1, Math.round(outH * k)) + "px";
  }

  // 窗口尺寸变了要重算画布显示大小，否则窗口拉宽后图片不会跟着变大
  window.addEventListener("resize", function () {
    if (!outW) return;
    fitCanvas();
    updateBox();
  });

  function renderTile() {
    var s = markSize();
    var stepX = s.w * mark.gap, stepY = s.h * mark.gap;
    // 从左上角开始铺，多铺一圈覆盖旋转后越界的部分
    for (var y = -stepY; y <= outH + stepY; y += stepY) {
      for (var x = -stepX; x <= outW + stepX; x += stepX) {
        drawMarkAt(x + stepX / 2, y + stepY / 2);
      }
    }
  }

  /* =========================================================
     拖拽水印
     ========================================================= */
  // 画布 CSS 尺寸与实际像素的比例，用来把鼠标坐标换算回画布坐标
  function toCanvas(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return { x: (clientX - r.left) * (outW / r.width),
             y: (clientY - r.top) * (outH / r.height) };
  }

  // 水印可见内容旋转后的外接矩形，用来判断指针是否落在它上面
  function markBounds() {
    var s = markSize();
    var a = mark.angle * Math.PI / 180;
    var c = Math.abs(Math.cos(a)), sn = Math.abs(Math.sin(a));
    return {
      cx: mark.fx * outW, cy: mark.fy * outH,
      hw: (s.w * c + s.h * sn) / 2,
      hh: (s.w * sn + s.h * c) / 2
    };
  }

  function hitMark(p) {
    if (!markImg || mark.tile) return false;
    var b = markBounds();
    return Math.abs(p.x - b.cx) <= b.hw && Math.abs(p.y - b.cy) <= b.hh;
  }

  // 画出水印的外接矩形，让用户看得见边界（尤其是水印本身有大量透明区域时）
  function updateBox() {
    var box = $("markBox");
    if (!markImg || mark.tile) { box.style.display = "none"; return; }
    var b = markBounds();
    var r = cv.getBoundingClientRect();
    var sx = r.width / outW, sy = r.height / outH;
    box.style.display = "block";
    box.style.left = (b.cx - b.hw) * sx + "px";
    box.style.top = (b.cy - b.hh) * sy + "px";
    box.style.width = b.hw * 2 * sx + "px";
    box.style.height = b.hh * 2 * sy + "px";
  }

  cv.addEventListener("pointerdown", function (e) {
    if (!markImg || mark.tile || dragging) return;
    if (e.button != null && e.button !== 0) return;
    var p = toCanvas(e.clientX, e.clientY);
    if (!hitMark(p)) return;
    if (e.cancelable) e.preventDefault();
    dragging = true;
    $("stage").classList.add("grabbing");
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    moveTo(p);
  });

  cv.addEventListener("pointermove", function (e) {
    if (!markImg) return;
    var p = toCanvas(e.clientX, e.clientY);
    if (dragging) { moveTo(p); return; }
    $("stage").classList.toggle("grab", hitMark(p));
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    $("stage").classList.remove("grabbing");
    setStatus("水印位置：" + Math.round(mark.fx * outW) + ", " + Math.round(mark.fy * outH));
  }
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);
  cv.addEventListener("lostpointercapture", endDrag);

  /* 把水印中心限制在画布内。
     不能按外接框留余量来钳——外接框大半是 PNG 的透明区，
     看着还留了一点，实际有颜色的部分已经被推出画外，水印会「拖丢」。 */
  function moveTo(p) {
    mark.fx = Math.min(Math.max(p.x, 0), outW) / outW;
    mark.fy = Math.min(Math.max(p.y, 0), outH) / outH;
    render();
  }

  // 方向键微调一个画布像素
  document.addEventListener("keydown", function (e) {
    if (!markImg || mark.tile) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
    var step = e.shiftKey ? 10 : 1;
    var dx = 0, dy = 0;
    if (e.key === "ArrowLeft") dx = -step;
    if (e.key === "ArrowRight") dx = step;
    if (e.key === "ArrowUp") dy = -step;
    if (e.key === "ArrowDown") dy = step;
    if (!dx && !dy) return;
    e.preventDefault();
    mark.fx += dx / outW;
    mark.fy += dy / outH;
    render();
    setStatus("水印位置：" + Math.round(mark.fx * outW) + ", " + Math.round(mark.fy * outH));
  });

  /* =========================================================
     控件
     ========================================================= */
  /* 按钮可用性集中在这里判断。之前 clearBtn 在 HTML 里写了 disabled
     却没人去启用它，结果「清空」一直是灰的。 */
  function syncControls() {
    var hasBase = !!baseImg, hasMark = !!markImg;
    ["sizeRange", "angleRange", "opRange", "modeSingle", "modeTile",
     "gapRange", "centerBtn"].forEach(function (id) {
      $(id).disabled = !hasMark;
    });
    $("dlBtn").disabled = !hasBase;             // 有原图就能导出原图
    $("clearBtn").disabled = !hasBase && !hasMark;
  }

  function bindSlot(slotId, inputId, handler) {
    var slot = $(slotId), input = $(inputId);
    slot.addEventListener("click", function () { input.click(); });
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (f) handler(f);
    });
    ["dragenter", "dragover"].forEach(function (ev) {
      slot.addEventListener(ev, function (e) {
        e.preventDefault(); e.stopPropagation();
        slot.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      slot.addEventListener(ev, function (e) {
        e.preventDefault(); e.stopPropagation();
        slot.classList.remove("dragover");
      });
    });
    slot.addEventListener("drop", function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handler(f);
    });
  }

  bindSlot("baseSlot", "baseInput", loadBase);
  bindSlot("markSlot", "markInput", loadMark);

  $("sizeRange").addEventListener("input", function () {
    mark.scale = parseInt(this.value, 10) / 100;
    $("sizeVal").textContent = this.value + "%";
    render();
  });

  $("angleRange").addEventListener("input", function () {
    mark.angle = parseInt(this.value, 10);
    $("angleVal").textContent = mark.angle + "°";
    render();
  });

  $("opRange").addEventListener("input", function () {
    mark.opacity = parseInt(this.value, 10) / 100;
    $("opVal").textContent = this.value + "%";
    render();
  });

  $("modeSingle").addEventListener("click", function () {
    mark.tile = false;
    this.classList.add("on"); $("modeTile").classList.remove("on");
    $("gapRow").style.display = "none";
    render();
  });

  $("modeTile").addEventListener("click", function () {
    mark.tile = true;
    this.classList.add("on"); $("modeSingle").classList.remove("on");
    $("gapRow").style.display = "";
    render();
  });

  $("gapRange").addEventListener("input", function () {
    mark.gap = parseInt(this.value, 10) / 100;
    $("gapVal").textContent = mark.gap.toFixed(2) + "×";
    render();
  });

  $("centerBtn").addEventListener("click", function () {
    mark.fx = 0.5; mark.fy = 0.5;
    render();
    setStatus("水印已回到中心");
  });

  $("sizeSel").addEventListener("change", applyOutputSize);

  $("fmtSel").addEventListener("change", function () {
    $("qualityRow").style.display = this.value === "image/png" ? "none" : "";
  });
  $("qualityRange").addEventListener("input", function () {
    $("qualityVal").textContent = this.value + "%";
  });

  $("dlBtn").addEventListener("click", function () {
    if (!baseImg) return;
    var type = $("fmtSel").value;
    var q = parseInt($("qualityRange").value, 10) / 100;

    /* 没加水印、且导出格式与原文件一致时，直接交付原始字节：
       省掉一次重编码，画质也不再有损失。
       注意只能拿 baseImg.blob（原文件），不能 fetch(baseImg.img.src)——
       那个 blob URL 在图片 onload 时就已经 revoke 了，fetch 必然 404。 */
    var origFmt = (baseImg.fmt || "").toLowerCase();
    var useOriginal = !markImg && type === origFmt;

    function finish(blob, ext) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      // 只有真的加了水印才带 -watermarked，否则重新编码出来的也叫原名
      a.download = (baseImg.name.replace(/\.[^.]+$/, "") || "image") +
        (markImg ? "-watermarked." + ext : "." + ext);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      $("statusLine").className = "hint-line ok";
      $("statusLine").textContent = "已导出 " + a.download + "（" + humanSize(blob.size) + "）";
      setStatus("已下载");
    }

    if (useOriginal) {
      finish(baseImg.blob, origFmt.split("/")[1] || "jpg");
      return;
    }

    var ext = type === "image/jpeg" ? "jpg" : type === "image/webp" ? "webp" : "png";
    cv.toBlob(function (b) {
      if (!b) {
        $("statusLine").className = "hint-line warn";
        $("statusLine").textContent = "导出失败：请调小「输出尺寸」后重试";
        return;
      }
      finish(b, ext);
    }, type, type === "image/png" ? undefined : q);
  });

  $("clearBtn").addEventListener("click", function () {
    baseImg = markImg = null;
    cv.width = cv.height = 0;
    outW = outH = 0;
    $("baseSlot").classList.remove("filled");
    $("markSlot").classList.remove("filled");
    $("baseInfo").textContent = "支持 JPG / PNG / WebP";
    $("markInfo").textContent = "未选择";
    $("markHint").textContent = "";
    $("stage").hidden = true;
    $("metaRow").hidden = true;
    $("markBox").style.display = "none";
    $("statusLine").textContent = "";
    syncControls();
    updateTip();
    setStatus("已清空");
  });

  syncControls();
  updateTip();
  setStatus("等待选择原图…");
})();
</script>
</body>
</html>
