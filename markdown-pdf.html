<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown 转 PDF</title>
  <meta name="description" content="粘贴或打开本地 Markdown，预览排版后一键经浏览器打印引擎导出 PDF；纯前端处理，内容不上传" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    /* 与其它工具子页面共用同一套色板，改这里即可整体换肤 */
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --warn: #ffb340;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      flex: 0 0 auto; padding: 11px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header .hint { font-size: 12px; color: var(--muted); }
    header .spacer { flex: 1; }
    header .open {
      font: inherit; font-size: 12px; color: var(--text);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 12px; cursor: pointer;
    }
    header .open:hover, header .open.flash { border-color: var(--accent); color: var(--accent); }

    /* ---------- 打印选项条 ---------- */
    .opts {
      flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap;
      gap: 8px; padding: 7px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .opts .t { font-size: 11px; color: var(--muted); user-select: none; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
    .seg button {
      font: inherit; font-size: 12px; color: var(--muted);
      background: transparent; border: 0; padding: 4px 12px; cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button:hover { color: var(--text); background: var(--panel-2); }
    .seg button.on { background: var(--accent-2); color: #062315; font-weight: 600; }
    .opts .note { font-size: 11px; color: var(--muted); }

    /* ---------- 双栏 ---------- */
    main { flex: 1 1 auto; min-height: 0; display: flex; }
    .pane {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #srcPane { border-right: 1px solid var(--border); }
    /* 拖过分隔条之后，源码栏按拖的比例锁定宽度 */
    body.resized #srcPane { flex: 0 0 var(--ratio, 46%); }

    .pane-h {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .5px;
      padding: 0 14px; border-bottom: 1px solid var(--border);
      height: 32px;
    }
    .pane-h .val { margin-left: auto; font-weight: 400; font-size: 11px; }

    #src {
      flex: 1 1 auto; min-height: 0; width: 100%;
      resize: none; border: 0; outline: none;
      background: var(--bg); color: var(--text);
      font-family: var(--mono); font-size: 13px; line-height: 1.7;
      padding: 14px 18px 24px; tab-size: 2;
      white-space: pre-wrap; overflow-wrap: break-word;
      caret-color: var(--accent);
    }
    #src::placeholder { color: #5d6878; }
    #src::selection { background: rgba(61, 214, 140, .25); }

    /* 预览栏底色比页面略亮，衬出白纸 */
    #pvPane { background: #12161d; }
    #pv {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 22px 30px 60px;
    }
    /* 纸面：近似 A4 宽高比的浅色卡片，所见即所得 */
    #pv .sheet {
      max-width: 780px; margin: 0 auto;
      background: #fff; color: #20242a;
      border-radius: 5px;
      padding: 52px 60px 60px;
      box-shadow: 0 3px 18px rgba(0, 0, 0, .45);
      font-size: 13.5px; line-height: 1.7;
    }
    #pv .sheet:empty::after {
      content: "左侧粘贴或打开 Markdown，这里实时预览排版效果";
      color: #9aa3ad; display: block; text-align: center; padding: 80px 0;
    }

    /* ---------- 拖动分隔条 ---------- */
    #split { flex: 0 0 5px; background: var(--bg); cursor: col-resize; }
    #split:hover, #split.drag { background: var(--accent-2); opacity: .55; }
    body.dragging { cursor: col-resize; user-select: none; }

    /* ---------- 页脚 ---------- */
    footer {
      flex: 0 0 auto; padding: 8px 20px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 10px;
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    footer .spacer { flex: 1; }
    footer .acts { display: flex; gap: 6px; }
    footer button {
      font: inherit; font-size: 12px; color: var(--text);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 7px; padding: 4px 11px; cursor: pointer;
    }
    footer button:hover { border-color: var(--accent); color: var(--accent); }
    footer button.primary {
      background: var(--accent); border-color: var(--accent);
      color: #062315; font-weight: 600;
    }
    footer button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #062315; }
    footer button.warn:hover { border-color: var(--warn); color: var(--warn); }

    /* =====================================================================
     *  预览纸面样式（浅色主题）
     * ===================================================================== */
    .sheet > :first-child { margin-top: 0; }
    .sheet h1, .sheet h2, .sheet h3, .sheet h4, .sheet h5, .sheet h6 {
      margin: 1.35em 0 .45em; line-height: 1.35; font-weight: 650;
    }
    .sheet h1 { font-size: 24px; padding-bottom: .3em; border-bottom: 1px solid #dfe3e8; }
    .sheet h2 { font-size: 20px; padding-bottom: .3em; border-bottom: 1px solid #dfe3e8; }
    .sheet h3 { font-size: 16.5px; }
    .sheet h4 { font-size: 15px; }
    .sheet h5 { font-size: 13.5px; }
    .sheet h6 { font-size: 12px; color: #6b7480; }
    .sheet p, .sheet ul, .sheet ol, .sheet blockquote, .sheet table, .sheet pre, .sheet hr { margin: .7em 0; }
    .sheet p { line-height: 1.75; }
    .sheet a { color: #1e8f5c; }
    .sheet ul, .sheet ol { padding-left: 1.6em; }
    .sheet li { margin: .22em 0; line-height: 1.65; }
    .sheet li > ul, .sheet li > ol { margin: .15em 0; }
    .sheet hr { border: 0; border-top: 1px solid #dfe3e8; }
    .sheet code {
      font-family: var(--mono); font-size: 12.5px;
      background: #f0f2f5; border: 1px solid #e2e6eb;
      border-radius: 4px; padding: 1px 5px;
    }
    .sheet pre {
      background: #f7f8fa; border: 1px solid #e4e8ed;
      border-radius: 8px; padding: 10px 14px 12px; overflow-x: auto;
      line-height: 1.55;
    }
    .sheet pre code {
      background: transparent; border: 0; padding: 0;
      font-size: 12.5px; white-space: pre;
    }
    .sheet pre .lang {
      display: block; text-align: left;
      font-family: var(--mono); font-size: 10.5px; color: #8a94a3;
      text-transform: none;
      margin: 0 0 6px; padding-bottom: 4px;
      border-bottom: 1px dashed #dfe3e8;
    }
    /* 代码高亮：浅色纸面上用加深一档的同色系 */
    .sheet pre .cmt { color: #8a94a3; font-style: italic; }
    .sheet pre .str { color: #9a6410; }
    .sheet pre .kw  { color: #1e9e63; }
    .sheet pre .num { color: #2f6fb0; }
    .sheet pre .fn  { color: #1f7fae; }
    .sheet blockquote {
      margin-left: 0; margin-right: 0;
      border-left: 3px solid #2bb673;
      background: #f3faf6;
      padding: 6px 14px; border-radius: 0 6px 6px 0;
    }
    .sheet blockquote > :first-child { margin-top: 0; }
    .sheet blockquote > :last-child { margin-bottom: 0; }
    .sheet table { border-collapse: collapse; font-size: 13px; }
    .sheet th, .sheet td {
      border: 1px solid #dfe3e8;
      padding: 5px 11px; line-height: 1.5; text-align: left;
    }
    .sheet th { background: #f4f6f8; font-weight: 600; }
    .sheet img { max-width: 100%; border-radius: 6px; }
    .sheet del { color: #6b7480; }
    .sheet li.tsk { list-style: none; margin-left: -1.35em; }
    .sheet li.tsk input { margin-right: .45em; accent-color: var(--accent); vertical-align: -1px; }

    /* =====================================================================
     *  打印输出区：屏幕上隐藏，@media print 里独占整页
     *
     *  为什么不直接打印预览 DOM：预览是深色 UI 的一部分（纸卡 + 留白），
     *  而 PDF 需要干净白底 + @page 控制纸张与边距，两套版式必须分开。
     * ===================================================================== */
    #printArea { display: none; }
    #pageCss { display: none; }   /* 运行时写入 @page 规则 */

    @media print {
      /* 只留打印区：其余兄弟节点（header/选项条/main/footer）一律不打印 */
      body > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
    }

    @media (max-width: 820px) {
      header { padding: 11px 14px; }
      header .hint { display: none; }
      .opts { padding: 7px 12px; }
      main { flex-direction: column; }
      #split { display: none; }
      #srcPane, body.resized #srcPane {
        flex: 0 0 42%; min-height: 0;
        border-right: 0; border-bottom: 1px solid var(--border);
      }
      #pvPane, body.resized #pvPane { flex: 1 1 0; min-height: 0; }
      #src { padding: 10px 14px 24px; }
      #pv { padding: 14px 14px 40px; }
      .sheet { padding: 30px 26px 40px; }
      footer { padding: 8px 12px; }
      footer .keys { display: none; }
    }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3542; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4557; }
  </style>
</head>
<body>

  <header>
    <h1>📄 Markdown 转 PDF</h1>
    <span class="hint" id="hint">粘贴或拖入 .md 文件 → 预览排版 → 浏览器打印引擎存为 PDF · 内容不上传</span>
    <span class="spacer"></span>
    <button class="open" id="pasteBtn" title="从剪贴板读取文本">📋 粘贴</button>
    <button class="open" id="openBtn" title="打开本地 Markdown / 文本文件">📂 打开文件</button>
    <input type="file" id="filePick" accept=".md,.markdown,.mdown,.txt" hidden>
  </header>

  <!-- 打印选项：只影响最终 PDF 的纸张与边距，预览纸面保持一致观感 -->
  <div class="opts" role="toolbar" aria-label="PDF 选项">
    <span class="t">纸张</span>
    <div class="seg" id="paperSeg">
      <button data-v="A4" class="on">A4</button>
      <button data-v="letter">Letter</button>
    </div>
    <span class="t">页边距</span>
    <div class="seg" id="marginSeg">
      <button data-v="12mm">窄</button>
      <button data-v="20mm" class="on">标准</button>
      <button data-v="30mm">宽</button>
    </div>
    <span class="spacer"></span>
    <span class="note">打印对话框里选「另存为 PDF / Save as PDF」</span>
  </div>

  <main id="layout">
    <section class="pane" id="srcPane">
      <div class="pane-h">
        <span>Markdown 源码</span>
        <span class="val" id="srcInfo"></span>
      </div>
      <textarea id="src" spellcheck="false"
        placeholder="# 直接粘贴 Markdown&#10;&#10;支持标题、列表、表格、代码块、引用、图片、任务列表等常用语法；&#10;也可以点右上角「打开文件」选本地 .md，或把文件拖进页面。"></textarea>
    </section>

    <div id="split" title="拖动调整两栏宽度"></div>

    <section class="pane" id="pvPane">
      <div class="pane-h">
        <span>预览（即 PDF 效果）</span>
        <span class="val" id="pvInfo"></span>
      </div>
      <div id="pv"><div class="sheet" id="sheet"></div></div>
    </section>
  </main>

  <footer>
    <span class="dot"></span><span id="stat">等待输入…</span>
    <span class="spacer"></span>
    <span class="acts">
      <button id="copyMd">复制 Markdown</button>
      <button id="download">下载 .md</button>
      <button id="clear" class="warn" title="清空（清空后可用 ⌘Z 撤销）">清空</button>
      <button id="print" class="primary">🖨 打印 / 导出 PDF</button>
    </span>
  </footer>

  <!-- 打印专用 DOM：内容与预览相同，但用 print 版式（白底、pt 字号、@page 纸张） -->
  <style id="pageCss"></style>
  <div id="printArea"></div>

<script>
(function () {
  "use strict";

  /* ===================== 小工具 ===================== */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* =======================================================================
   *  ①  Markdown 渲染器 —— 与 markdown.html 同源的自写轻实现
   *
   *   支持：标题 / 段落 / 行内代码 / 粗·斜·删除线 / 链接·图片·自动链接 /
   *         围栏代码块 ``` / 引用（可嵌套） / 有序·无序·任务列表（可嵌套） /
   *         表格（含对齐） / 分隔线 / 换行即 <br>（中文写作习惯）
   *   代码块按语言做轻量语法高亮（注释/字符串/数字/关键字/函数）。
   *   不支持：脚注、公式、内嵌 HTML → 一律转义原样显示，不会误执行。
   * ==================================================================== */

  /* 行内语法。backtick 段先抠出来放占位符，
     免得代码里的 * _ ~ [ ] 被当成强调/链接语法 */
  function inline(text) {
    var codes = [];
    var t = text.replace(/(`+)([\s\S]*?)\1/g, function (_m, _tick, body) {
      codes.push("<code>" + esc(body) + "</code>");
      return "\x00" + (codes.length - 1) + "\x00";
    });
    t = esc(t);

    t = t.replace(/!\[([^\]\n]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (_m, alt, url) {
      return '<img src="' + url + '" alt="' + alt + '" loading="lazy">';
    });
    t = t.replace(/\[([^\]\n]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (_m, txt, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + "</a>";
    });
    t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>()]+[^\s<>().,;:!?])/g, function (_m, p, url) {
      return p + '<a href="' + url + '" target="_blank" rel="noopener">' + url + "</a>";
    });
    t = t.replace(/\*\*([^*\n]+)\*\*|__([^_\n]+)__/g, function (_m, a, b) {
      return "<strong>" + (a || b) + "</strong>";
    });
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, function (_m, p, a) {
      return p + "<em>" + a + "</em>";
    });
    t = t.replace(/(^|[^_\w])_([^_\n]+)_(?!_)/g, function (_m, p, a) {
      return p + "<em>" + a + "</em>";
    });
    t = t.replace(/~~([^~\n]+)~~/g, function (_m, c) { return "<del>" + c + "</del>"; });
    t = t.replace(/\x00(\d+)\x00/g, function (_m, n) { return codes[+n]; });
    return t;
  }

  /* 表格一行拆格子；「\|」是转义竖线，先还原再拆 */
  function splitCells(row) {
    var s = row.trim().replace(/^\|/, "").replace(/\|$/, "");
    return s.split("|").map(function (c) { return c.trim().replace(/\\\|/g, "|"); });
  }

  function cell(tag, content, align) {
    return "<" + tag + (align ? ' style="text-align:' + align + '"' : "") + ">" +
           inline(content) + "</" + tag + ">";
  }

  /* ---- 轻量语法高亮 ----
     不引库。按语言族给一组「块注释/行注释/字符串/关键字」的正则，
     一遍扫过去把命中的段落染成 cmt/str/num/kw/fn 五种 token。
     认不出的语言走 generic：只有字符串、数字，不会出错也不会乱。 */
  var HL = {
    KW: {
      js:  ["var","let","const","function","return","if","else","for","while",
            "new","class","extends","super","this","typeof","instanceof","null",
            "undefined","true","false","async","await","import","export","from",
            "default","of","in","try","catch","throw","switch","case","break",
            "continue","do","yield","get","set","static","void","delete"],
      py:  ["def","return","if","elif","else","for","while","import","from","as",
            "class","None","True","False","and","or","not","in","is","lambda",
            "try","except","finally","raise","with","yield","global","pass",
            "print","assert","del"],
      sh:  ["echo","export","cd","ls","git","npm","sleep","source","alias","if",
            "then","else","elif","fi","for","while","do","done","case","esac",
            "return","function","set","unset","local","read","shift","exec",
            "trap","sudo","true","false"],
      sql: ["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET",
            "DELETE","CREATE","TABLE","DROP","ALTER","JOIN","LEFT","RIGHT",
            "INNER","OUTER","ON","AND","OR","NOT","NULL","IS","AS","GROUP","BY",
            "ORDER","LIMIT","HAVING","DISTINCT","INDEX","PRIMARY","KEY"],
      json:["true","false","null"]
    },
    /* 语言别名 → 规则族；扫不出来的语言用 generic 兜底 */
    alias: {},
    fam: { }
  };
  (function setupHL() {
    var fams = {
      js: { line: /\/\/.*/m, block: /\/\*[\s\S]*?\*\//, fn: true },
      py: { line: /#.*/m },
      sh: { line: /#.*/m },
      sql:{ line: /--.*$/m, block: /\/\*[\s\S]*?\*\//, ci: true },
      json:{},
      css:{ block: /\/\*[\s\S]*?\*\// }
    };
    var map = {
      javascript:"js", jsx:"js", mjs:"js", cjs:"js", ts:"js", tsx:"js",
      typescript:"js", node:"js",
      python:"py", python3:"py", rb:"py", ruby:"py",
      bash:"sh", shell:"sh", zsh:"sh", console:"sh", terminal:"sh",
      cpp:"js", cc:"js", java:"js", swift:"js", kotlin:"js", go:"js", c:"js",
      psql:"sql", mysql:"sql", sqlite:"sql", json:"json",
      css:"css", scss:"css", less:"css"
    };
    var k;
    for (k in map) HL.alias[k] = map[k];
    for (k in fams) HL.fam[k] = fams[k];
  })();

  var hlCache = {};
  /* 合成一条交替正则：组序固定 cmt/cmt/str/kw/num/fn，命中哪组就是哪类 token */
  function hlRegex(key, fam) {
    if (hlCache[key]) return hlCache[key];
    var parts = [], tags = [];
    if (fam.block) { parts.push("(" + fam.block.source + ")"); tags.push("cmt"); }
    if (fam.line)  { parts.push("(" + fam.line.source + ")");  tags.push("cmt"); }
    /* 三种字面量：单引号 / 双引号 / 反引号，允许里面的反斜杠转义。
       用正则字面量定义再取 .source，免得在字符串里写双重转义 */
    var STR_RX = /'[^'\n\\]*(?:\\.[^'\n\\]*)*'|"[^"\n\\]*(?:\\.[^"\n\\]*)*"|`[^`]*`/;
    parts.push("(" + STR_RX.source + ")"); tags.push("str");
    var kw = HL.KW[key];
    if (kw) { parts.push("\\b(" + kw.join("|") + ")\\b"); tags.push("kw"); }
    parts.push("\\b(\\d+(?:\\.\\d+)?)\\b"); tags.push("num");
    if (fam.fn) { parts.push("([A-Za-z_$][\\w$]*)(?=\\s*\\()"); tags.push("fn"); }

    hlCache[key] = { rx: new RegExp(parts.join("|"), "g" + (fam.ci ? "i" : "")), tags: tags };
    return hlCache[key];
  }

  function hl(code, lang) {
    var raw = (lang || "").toLowerCase().trim();
    var key = HL.alias[raw] || (raw || "generic");
    var fam = HL.fam[key] || { };
    var cfg = hlRegex(key, fam);
    var rx = new RegExp(cfg.rx.source, cfg.rx.flags);   /* 每次新实例，避免共享 lastIndex */
    var out = [], last = 0, m;
    while ((m = rx.exec(code))) {
      if (m.index > last) out.push(esc(code.slice(last, m.index)));
      var type = "plain";
      for (var g = 1; g < m.length; g++) if (m[g] !== undefined) { type = cfg.tags[g - 1]; break; }
      out.push('<span class="' + type + '">' + esc(m[0]) + "</span>");
      last = m.index + m[0].length;
    }
    if (last < code.length) out.push(esc(code.slice(last)));
    return out.join("");
  }

  /* 块解析主循环。返回 [{line, html}]，line 是起始行号（1 起） */
  function parseBlocks(srcText) {
    var lines = srcText.split("\n");
    var out = [];
    var i = 0, N = lines.length;

    while (i < N) {
      var l = lines[i];

      /* 空行 */
      if (/^\s*$/.test(l)) { i++; continue; }

      /* 围栏代码块：```lang / ~~~lang，直到同级收尾 */
      var f = /^ {0,3}(`{3,}|~{3,})\s*(\S*)\s*$/.exec(l);
      if (f) {
        var close = new RegExp("^ {0,3}" + f[1].charAt(0) + "{" + f[1].length + ",}[ \\t]*$");
        var body = [], fs = i;
        i++;
        while (i < N && !close.test(lines[i])) { body.push(lines[i]); i++; }
        if (i < N) i++;   /* 吃掉收尾行；一直没等到就吃到底 */
        out.push({
          line: fs + 1,
          html: "<pre>" +
                (f[2] ? '<code class="lang">' + esc(f[2]) + "</code>" : "") +
                "<code>" + hl(body.join("\n"), f[2]) + "</code></pre>"
        });
        continue;
      }

      /* ATX 标题 */
      var h = /^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/.exec(l);
      if (h) {
        var lv = h[1].length;
        out.push({
          line: i + 1,
          html: "<h" + lv + ' data-line="' + (i + 1) + '">' + inline(h[2]) + "</h" + lv + ">"
        });
        i++;
        continue;
      }

      /* 分隔线：--- *** ___ */
      if (/^ {0,3}([-*_])([ \t]*\1){2,}[ \t]*$/.test(l)) {
        out.push({ line: i + 1, html: '<hr data-line="' + (i + 1) + '">' });
        i++;
        continue;
      }

      /* 表格：本行含 | 且下一行是 |---|---| 形 */
      if (l.indexOf("|") >= 0 && i + 1 < N && lines[i + 1].indexOf("|") >= 0) {
        var sep = lines[i + 1];
        if (sep.indexOf("-") >= 0 && /^[ \t]*\|?[ :|-]*$/.test(sep)) {
          var aligns = splitCells(sep).map(function (c) {
            if (/^:-+:$/.test(c)) return "center";
            if (/^-+:$/.test(c))  return "right";
            return "";   /* 左对齐，交给默认样式 */
          });
          var head = splitCells(l), ts = i;
          i += 2;
          var rows = [];
          while (i < N && lines[i].indexOf("|") >= 0 && !/^\s*$/.test(lines[i])) {
            rows.push(splitCells(lines[i]));
            i++;
          }
          out.push({
            line: ts + 1,
            html: '<table data-line="' + (ts + 1) + '"><thead><tr>' +
                  head.map(function (c, k) { return cell("th", c, aligns[k]); }).join("") +
                  "</tr></thead><tbody>" +
                  rows.map(function (r) {
                    return "<tr>" + head.map(function (_c, k) {
                      return cell("td", r[k] === undefined ? "" : r[k], aligns[k]);
                    }).join("") + "</tr>";
                  }).join("") +
                  "</tbody></table>"
          });
          continue;
        }
      }

      /* 引用：> 开头。接续行（下一个 > 或没被空行断开的行）都收进来，
         整体递归解析，嵌套引用自然成立 */
      if (/^ {0,3}>/.test(l)) {
        var qs = i, qbuf = [];
        while (i < N) {
          var ql = lines[i];
          if (/^ {0,3}>/.test(ql)) {
            qbuf.push(ql.replace(/^ {0,3}>/, "").replace(/^ /, ""));
            i++;
          } else if (!/^\s*$/.test(ql) && qbuf.length) {
            qbuf.push(ql);   /* 引用里的长段接续行 */
            i++;
          } else break;
        }
        var qInner = parseBlocks(qbuf.join("\n")).map(function (b) { return b.html; }).join("\n");
        out.push({
          line: qs + 1,
          html: '<blockquote data-line="' + (qs + 1) + '">' + qInner + "</blockquote>"
        });
        continue;
      }

      /* 列表：缩进相同的项是一层；更深缩进的行塞给当前项，
         整段行(带原缩进)再交给 parseBlocks 递归 → 天然支持嵌套与项内多段 */
      var lm = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(l);
      if (lm) {
        var ls = i, base = lm[1].length;
        var ordered = /\d/.test(lm[2]);
        var items = [];           /* [{rows:[...]}] */
        while (i < N) {
          var ll = lines[i];
          if (/^\s*$/.test(ll)) {
            /* 空行后若列表还在继续（下一项或缩进行）则当作项内段落分隔 */
            if (i + 1 < N && (/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i + 1]) ||
                              /^\s{2,}\S/.test(lines[i + 1]))) {
              if (items.length) items[items.length - 1].rows.push("");
              i++;
              continue;
            }
            break;
          }
          var mi = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(ll);
          if (mi && mi[1].length <= base) {
            /* 顶到本层以上的项：与本层同类型 → 新项；否则列表结束 */
            if (mi[1].length === base && (/\d/.test(mi[2])) === ordered) {
              items.push({ rows: [mi[3]] });
              i++;
              continue;
            }
            break;
          }
          /* 更深缩进的行：都算当前项的内容（可能是子列表或续行） */
          if (items.length && /^\s/.test(ll)) {
            items[items.length - 1].rows.push(ll);
            i++;
            continue;
          }
          break;
        }
        var startN = ordered ? +(/^\d+/.exec(lm[2])[0]) : 1;
        var oattrs = (ordered && startN !== 1) ? ' start="' + startN + '"' : "";
        var listHtml = "<" + (ordered ? "ol" : "ul") + oattrs +
                       ' data-line="' + (ls + 1) + '">';
        items.forEach(function (it) {
          var inner = parseBlocks(it.rows.join("\n")).map(function (b) { return b.html; }).join("\n");
          /* 任务项：首行以 [ ] / [x] 开头 → 套复选框，标记本身不显示 */
          var tk = /^(\[[ xX]\])\s*([\s\S]*)$/.exec((it.rows[0] || "").trim());
          if (tk) {
            var rest = it.rows.slice();
            rest[0] = tk[2];
            inner = parseBlocks(rest.join("\n")).map(function (b) { return b.html; }).join("\n");
            var chk = '<input type="checkbox" disabled' +
                      (/^\[x\]$/i.test(tk[1]) ? " checked" : "") + ">";
            inner = inner.replace(/^(<[a-z]+[^>]*>)/, "$1" + chk);   /* 首块的标签后塞进去 */
            listHtml += '<li class="tsk">' + inner + "</li>";
          } else {
            listHtml += "<li>" + inner + "</li>";
          }
        });
        listHtml += "</" + (ordered ? "ol" : "ul") + ">";
        out.push({ line: ls + 1, html: listHtml });
        continue;
      }

      /* 段落：吃到空行或新块开头为止；行间用 <br>（换行即换行）。
         兜底：哪怕当前行长得像块开头（比如只有「# 」这种没内容的前缀，
         标题正则匹配不上），也必须至少吃进去一行，否则解析循环走不动，
         页面会假死 */
      var ps = i, pb = [];
      while (i < N && !/^\s*$/.test(lines[i]) &&
             !/^ {0,3}(`{3,}|~{3,})/.test(lines[i]) &&
             !/^ {0,3}#{1,6}\s/.test(lines[i]) &&
             !/^ {0,3}>/.test(lines[i]) &&
             !/^ {0,3}([-*_])([ \t]*\1){2,}[ \t]*$/.test(lines[i]) &&
             !/^(\s*)(?:[-*+]|\d+[.)])\s+/.test(lines[i])) {
        pb.push(lines[i]);
        i++;
      }
      if (!pb.length) { pb.push(lines[i]); i++; }
      out.push({
        line: ps + 1,
        html: '<p data-line="' + (ps + 1) + '">' + pb.map(inline).join("<br>") + "</p>"
      });
    }
    return out;
  }

  function render(mdText) {
    return parseBlocks(mdText).map(function (b) { return b.html; }).join("\n");
  }

  /* =======================================================================
   *  ②  打印版式：@page + 白底正文
   *
   *  字号用 pt（打印语义单位），边距交给 @page 而不是内容 padding，
   *  这样浏览器分页时边距才是「页面级」的，长表格/代码块不会顶到纸边。
   * ==================================================================== */

  var PRINT_CSS =
    "#printArea{font-family:" + "var(--sans)" + ";color:#111;background:#fff;" +
    "font-size:10.5pt;line-height:1.7;}" +
    "#printArea h1,#printArea h2{font-size:19pt;border-bottom:1px solid #ccc;" +
    "padding-bottom:.3em;margin:1.6em 0 .5em;}" +
    "#printArea h1{font-size:22pt;}" +
    "#printArea h3{font-size:15pt;}#printArea h4{font-size:13pt;}" +
    "#printArea h5,#printArea h6{font-size:11pt;color:#444;}" +
    "#printArea h1:first-child,#printArea h2:first-child,#printArea h3:first-child," +
    "#printArea h4:first-child,#printArea h5:first-child,#printArea h6:first-child," +
    "#printArea p:first-child{margin-top:0;}" +
    "#printArea p,#printArea ul,#printArea ol,#printArea blockquote," +
    "#printArea table,#printArea pre,#printArea hr{margin:.7em 0;}" +
    "#printArea a{color:#1e8f5c;}" +
    "#printArea ul,#printArea ol{padding-left:1.6em;}" +
    "#printArea li{margin:.22em 0;}" +
    "#printArea hr{border:0;border-top:1px solid #bbb;}" +
    "#printArea code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;" +
    "font-size:9.5pt;background:#f2f2f2;border:1px solid #ddd;border-radius:3px;" +
    "padding:0 .15em;}" +
    "#printArea pre{background:#f7f7f7;border:1px solid #e0e0e0;border-radius:5px;" +
    "padding:.6em .9em;white-space:pre-wrap;overflow-wrap:break-word;" +
    "-webkit-print-color-adjust:exact;print-color-adjust:exact;}" +
    "#printArea pre code{background:transparent;border:0;padding:0;font-size:9pt;}" +
    "#printArea pre .lang{display:block;font-family:ui-monospace,Menlo,monospace;" +
    "font-size:8pt;color:#888;margin:0 0 .4em;padding-bottom:.3em;" +
    "border-bottom:1px dashed #ccc;}" +
    "#printArea pre .cmt{color:#888;font-style:italic;}" +
    "#printArea pre .str{color:#9a6410;}" +
    "#printArea pre .kw{color:#1e9e63;}" +
    "#printArea pre .num{color:#2f6fb0;}" +
    "#printArea pre .fn{color:#1f7fae;}" +
    "#printArea blockquote{margin-left:0;border-left:3px solid #2bb673;" +
    "background:#f4faf6;padding:.4em 1em;}" +
    "#printArea table{border-collapse:collapse;font-size:9.5pt;}" +
    "#printArea th,#printArea td{border:1px solid #bbb;padding:.25em .6em;text-align:left;}" +
    "#printArea th{background:#f2f2f2;font-weight:600;}" +
    "#printArea img{max-width:100%;}" +
    "#printArea del{color:#666;}" +
    /* 分页友好：代码块/引用/表格行/图片尽量不被腰斩；
       表格允许跨页（整表 avoid 会把长表挤爆），只保行不拆 */
    "#printArea pre,#printArea blockquote,#printArea img{break-inside:avoid;}" +
    "#printArea tr,#printArea li{break-inside:avoid;}" +
    "#printArea h1,#printArea h2,#printArea h3{break-after:avoid;}";

  var pageCss = $("pageCss");
  var paper = "A4", margin = "20mm";

  function applyPageCss() {
    pageCss.textContent =
      "@page{size:" + paper + " portrait;margin:" + margin + ";}" + PRINT_CSS;
  }

  /* =======================================================================
   *  ③  页面逻辑
   * ==================================================================== */

  var src = $("src"), pv = $("pv"), sheet = $("sheet"), layout = $("layout");
  var stat = $("stat"), srcInfo = $("srcInfo"), pvInfo = $("pvInfo");
  var curName = "sample.md";
  var STORE_KEY = "markdown-pdf";

  /* ---------- 渲染（输入防抖 120ms，与 markdown.html 一致） ---------- */
  var renderTimer = null;
  function scheduleRender() {
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(doRender, 120);
  }

  function updateInfo() {
    var txt = src.value;
    var nLines = txt === "" ? 0 : txt.split("\n").length;
    var nChars = txt.replace(/\s/g, "").length;
    srcInfo.textContent = nLines + " 行 · " + nChars + " 字符";
    pvInfo.textContent = sheet.children.length + " 块";
    stat.textContent = nLines + " 行 · " + nChars + " 字符 · " + curName;
  }

  function doRender() {
    var html = render(src.value);
    sheet.innerHTML = html;
    /* 打印区同步刷新：Ctrl+P 也能拿到最新内容，
       即使 beforeprint 没触发（如某些嵌入式 webview）也兜得住 */
    $("printArea").innerHTML = html;
    updateInfo();
  }

  /* 输入即重渲染：打字、粘贴、拖文本进输入框都走这里 */
  src.addEventListener("input", scheduleRender);

  /* ---------- 打印选项 ---------- */
  function bindSeg(id, get, set) {
    $(id).addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-v]");
      if (!btn) return;
      var v = btn.getAttribute("data-v");
      if (v === get()) return;
      set(v);
      this.querySelectorAll("button").forEach(function (b) {
        b.classList.toggle("on", b === btn);
      }.bind(this));
      applyPageCss();
      stat.textContent = "纸张 " + (paper === "A4" ? "A4" : "Letter") +
        " · 页边距 " + margin + " · 待导出";
    });
  }
  bindSeg("paperSeg", function () { return paper; }, function (v) { paper = v; });
  bindSeg("marginSeg", function () { return margin; }, function (v) { margin = v; });

  /* ---------- 页脚操作 ---------- */
  function flash(btn, ok) {
    var old = btn.textContent;
    btn.textContent = ok;
    setTimeout(function () { btn.textContent = old; }, 900);
  }

  function copyText(txt, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(
        function () { flash(btn, "✓ 已复制"); },
        function () { flash(btn, "✗ 失败"); }
      );
    } else {
      var ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      flash(btn, "✓ 已复制");
    }
  }

  $("copyMd").addEventListener("click", function () { copyText(src.value, this); });

  $("download").addEventListener("click", function () {
    var first = (src.value.match(/^#\s+(.+)$/m) || [])[1] || "export";
    var name = first.trim().replace(/[\\/:*?"<>|\s]+/g, "-").slice(0, 40) + ".md";
    var blob = new Blob([src.value], { type: "text/markdown;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  });

  $("clear").addEventListener("click", function () {
    /* 全选后走原生删除，⌘Z 就能撤回来 */
    src.focus();
    src.select();
    document.execCommand("delete");
    doRender();
  });

  /* 打印：先把防抖里的渲染落定，再交给浏览器。
     PDF 文件名取 document.title——这里把标题换成「首个一级标题」，
     浏览器存 PDF 时会拿它当默认文件名，比 export.pdf 好认 */
  $("print").addEventListener("click", function () {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    doRender();
    var m = src.value.match(/^#\s+(.+)$/m);
    var base = "Markdown 转 PDF";
    if (m) {
      var t = m[1].trim().replace(/[\\/:*?"<>|]+/g, "").slice(0, 60);
      if (t) document.title = t;
    } else {
      document.title = base;
    }
    stat.textContent = "已打开打印对话框，目标选「另存为 PDF」";
    window.print();
    document.title = base;   /* 打印结束后标题还原，不污染标签页 */
  });

  /* Ctrl+P / ⌘P 直达打印时也保证 printArea 是最新的 */
  window.addEventListener("beforeprint", function () {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    doRender();
  });

  /* ---------- 打开本地文件（按钮 + 拖放 + 剪贴板） ---------- */
  function loadText(text, name) {
    src.value = String(text);
    if (name) {
      curName = name;
      $("hint") && ($("hint").textContent =
        "已打开：" + name + " · 编辑后点「打印 / 导出 PDF」");
    }
    doRender();
  }

  function loadFile(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () { loadText(rd.result, file.name); };
    rd.readAsText(file, "utf-8");
  }

  $("openBtn").addEventListener("click", function () { $("filePick").click(); });
  $("filePick").addEventListener("change", function () {
    loadFile(this.files[0]);
    this.value = "";   /* 清掉选择，下次还能再选同一个文件 */
    this.blur();
  });

  $("pasteBtn").addEventListener("click", function () {
    var btn = this;
    if (!(navigator.clipboard && navigator.clipboard.readText)) {
      flash(btn, "✗ 不支持");
      src.focus();
      return;
    }
    navigator.clipboard.readText().then(function (text) {
      if (!text) { flash(btn, "剪贴板为空"); return; }
      loadText(text, "剪贴板内容");
      flash(btn, "✓ 已粘贴");
    }).catch(function () {
      /* 权限被拒时退化成聚焦输入框让用户手动 ⌘V */
      flash(btn, "✗ 无权限");
      src.focus();
    });
  });

  /* .md / .txt 拖进页面任意位置都算打开；
     dragover/enter/drop 必须 preventDefault，否则浏览器直接导航离开 */
  ["dragover", "dragenter"].forEach(function (name) {
    document.addEventListener(name, function (e) {
      e.preventDefault();
    });
  });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  /* ---------- 拖动分隔条 ---------- */
  var dragging = false;
  $("split").addEventListener("mousedown", function (e) {
    e.preventDefault();
    dragging = true;
    $("split").classList.add("drag");
    document.body.classList.add("dragging");
  });
  window.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    var r = layout.getBoundingClientRect();
    var pct = (e.clientX - r.left) / r.width;
    pct = Math.min(0.85, Math.max(0.15, pct));
    document.body.style.setProperty("--ratio", (pct * 100).toFixed(2) + "%");
  });
  window.addEventListener("mouseup", function () {
    if (!dragging) return;
    dragging = false;
    $("split").classList.remove("drag");
    document.body.classList.remove("dragging");
    document.body.classList.add("resized");   /* 定格这一次的比例 */
    saveRatio();
  });

  /* ---------- 启动 ---------- */
  /* file:// 双击打开时 fetch 来不了项目文件，
     退化成兜底示例；HTTP 访问时 sample.md 一定拿得到 */
  var FALLBACK = [
    "# Markdown 转 PDF",
    "",
    "这是一个示例文档。支持 **加粗**、*斜体*、`行内代码`、[链接](https://example.com)。",
    "",
    "## 特性列表",
    "",
    "- 标题、段落、列表、引用、表格",
    "- 围栏代码块带轻量语法高亮",
    "- 任务列表 `- [x]`",
    "",
    "| 列一 | 列二 |",
    "| --- | --- |",
    "| 甲 | 乙 |",
    "",
    "> 引用块会保留在 PDF 里",
    "",
    "```js",
    "console.log('Hello, PDF');",
    "```"
  ].join("\n");

  (function boot() {
    applyPageCss();
    src.value = FALLBACK;
    doRender();
    fetch("sample.md").then(function (r) {
      return r.ok ? r.text() : Promise.reject(new Error(r.status));
    }).then(function (text) {
      /* 只在用户还没动过内容时才覆盖 */
      if (src.value === FALLBACK) { loadText(text, "sample.md"); }
    }).catch(function () { /* 拿不到就维持 FALLBACK，不算错误场景 */ });

    /* 上次拖过的分栏比例一并恢复（只存比例，不存内容） */
    var ratio = null;
    try { ratio = localStorage.getItem(STORE_KEY + "-ratio"); } catch (e) {}
    if (ratio) {
      document.body.style.setProperty("--ratio", ratio);
      document.body.classList.add("resized");
    }
  })();

  function saveRatio() {
    try {
      localStorage.setItem(STORE_KEY + "-ratio",
        document.body.style.getPropertyValue("--ratio"));
    } catch (e) {}
  }

})();
</script>
</body>
</html>
