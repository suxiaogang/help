<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>九宫格 / 六宫格切图</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;          /* 整页不滚动，各区块自己管 */
    }

    /* ---------- 页头 ---------- */
    header {
      flex: 0 0 auto;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: .3px;
    }

    header .hint {
      font-size: 12px;
      color: var(--muted);
    }

    /* ---------- 两列布局：各占一半，整屏铺满 ---------- */
    .layout {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
      min-height: 0;            /* 关键：允许子项收缩，才不会出现外层滚动条 */
    }

    .column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .column.left  { border-right: 1px solid var(--border); }

    .col-head {
      flex: 0 0 auto;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .col-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .col-head b { color: var(--accent); font-family: var(--mono); }

    /* ---------- 按钮 ---------- */
    button {
      font: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      transition: background .15s, border-color .15s, opacity .15s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #232c39; border-color: #3a4557; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #062315;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }

    /* ---------- 左列：上传区 ---------- */
    .drop {
      flex: 0 0 auto;
      margin: 10px 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background-color .2s;
    }
    .drop:hover,
    .drop.dragover {
      border-color: var(--accent);
      background: rgba(61, 214, 140, .06);
    }
    /* 横向排布：图标 + 文字，替代竖排，省掉一截高度 */
    .drop .inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: left;
    }
    .drop .icon { font-size: 22px; line-height: 1; flex: 0 0 auto; }
    .drop .text { color: var(--muted); font-size: 11.5px; line-height: 1.45; }
    .drop .text b { color: var(--text); }
    .drop input[type="file"] { display: none; }

    /* ---------- 左列：选项 ---------- */
    /* 空间不够时优先压缩下方的预览区，而不是压缩这里：
       flex-shrink 设为 0，选项区始终保持完整高度、不出内部滚动条，
       视口变矮时由 .preview-pair 吸收压缩（它的 min-height 很低）。 */
    .options {
      flex: 0 0 auto;
      max-height: 64vh;
      overflow-y: auto;
      padding: 0 14px 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      border-bottom: 1px solid var(--border);
      align-content: start;
    }

    .field { grid-column: span 2; }
    .field.half { grid-column: span 1; }

    .field > label {
      display: block;
      margin: 0 0 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    select, input[type="color"] {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 9px;
      font: inherit;
      font-size: 12px;
      height: 34px;
      outline: none;
      cursor: pointer;
    }
    input[type="color"] { padding: 3px; }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, .15);
    }

    /* 模式 A / B：两列并排，省掉一整行的高度。
       容器够宽才并排；窄屏（卡片会挤到逐字换行）回退成一列。 */
    .radio-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 1100px) {
      .radio-group { grid-template-columns: 1fr; }
    }

    .radio {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 8px 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color .15s, background-color .15s;
      min-width: 0;
    }
    .radio:hover { border-color: #3a4557; }
    .radio input {
      width: 15px; height: 15px;
      margin: 1px 0 0;
      flex: 0 0 auto;
      accent-color: var(--accent);
    }
    .radio:has(input:checked) {
      border-color: var(--accent);
      background: rgba(61, 214, 140, .07);
    }
    .radio .rt {
      display: block;
      font-size: 11.5px;
      color: var(--text);
      font-weight: 600;
      line-height: 1.35;
    }
    .radio .rd {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.35;
      margin-top: 2px;
      /* 说明文字压成一行并截断，避免窄容器下逐字换行撑高卡片 */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 置灰不可用：模式 A 用不到背景色，但保留占位以免布局跳动 */
    .field.off > label,
    .field.off input { opacity: .4; }
    .field.off input { cursor: not-allowed; }

    .hidden { display: none !important; }

    /* ---------- 左列：原图 + 正方形画布 并排 ----------
       这块只是辅助核对，不是主要输出，所以高度压到最小：
       flex-grow 为 0，不跟选项区抢空间；剩余高度宁可留白，
       也不让选项区被迫出现滚动条。 */
    .preview-pair {
      flex: 1 1 auto;          /* 可伸缩，作为左列的压缩缓冲 */
      min-height: 56px;
      max-height: 20vh;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 14px;
      overflow: hidden;
    }

    .pv {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
    }

    .pv-head {
      flex: 0 0 auto;
      padding: 4px 8px;
      font-size: 10.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 6px;
      white-space: nowrap;
    }
    .pv-head span:first-child { overflow: hidden; text-overflow: ellipsis; }
    .pv-head span:last-child { font-family: var(--mono); flex: 0 0 auto; }

    /* 图片区：确定高度 + object-fit，图片完整落在框内不裁切 */
    .pv-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      overflow: hidden;
    }
    .pv-body img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      background: #0a0d12;
    }

    /* ---------- 右列：切片网格 ---------- */
    /* 网格整体居中且永不滚动：
       格子边长由 JS 按可用宽高算出（见 fitSliceGrid），
       写进 --cell 后由 grid 直接消费。 */
    .slice-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      overflow: hidden;
    }

    /* 固定 3 列：九宫格正好 3×3，六宫格是 2 行 × 3 列 */
    .slice-grid {
      --cols: 3;
      --rows: 3;
      --gap: 5px;
      --cell-w: 120px;
      --cell-h: 120px;
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--cell-w));
      grid-template-rows: repeat(var(--rows), var(--cell-h));
      gap: var(--gap);
      flex: 0 0 auto;
    }

    .slice-cell {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .slice-cell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .slice-cell .dim {
      position: absolute;
      right: 4px;
      bottom: 4px;
      background: rgba(0, 0, 0, .72);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 5px;
      pointer-events: none;
    }

    /* ---------- 占位提示 ---------- */
    .placeholder {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      line-height: 2;
      user-select: none;
    }
    .placeholder .big { font-size: 34px; display: block; margin-bottom: 4px; opacity: .5; }

    /* 小格子里的占位：去掉大图标和换行，压成一行 */
    .pv-body .placeholder {
      font-size: 10.5px;
      line-height: 1.4;
    }
    .pv-body .placeholder .big { display: none; }
    .pv-body .placeholder br { display: none; }

    /* ---------- 底部信息 + 状态 ---------- */
    .meta-bar {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 38px;
    }
    .meta-bar b { color: var(--text); font-weight: 600; font-family: var(--mono); }

    .status {
      flex: 0 0 auto;
      padding: 7px 16px;
      font-size: 11.5px;
      line-height: 1.45;
      border-top: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
    }
    .status.error { color: var(--danger); }
    .status.ok    { color: var(--accent); }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .status.error .dot { background: var(--danger); }
    .status.ok .dot    { background: var(--accent); }

    /* ---------- 响应式：窄屏改上下，允许整页滚动 ---------- */
    @media (max-width: 820px) {
      html, body { height: auto; }
      body { overflow: visible; }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      .column.left {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .source-wrap { min-height: 180px; max-height: 40vh; }
      .square-wrap { height: auto; min-height: 220px; }

      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>九宫格 / 六宫格切图</h1>
    <span class="hint">切成 9 张或 6 张用于朋友圈 · 全部在本地浏览器完成，图片不上传</span>
  </header>

  <div class="layout">

    <!-- ================= 左列：输入与设置 ================= -->
    <section class="column left">

      <div class="col-head"><span>选择图片</span></div>

      <div class="drop" id="drop">
        <div class="inner">
          <div class="icon">🖼️</div>
          <div class="text"><b>点击选择图片</b>，或拖拽到这里<br />也可 Ctrl/⌘ + V 粘贴</div>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/*" />
      </div>

      <div class="options">
        <div class="field">
          <label>预处理模式</label>
          <div class="radio-group">
            <label class="radio" title="模式 A：居中裁剪成宫格比例。朋友圈最常用，裁掉多余区域，图像不失真、不拉伸。">
              <input type="radio" name="mode" value="crop" checked />
              <span>
                <span class="rt">模式 A · 居中裁剪</span>
                <span class="rd">朋友圈最常用，不拉伸不失真</span>
              </span>
            </label>
            <label class="radio" title="模式 B：完整保留原图，空白处用背景色填充，不裁掉任何内容。">
              <input type="radio" name="mode" value="pad" />
              <span>
                <span class="rt">模式 B · 完整保留</span>
                <span class="rd">空白处填充背景，不裁内容</span>
              </span>
            </label>
          </div>
        </div>

        <div class="field half" id="bgColorField">
          <label for="bgColor">填充背景色</label>
          <input type="color" id="bgColor" value="#ffffff" />
        </div>

        <div class="field half">
          <label for="layout">宫格数量</label>
          <select id="layout">
            <option value="3x3" selected>九宫格 3×3（9 张）</option>
            <option value="2x3">六宫格 2×3（6 张）</option>
          </select>
        </div>

        <div class="field half">
          <label for="tileSize">单格边长</label>
          <select id="tileSize">
            <option value="360">360 px</option>
            <option value="600">600 px</option>
            <option value="700" selected>700 px</option>
            <option value="1000">1000 px</option>
          </select>
        </div>

        <div class="field half">
          <label for="format">输出格式</label>
          <select id="format">
            <option value="image/jpeg" selected>JPG（最高质量）</option>
            <option value="image/png">PNG（无损）</option>
          </select>
        </div>
      </div>

      <div class="col-head"><span>预览</span></div>

      <div class="preview-pair">
        <div class="pv">
          <div class="pv-head"><span>原图</span><span id="origDim"></span></div>
          <div class="pv-body" id="sourceWrap"></div>
        </div>
        <div class="pv">
          <div class="pv-head"><span>切分画布</span><span id="squareDim"></span></div>
          <div class="pv-body" id="squareWrap"></div>
        </div>
      </div>

      <div class="status" id="status"><span class="dot"></span><span id="statusText">等待选择图片…</span></div>
    </section>

    <!-- ================= 右列：输出 ================= -->
    <section class="column right">

      <div class="col-head">
        <span id="sliceTitle">九宫格切片（按顺序发布）</span>
        <div class="actions">
          <button type="button" id="generateBtn" disabled>重新生成</button>
          <button type="button" class="primary" id="downloadBtn" disabled>批量下载</button>
        </div>
      </div>

      <div class="slice-wrap" id="sliceWrap"></div>

      <div class="meta-bar" id="metaBar"></div>
    </section>
  </div>

  <script>
  (function () {
    "use strict";

    /* ============================================================
       常量
       ============================================================ */

    /** 可选宫格：键为 "行数x列数" */
    var LAYOUTS = {
      "3x3": { rows: 3, cols: 3, label: "九宫格 · 3 行 × 3 列" },
      "2x3": { rows: 2, cols: 3, label: "六宫格 · 2 行 × 3 列" }
    };

    /** JPG 固定最高质量导出 */
    var JPEG_QUALITY = 1;

    /* ============================================================
       DOM
       ============================================================ */

    var drop        = document.getElementById("drop");
    var fileInput   = document.getElementById("fileInput");
    var bgColorField= document.getElementById("bgColorField");
    var bgColor     = document.getElementById("bgColor");
    var layoutSel   = document.getElementById("layout");
    var tileSizeSel = document.getElementById("tileSize");
    var formatSel   = document.getElementById("format");

    var origDim     = document.getElementById("origDim");
    var sourceWrap  = document.getElementById("sourceWrap");
    var squareWrap  = document.getElementById("squareWrap");
    var squareDim   = document.getElementById("squareDim");
    var sliceWrap   = document.getElementById("sliceWrap");
    var sliceTitle  = document.getElementById("sliceTitle");
    var metaBar     = document.getElementById("metaBar");
    var generateBtn = document.getElementById("generateBtn");
    var downloadBtn = document.getElementById("downloadBtn");
    var statusEl    = document.getElementById("status");
    var statusText  = document.getElementById("statusText");

    /* ============================================================
       状态
       ============================================================ */

    var sourceImage  = null;   // 原图（ImageBitmap 或 HTMLImageElement）
    var sourceUrl    = null;   // 原图预览用的 blob URL
    var squareCanvas = null;   // 预处理后的正方形画布
    var slices       = [];     // 切片结果：[{ row, col, name, url, size, w, h }]

    /* 生成令牌：连续快速改选项会触发多次 generate() 交叠执行，
       每次 await toBlob 都可能让位。用令牌丢弃过期结果，
       保证界面永远显示最后一次设置的结果。 */
    var genToken = 0;

    /* ============================================================
       工具
       ============================================================ */

    function setStatus(text, kind) {
      statusText.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / 1024 / 1024).toFixed(2) + " MB";
    }

    function isJpeg() {
      return formatSel.value === "image/jpeg";
    }

    /** 返回带前导点的扩展名，如 ".jpg" */
    function fileExt() {
      return isJpeg() ? ".jpg" : ".png";
    }

    /* 下载进行中的切片 URL 暂不回收。
       批量下载要几秒，期间重新生成会调用 revokeSliceUrls()，
       如果把正在下载的 URL 提前 revoke，下载会中断。 */
    var busyUrls = {};

    function revokeSliceUrls() {
      slices.forEach(function (s) {
        if (s.url && !busyUrls[s.url]) URL.revokeObjectURL(s.url);
      });
      slices = [];
    }

    function canvasToBlob(canvas, type, q) {
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error("导出失败"));
        }, type, q);
      });
    }

    /** 空状态占位内容，每次重建避免留下游离节点 */
    function placeholderHTML(text) {
      return '<div class="placeholder"><span class="big">🖼️</span>' + text + '</div>';
    }

    /* ============================================================
       加载图片
       ------------------------------------------------------------
       createImageBitmap 通常比 <img> 解码快得多，且能按 EXIF 自动摆正方向，
       这对大图和手机拍摄的照片很重要。
       ============================================================ */

    async function loadImageFile(file) {
      if (!file || !/^image\//.test(file.type)) throw new Error("请选择图片文件");
      if (file.size > 40 * 1024 * 1024) throw new Error("图片超过 40MB，请先压缩后再试");

      if (typeof createImageBitmap === "function") {
        try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
        catch (e) { return await createImageBitmap(file); }
      }

      return await new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve(img); };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error("图片解码失败，文件可能已损坏"));
        };
        img.src = url;
      });
    }

    /* ============================================================
       核心：生成中间画布
       ------------------------------------------------------------
       画布尺寸 = 单格边长 × cols 宽、× rows 高。

       这样切出来的每一片恰好是 tileSize × tileSize 的正方形：
         九宫格 3×3 → 画布 3t × 3t（正方形），每片 t × t
         六宫格 2×3 → 画布 3t × 2t（3:2 横图），每片同样是 t × t

       六宫格如果沿用正方形画布，3 列 × 2 行切出来会是 2:3 的竖长块，
       所以这里画布跟着宫格走，而不是固定正方形。
       ============================================================ */

    function buildCanvas(img, tileSize, rows, cols, mode, bg) {
      var iw = img.width;
      var ih = img.height;

      var cw = tileSize * cols;
      var ch = tileSize * rows;

      var canvas = document.createElement("canvas");
      canvas.width  = cw;
      canvas.height = ch;

      var ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      var targetRatio = cw / ch;

      if (mode === "crop") {
        /* 模式 A：居中裁剪成目标比例（不拉伸）
           取能放进原图的最大目标比例矩形，长的方向裁掉多余部分，
           等比映射，不产生形变。 */
        var srcRatio = iw / ih;
        var sx, sy, sw, sh;

        if (srcRatio > targetRatio) {
          // 源图更宽 → 以高度为准，裁掉左右
          sh = ih;
          sw = ih * targetRatio;
          sx = (iw - sw) / 2;
          sy = 0;
        } else {
          // 源图更高 → 以宽度为准，裁掉上下
          sw = iw;
          sh = iw / targetRatio;
          sx = 0;
          sy = (ih - sh) / 2;
        }

        // 裁剪 + 缩放合并为一次 drawImage，省掉中间大画布
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      } else {
        /* 模式 B：完整保留原图，空白处填充背景色 */
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, cw, ch);

        var scale = Math.min(cw / iw, ch / ih);   // contain 等比缩放
        var dw = iw * scale;
        var dh = ih * scale;
        ctx.drawImage(img, 0, 0, iw, ih, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      }

      return canvas;
    }

    /* ============================================================
       核心：切割
       ------------------------------------------------------------
       画布边长对 rows 和 cols 都能整除，所以每片宽高都是整数且完全一致，
       边界落在整数像素上，不会出现半像素接缝。
       ============================================================ */

    function sliceCanvas(square, layout) {
      var rows = layout.rows;
      var cols = layout.cols;
      var stepW = square.width  / cols;
      var stepH = square.height / rows;
      var out = [];

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var cv = document.createElement("canvas");
          cv.width  = stepW;
          cv.height = stepH;

          var ctx = cv.getContext("2d");

          // JPG 没有透明通道，先铺白底，否则透明区域会变成黑色
          if (isJpeg()) {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, stepW, stepH);
          }

          // 源矩形与目标矩形尺寸一致，1:1 拷贝，像素严格对齐
          ctx.drawImage(square, c * stepW, r * stepH, stepW, stepH, 0, 0, stepW, stepH);

          out.push({
            row: r + 1,
            col: c + 1,
            canvas: cv,
            name: "row" + (r + 1) + "-col" + (c + 1) + fileExt()
          });
        }
      }

      return out;
    }

    /* ============================================================
       生成流程
       ============================================================ */

    async function generate() {
      if (!sourceImage) {
        setStatus("请先选择一张图片", "error");
        return;
      }

      var token = ++genToken;
      generateBtn.disabled = true;
      setStatus("正在处理…");

      // 让浏览器先把「正在处理」画出来，再执行同步的 Canvas 计算
      await sleep(16);
      if (token !== genToken) return;   // 已有更新的请求，放弃这次

      try {
        var layout   = LAYOUTS[layoutSel.value] || LAYOUTS["3x3"];
        var tileSize = parseInt(tileSizeSel.value, 10) || 700;

        /* 「单格边长」按每片宽度理解，即列宽 = size / cols。
           画布边长先取 tileSize × cols，再向上取整到 rows 与 cols 的最小公倍数，
           保证行列都能整除、每片等宽等高，同时避免画布被无谓放大。
             3×3：700×3 = 2100（能被 3 整除）→ 每片 700×700
             2×3：700×3 = 2100（能被 2 整除）→ 每片 700×1050 */
        var mode = document.querySelector('input[name="mode"]:checked').value;

        // ① 中间画布：cols × rows 个单格，每格 tileSize × tileSize 正方形
        squareCanvas = buildCanvas(sourceImage, tileSize, layout.rows, layout.cols, mode, bgColor.value);

        // ② 按宫格切分
        var list = sliceCanvas(squareCanvas, layout);

        // ③ 转成 blob（先收进局部数组，确认没被新请求取代后再提交到 slices）
        var staged = [];
        for (var i = 0; i < list.length; i++) {
          var blob = await canvasToBlob(list[i].canvas, formatSel.value, JPEG_QUALITY);
          staged.push({
            row: list[i].row,
            col: list[i].col,
            name: list[i].name,
            url: URL.createObjectURL(blob),
            size: blob.size,
            w: list[i].canvas.width,
            h: list[i].canvas.height
          });
        }

        // 期间又发起了新的生成请求，直接丢弃本轮结果并回收已建的 URL
        if (token !== genToken) {
          staged.forEach(function (s) { URL.revokeObjectURL(s.url); });
          return;
        }

        revokeSliceUrls();
        slices = staged;

        // ④ 更新界面
        var sliceW = squareCanvas.width  / layout.cols;
        var sliceH = squareCanvas.height / layout.rows;

        squareDim.textContent = squareCanvas.width + " × " + squareCanvas.height;
        showSquarePreview(squareCanvas);

        sliceTitle.textContent = layout.label + " 切片（按顺序发布）";
        renderSliceGrid();
        downloadBtn.disabled = false;
        generateBtn.disabled = false;

        var total = slices.reduce(function (n, s) { return n + s.size; }, 0);
        setMeta(layout, sliceW, sliceH, total);

        setStatus(
          slices.length + " 张 · 每张 " + sliceW + "×" + sliceH +
          " · " + formatBytes(total) +
          " · " + (mode === "crop" ? "模式 A" : "模式 B"),
          "ok"
        );
      } catch (err) {
        if (token !== genToken) return;
        revokeSliceUrls();
        slices = [];
        downloadBtn.disabled = true;
        renderSliceGrid();
        setMeta(null);
        setStatus("失败：" + (err && err.message ? err.message : err), "error");
      } finally {
        if (token === genToken) generateBtn.disabled = false;
      }
    }

    function showSquarePreview(canvas) {
      // 缩到 ≤1200px 的预览图，交给 CSS 按可用空间显示，避免大 canvas 转 dataURL 卡顿
      var maxSide = 1200;
      var scale = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
      var pc = document.createElement("canvas");
      pc.width  = Math.max(1, Math.round(canvas.width * scale));
      pc.height = Math.max(1, Math.round(canvas.height * scale));
      var pctx = pc.getContext("2d");
      pctx.imageSmoothingQuality = "high";
      pctx.drawImage(canvas, 0, 0, pc.width, pc.height);

      var img = new Image();
      img.alt = "正方形画布预览";
      img.src = pc.toDataURL("image/png");

      squareWrap.innerHTML = "";
      squareWrap.appendChild(img);
    }

    function renderSliceGrid() {
      sliceWrap.innerHTML = "";

      if (!slices.length) {
        sliceWrap.innerHTML = placeholderHTML("选择图片后自动生成切片");
        return;
      }

      var grid = document.createElement("div");
      grid.className = "slice-grid";

      slices.forEach(function (s) {
        var cell = document.createElement("div");
        cell.className = "slice-cell";

        var img = document.createElement("img");
        img.src = s.url;
        img.alt = s.name;
        img.loading = "lazy";

        var dim = document.createElement("span");
        dim.className = "dim";
        dim.textContent = s.w + "×" + s.h;

        cell.appendChild(img);
        cell.appendChild(dim);
        grid.appendChild(cell);
      });

      sliceWrap.appendChild(grid);
      fitSliceGrid();
    }

    /**
     * 按可用空间算出格子尺寸，写进 --cell-w / --cell-h。
     *
     * 两个要点：
     * 1) 格子必须保持切片的真实宽高比。九宫格切出的是方图，格子取正方形；
     *    六宫格切出的是 2:3 竖图，格子也要是 2:3，否则 object-fit:contain
     *    会在两侧留出空白，预览比例就和实际下载的文件对不上了。
     * 2) 尺寸由可用宽高反算，而不是靠列数均分 + aspect-ratio，
     *    这样网格总尺寸永远落在容器内，不会出现滚动条。
     */
    function fitSliceGrid() {
      var grid = sliceWrap.querySelector(".slice-grid");
      if (!grid) return;

      var layout = LAYOUTS[layoutSel.value] || LAYOUTS["3x3"];
      var cols = layout.cols;
      var rows = layout.rows;

      // 以实际切片为准拿宽高比；没有切片时用 rows/cols 推导
      var ratio = slices.length
        ? slices[0].w / slices[0].h
        : rows / cols;

      var cs = getComputedStyle(sliceWrap);
      var availW = sliceWrap.clientWidth
                 - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var availH = sliceWrap.clientHeight
                 - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

      var gap = parseFloat(getComputedStyle(grid).gap) || 5;

      // 先按宽度定出 cellW，再由宽高比推出 cellH，两个约束取较小者
      var cellW = Math.min(
        (availW - gap * (cols - 1)) / cols,
        ((availH - gap * (rows - 1)) / rows) * ratio
      );
      cellW = Math.max(36, cellW);           // 下限，避免极端窄屏缩到不可辨识

      var cellH = cellW / ratio;

      grid.style.setProperty("--cols", cols);
      grid.style.setProperty("--rows", rows);
      grid.style.setProperty("--cell-w", Math.floor(cellW) + "px");
      grid.style.setProperty("--cell-h", Math.floor(cellH) + "px");
    }

    // 视口变化时重算格子边长
    window.addEventListener("resize", fitSliceGrid);

    function setMeta(layout, w, h, total) {
      if (!layout) {
        metaBar.innerHTML = "<span>等待选择图片</span>";
        return;
      }
      var parts = [
        "张数 <b>" + slices.length + "</b>",
        "画布 <b>" + layout.rows + " 行 × " + layout.cols + " 列</b>",
        "每张 <b>" + w + "×" + h + "</b>",
        "合计 <b>" + formatBytes(total) + "</b>",
        "格式 <b>" + (isJpeg() ? "JPG" : "PNG") + "</b>"
      ];
      metaBar.innerHTML = parts.map(function (p) { return "<span>" + p + "</span>"; }).join("");
    }

    /* ============================================================
       批量下载
       ------------------------------------------------------------
       浏览器对「一次触发多个下载」有频率限制，逐个下载并加短延时最稳。
       ============================================================ */

    async function downloadAll() {
      if (!slices.length) return;

      /* 先快照一份再下载。
         逐个下载要几秒，期间用户若改了参数会触发重新生成并替换 slices，
         直接遍历 slices 会把新旧两批文件混着下出来（扩展名都可能对不上）。 */
      var batch = slices.slice();

      downloadBtn.disabled = true;
      var original = downloadBtn.textContent;

      try {
        for (var i = 0; i < batch.length; i++) {
          var s = batch[i];
          busyUrls[s.url] = true;          // 标记占用，防止被中途回收

          var a = document.createElement("a");
          a.href = s.url;
          a.download = s.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          downloadBtn.textContent = "下载中 " + (i + 1) + " / " + batch.length + "…";
          await sleep(260);
        }
        setStatus(batch.length + " 张已全部下载完成", "ok");
      } finally {
        // 本批全部下载完，释放标记
        batch.forEach(function (s) { delete busyUrls[s.url]; });
        downloadBtn.textContent = original;
        downloadBtn.disabled = false;
      }
    }

    /* ============================================================
       文件选择
       ============================================================ */

    async function handleFile(file) {
      setStatus("正在读取图片…");

      try {
        if (sourceUrl) { URL.revokeObjectURL(sourceUrl); sourceUrl = null; }
        sourceImage = await loadImageFile(file);

        /* 预览用 URL 单独创建：
           createImageBitmap 走的是位图，没有 .src 可用，
           直接用 img.src 会导致预览裂图。 */
        sourceUrl = URL.createObjectURL(file);
        origDim.textContent = sourceImage.width + " × " + sourceImage.height;

        var img = new Image();
        img.alt = "原图预览";
        img.src = sourceUrl;
        sourceWrap.innerHTML = "";
        sourceWrap.appendChild(img);

        generateBtn.disabled = false;

        // 换图后旧的切片失效（同时作废可能还在跑的上一轮生成）
        genToken++;
        revokeSliceUrls();
        slices = [];
        renderSliceGrid();
        downloadBtn.disabled = true;
        setMeta(null);
        squareWrap.innerHTML = "";
        squareDim.textContent = "";

        // 选完图直接出结果，无需手动点生成
        await generate();
      } catch (err) {
        genToken++;
        sourceImage = null;
        sourceWrap.innerHTML = placeholderHTML("读取失败，请换一张图片");
        generateBtn.disabled = true;
        downloadBtn.disabled = true;
        revokeSliceUrls();
        slices = [];
        renderSliceGrid();
        setMeta(null);
        squareWrap.innerHTML = "";
        squareDim.textContent = "";
        setStatus(err && err.message ? err.message : "读取失败", "error");
      }
    }

    /* ============================================================
       事件
       ============================================================ */

    drop.addEventListener("click", function () { fileInput.click(); });

    fileInput.addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault();
        drop.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      drop.addEventListener(ev, function () { drop.classList.remove("dragover"); });
    });
    drop.addEventListener("drop", function (e) {
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });

    document.addEventListener("paste", function (e) {
      if (!e.clipboardData || !e.clipboardData.items) return;
      for (var i = 0; i < e.clipboardData.items.length; i++) {
        if (e.clipboardData.items[i].type.indexOf("image/") === 0) {
          var f = e.clipboardData.items[i].getAsFile();
          if (f) { handleFile(f); e.preventDefault(); }
          break;
        }
      }
    });

    /* 参数变化后自动重新生成，切片始终与当前设置一致 */
    function regenerateIfReady() {
      if (sourceImage) generate();
    }

    /* 模式 A 用不到背景色：置灰禁用而非隐藏，
       避免切换模式时这一格塌陷、整块选项重新排版。 */
    function syncBgField() {
      var isPad = document.querySelector('input[name="mode"]:checked').value === "pad";
      bgColorField.classList.toggle("off", !isPad);
      bgColor.disabled = !isPad;
    }

    Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'), function (radio) {
      radio.addEventListener("change", function () {
        syncBgField();
        regenerateIfReady();
      });
    });
    syncBgField();

    bgColor.addEventListener("input", function () {
      if (!this.disabled) regenerateIfReady();
    });
    layoutSel.addEventListener("change", regenerateIfReady);
    tileSizeSel.addEventListener("change", regenerateIfReady);
    formatSel.addEventListener("change", regenerateIfReady);

    generateBtn.addEventListener("click", generate);
    downloadBtn.addEventListener("click", downloadAll);

    /* 初始状态 */
    sourceWrap.innerHTML = placeholderHTML("选择图片后<br>这里显示原图");
    squareWrap.innerHTML = placeholderHTML("选择图片后<br>这里显示切分画布");
    renderSliceGrid();
    metaBar.innerHTML = "<span>等待选择图片</span>";
    setStatus("等待选择图片…");
  })();
  </script>
</body>
</html>
