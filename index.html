<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具箱</title>
  <meta name="description" content="单文件纯前端小工具集合：图片处理、视频转 GIF、常用命令速查，数据不离开浏览器" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    /* 与各工具子页面共用同一套色板，改这里即可整体换肤 */
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      flex: 0 0 auto; padding: 11px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header .hint { font-size: 12px; color: var(--muted); }

    /* 主区：整块滚动，页脚常驻在底部 */
    main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 22px 22px; }

    /* 分节标题：沿用子页面 .col-head 的字号与配色 */
    .sec + .sec { margin-top: 20px; }
    .sec-h {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: .5px;
      padding-bottom: 7px; margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .sec-h .ico { font-size: 14px; line-height: 1; }
    .sec-h .n { font-weight: 400; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
      gap: 12px;
    }

    .tool {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 13px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: inherit; text-decoration: none;
      transition: background .15s, border-color .15s;
    }
    .tool:hover {
      background: var(--panel-2);
      border-color: var(--accent);
      text-decoration: none;
    }
    .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tool .ico { font-size: 19px; line-height: 1.2; flex: 0 0 auto; }
    .tool .tx { min-width: 0; }
    .tool .name { display: block; font-size: 13px; font-weight: 600; }
    .tool .d { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .tool .path {
      display: block; font-family: var(--mono); font-size: 10.5px;
      color: var(--muted); opacity: .7; margin-top: 6px;
      overflow-wrap: anywhere;
    }

    footer {
      flex: 0 0 auto; padding: 9px 20px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3542; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4557; }

    @media (max-width: 720px) {
      html, body { height: auto; }
      body { overflow: visible; }
      header { padding: 11px 14px; }
      main { padding: 6px 14px 20px; overflow: visible; }
      .grid { grid-template-columns: minmax(0, 1fr); }
      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>工具箱</h1>
    <span class="hint">全部为单文件纯前端页面 · 点开即用 · 数据不离开浏览器</span>
  </header>

  <main>
    <!-- 这里只是分节的外层容器，不能带 .grid 类：
         真正的列布局由每个 .sec 内部的 .grid 负责，
         否则会变成「外层网格排 section、内层网格排卡片」的嵌套。 -->
    <div id="grid"></div>
  </main>

  <footer>
    <span class="dot"></span><span id="statusText">加载中…</span>
  </footer>

<script>
/* ==========================================================================
 *  ①  工具清单 —— 日常只需要改这里
 * ========================================================================== *
 *
 *  { g, name, desc, href, icon }
 *    g     所属分组，取值见下方 GROUPS 的 id
 *    name  卡片标题
 *    desc  一句话说明
 *    href  页面文件名（同目录下）
 *    icon  卡片图标（emoji）
 *
 *  分组顺序由 GROUPS 决定；组内顺序按「编辑 → 处理 → 导出」这类
 *  使用流程排列。加新工具：在 TOOLS 里加一项，再把 g 指向某个分组。
 *  若 g 漏写或指向不存在的分组，该工具会被收进「其它」一节而不是消失。
 * ========================================================================== */

var GROUPS = [
	{ id: "image", name: "图片处理", icon: "🖼️" },
	{ id: "video", name: "视频", icon: "🎬" },
	{ id: "text", name: "文字与字符画", icon: "🔤" },
	{ id: "dev", name: "开发工具", icon: "🛠️" },
	{ id: "doc", name: "速查手册", icon: "📚" },
];

var TOOLS = [
	{
		g: "image",
		name: "Base64 转图片",
		desc: "粘贴 Base64 或 Markdown 图片语法，实时预览并下载",
		href: "image-base64.html",
		icon: "🖼️"
	},
	{
		g: "image",
		name: "图片编辑器",
		desc: "调整图像与画布尺寸，支持框选裁剪、居中裁正方形",
		href: "image-editor.html",
		icon: "🎛️"
	},
	{
		g: "image",
		name: "图片滤镜",
		desc: "灰度、棕色、模糊、浮雕、锐化、噪点、像素化",
		href: "image-filter.html",
		icon: "🎨"
	},
	{
		g: "image",
		name: "九宫格切图",
		desc: "切成九宫格或六宫格，纯本地处理不上传",
		href: "image-clip.html",
		icon: "✂️"
	},
	{
		g: "image",
		name: "图片合并",
		desc: "多图合并成长图，可设间距、边框与透明背景",
		href: "image-merge.html",
		icon: "🧩"
	},
	{
		g: "image",
		name: "模板拼图",
		desc: "按模板把多张图片拼成一张，可拖动、缩放调整每张图",
		href: "image-collage.html",
		icon: "🧩"
	},
	{
		g: "image",
		name: "图片压缩转换",
		desc: "转成 WebP / JPEG 显著减小体积，支持批量与打包下载",
		href: "image-compress.html",
		icon: "🗜️"
	},
	{
		g: "image",
		name: "图片转 GIF",
		desc: "多张照片合成动图，可拖拽调整帧顺序、设置帧间隔与尺寸",
		href: "image-gif.html",
		icon: "🎞️"
	},
	{
		g: "image",
		name: "ICNS 图标转换",
		desc: "把图片打包成 macOS .icns 应用图标，含 Retina 尺寸",
		href: "image-icns.html",
		icon: "🍎"
	},
	{
		g: "video",
		name: "视频转 GIF",
		desc: "按时间点逐帧抽取视频合成动图，帧顺序可拖拽调整",
		href: "video-gif.html",
		icon: "🎬"
	},
	{
		g: "video",
		name: "视频抽帧",
		desc: "从视频中抽出单帧画面，按时间定位、逐帧微调后导出",
		href: "video-frame.html",
		icon: "📸"
	},
	{
		g: "text",
		name: "ASCII Banner 生成器",
		desc: "用 FIGlet 将文字转成 ASCII 横幅，支持多种字体和间距",
		href: "ascii-banners.html",
		icon: "🎨"
	},
	{
		g: "text",
		name: "ASCII 表格生成器",
		desc: "快速格式化 ASCII 表格，支持多种输出样式和注释",
		href: "ascii-tables.html",
		icon: "📊"
	},
	{
		g: "text",
		name: "Image to ASCII Art",
		desc: "将图片转换为 ASCII 艺术字，支持实时预览和多种字符集",
		href: "ascii-image.html",
		icon: "🖼️"
	},
	{
		g: "text",
		name: "中文汉字转 ASCII 字符画",
		desc: "将中文文字渲染为 ASCII 字符画，支持多种中文字体与参数调节",
		href: "ascii-chinese.html",
		icon: "🔤"
	},
	{
		g: "text",
		name: "特殊符号速查",
		desc: "常用特殊符号分类速查，点击即可复制",
		href: "symbols.html",
		icon: "✨"
	},
	{
		g: "dev",
		name: "User Agent 分析",
		desc: "解析 UA 字符串，识别浏览器、操作系统、设备类型",
		href: "user-agent.html",
		icon: "🔍"
	},
	{
		g: "doc",
		name: "常用命令速查",
		desc: "Bash、Git、macOS 命令与快捷键，点击任意一条即可复制",
		href: "commands.html",
		icon: "📋"
	},
];
/* ==========================================================================
 *  ②  渲染逻辑
 * ========================================================================== */

(function () {
	"use strict";

	/* 旧书签兼容 ------------------------------------------------------------
	   原首页就是速查页，深链形如 index.html#git。拆分之后内容搬到了
	   commands.html，这里把这类旧链接接过去，避免书签失效。
	   COMMAND_CATS 与 commands.html 里的 DATA[].id 保持一致；
	   在那边新增分类时记得同步这里。 */
	var COMMAND_CATS = ["bash", "git", "macos"];
	var oldCat = location.hash.replace(/^#/, "");
	if (oldCat && COMMAND_CATS.indexOf(oldCat) >= 0) {
		location.replace("commands.html#" + oldCat);
		return;
	}

	function esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
		});
	}

	function toolHTML(t) {
		return '<a class="tool" href="' + esc(t.href) + '">' +
			'<span class="ico" aria-hidden="true">' + esc(t.icon || "🔧") + "</span>" +
			'<span class="tx">' +
				'<span class="name">' + esc(t.name) + "</span>" +
				'<span class="d">' + esc(t.desc || "") + "</span>" +
				'<span class="path">' + esc(t.href) + "</span>" +
			"</span>" +
			"</a>";
	}

	// 按 GROUPS 的顺序分节渲染。TOOLS 里 g 找不到归属的（比如以后新增时
	// 忘了写 g）统一收进「其它」，不会被悄悄丢掉。
	var sections = GROUPS.map(function (g) {
		return { g: g, list: TOOLS.filter(function (t) { return t.g === g.id; }) };
	}).filter(function (s) { return s.list.length; });

	var known = GROUPS.map(function (g) { return g.id; });
	var orphans = TOOLS.filter(function (t) { return known.indexOf(t.g) < 0; });
	if (orphans.length) sections.push({ g: { id: "_", name: "其它", icon: "🗂️" }, list: orphans });

	document.getElementById("grid").innerHTML = sections.map(function (s) {
		return '<section class="sec">' +
			'<div class="sec-h">' +
				'<span class="ico" aria-hidden="true">' + esc(s.g.icon) + "</span>" +
				"<span>" + esc(s.g.name) + "</span>" +
				'<span class="n">' + s.list.length + " 个</span>" +
			"</div>" +
			'<div class="grid">' + s.list.map(toolHTML).join("") + "</div>" +
			"</section>";
	}).join("");

	document.getElementById("statusText").textContent =
		"共 " + TOOLS.length + " 个工具 · 无需安装、无需联网、图片与视频均不上传";
})();
</script>
</body>
</html>
