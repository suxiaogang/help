<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>常用命令速查</title>
<meta name="description" content="常用命令速查手册：Bash、Git、macOS 快捷键与小工具导航">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2324292f'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%23fff' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   样式基调：GitHub Gist（GitHub Primer）
   --------------------------------------------------------------------------
   下面的颜色全部取自 Primer 官方 tokens（@primer/primitives light 主题），
   不是凭印象调的近似色。要换配色只需改这一处变量。
   ========================================================================== */
:root {
	/* 画布与表面 */
	--canvas-default:  #ffffff;   /* bgColor-default   页面 / 卡片底色 */
	--canvas-subtle:   #f6f8fa;   /* bgColor-muted     代码块、卡片头部、按钮 */
	--canvas-inset:    #f6f8fa;   /* bgColor-inset     备注块 */

	/* 文字 */
	--fg-default:      #1f2328;   /* fgColor-default   正文 */
	--fg-muted:        #59636e;   /* fgColor-muted     次要说明 */
	--fg-subtle:       #818b98;   /* 三级文字 */

	/* 边框 */
	--border-default:  #d1d9e0;   /* borderColor-default */
	--border-muted:    #d1d9e0b3; /* borderColor-muted   半透明，用于内部细线 */
	--border-subtle:   #d1d9e0;

	/* 强调色 */
	--accent-fg:       #0969da;   /* fgColor-accent */
	--accent-emphasis: #0969da;   /* bgColor-accent-emphasis */
	--neutral-muted:   #818b981f; /* bgColor-neutral-muted  中性悬停底色 */
	--success-fg:      #1a7f37;   /* fgColor-success */
	--success-emphasis:#1f883d;
	--success-muted:   #dafbe1;   /* bgColor-success-muted  复制成功底色 */

	/* 阴影（Primer shadow-resting-small） */
	--shadow-small:  0 1px 1px 0 #1f23280a, 0 1px 2px 0 #1f232808;

	/* 尺寸 */
	--radius-small: 6px;
	--radius-med:   6px;
	--wrap:         1012px;   /* GitHub 内容区宽度 */

	/* 字体栈，取自 Primer fontStack */
	--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
	        "Liberation Mono", monospace;
	--sans: "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI",
	        "Noto Sans", Helvetica, Arial, sans-serif,
	        "Apple Color Emoji", "Segoe UI Emoji";

	--stick-h: 96px;   /* 吸顶区高度，用于锚点留白 */
}

/* ==========================================================================
   1. 基础
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

html {
	-webkit-text-size-adjust: 100%;
	scroll-behavior: smooth;
}

body {
	margin: 0;
	background: var(--canvas-default);
	color: var(--fg-default);
	font: 14px/1.5 var(--sans);   /* Primer body-medium：14px / 1.5 */
	-webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }
b, strong { font-weight: 600; }

a { color: var(--accent-fg); text-decoration: none; }
a:hover { text-decoration: underline; }

[id] { scroll-margin-top: var(--stick-h); }

.wrap {
	width: 100%;
	max-width: var(--wrap);
	margin: 0 auto;
	padding: 0 16px;
}

/* GitHub 里可聚焦元素的统一焦点环 */
:focus-visible {
	outline: 2px solid var(--accent-emphasis);
	outline-offset: -1px;
}

.sr-only {
	position: absolute;
	width: 1px; height: 1px;
	padding: 0; margin: -1px;
	overflow: hidden;
	clip: rect(0, 0, 0, 0);
	white-space: nowrap;
	border: 0;
}

/* ==========================================================================
   2. 吸顶：页头 + Tab
   Gist 顶栏也是一条细下边框的浅色栏，这里沿用同样处理
   ========================================================================== */
.sticky {
	position: -webkit-sticky;
	position: sticky;
	top: 0;
	z-index: 50;
	background: var(--canvas-default);
	border-bottom: 1px solid var(--border-default);
}

.topbar {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 12px;
	padding: 16px 0 0;
}

.topbar h1 {
	font-size: 16px;
	font-weight: 600;
	color: var(--fg-default);
}

.topbar .tagline {
	font-size: 12px;
	color: var(--fg-muted);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

/* ---- Tab：GitHub 代码页那种「下划线式」标签 ---- */
.tabs {
	display: flex;
	gap: 4px;
	overflow-x: auto;
	scrollbar-width: none;
	margin-top: 4px;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
	flex: 0 0 auto;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 8px 12px;
	margin-bottom: -1px;           /* 压在容器下边框上 */
	border: 0;
	border-bottom: 2px solid transparent;
	border-radius: var(--radius-small) var(--radius-small) 0 0;
	background: transparent;
	color: var(--fg-default);
	font: inherit;
	font-size: 14px;
	line-height: 20px;
	cursor: pointer;
	white-space: nowrap;
	transition: border-color .12s, background-color .12s;
}
.tab:hover { background: var(--canvas-subtle); }

.tab[aria-selected="true"] {
	font-weight: 600;
	border-bottom-color: var(--accent-emphasis);
}
.tab .ico { font-size: 15px; line-height: 1; }

/* ==========================================================================
   3. 内容区
   ========================================================================== */
/* 内容区只调「纵向」留白。
   注意：这里必须用 padding-top/padding-bottom 长写，不能用 padding 简写——
   .page 与 .wrap 同权重、且位置在后，简写里的左右 0 会把 .wrap 的
   左右 16px 内边距一起清掉，导致卡片在移动端直接贴到屏幕边缘。 */
.page {
	padding-top: 20px;
	padding-bottom: 0;
}

.panel { display: none; }
.panel.is-active { display: block; }

.panel-head {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 12px;
	flex-wrap: wrap;
	/* 分类标题靠 .wrap 的水平内边距对齐顶部标题与小工具标题，这里不要再加缩进 */
	/* 与上方 .page 的 padding-top 相呼应，让标题上下留白看起来一致 */
	margin-bottom: 20px;
}
.panel-head h2 {
	font-size: 16px;
	font-weight: 600;
	line-height: 1.4;
	letter-spacing: -.1px;
}
.panel-head .count { font-size: 12px; color: var(--fg-muted); }

/* ---- 分组：Gist 文件框的样式 ---- */
.group {
	border: 1px solid var(--border-default);
	border-radius: var(--radius-med);
	margin-bottom: 16px;
	overflow: hidden;
	background: var(--canvas-default);
}

/* 头部用等宽字体，呼应 Gist 文件框顶部那条 monospace 文件头 */
.group-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 10px;
	padding: 8px 12px;
	background: var(--canvas-subtle);
	border-bottom: 1px solid var(--border-default);
}
.group-head h3 {
	font-family: var(--mono);
	font-size: 12px;
	font-weight: 600;
	color: var(--fg-default);
	letter-spacing: -.2px;
}
.group-head .meta { font-size: 12px; color: var(--fg-muted); white-space: nowrap; }

.group-body { padding: 4px 0; }

/* ==========================================================================
   4. 复制行
   ========================================================================== */
.copy {
	display: flex;
	align-items: center;
	gap: 8px;
	width: 100%;
	padding: 6px 12px;
	border: 0;
	background: transparent;
	color: inherit;
	font: inherit;
	text-align: left;
	cursor: pointer;
	transition: background-color .1s;
}
.copy:hover { background: var(--canvas-subtle); }
.copy[data-copied] { background: var(--success-muted); }

/* 代码块：GitHub 的 f6f8fa 底、1px 边框、6px 圆角、13px 等宽字 */
.copy .code {
	flex: 1 1 auto;
	min-width: 0;
	font-family: var(--mono);
	font-size: 13px;
	line-height: 20px;
	color: var(--fg-default);
	background: var(--canvas-subtle);
	border: 1px solid var(--border-default);
	border-radius: var(--radius-small);
	padding: 4px 10px;
	overflow-x: auto;
	white-space: nowrap;
	scrollbar-width: thin;
}

/* 右侧复制图标 */
.copy .mark {
	flex: 0 0 auto;
	color: var(--fg-muted);
	display: flex;
	align-items: center;
}
.copy .mark svg { display: block; }
.copy:hover .mark { color: var(--accent-fg); }
.copy .mark .done { display: none; color: var(--success-fg); }
.copy[data-copied] .mark .idle { display: none; }
.copy[data-copied] .mark .done { display: block; }

/* ---- 命令 + 说明 ----
   命令列用 max-content：列宽跟着最长的命令走，命令不再被截出滚动条，
   说明列吃掉剩下的全部空间。窄屏（≤900px）两栏会挤，另见下方媒体查询。 */
.rows { display: block; }
.rows .row {
	display: grid;
	grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
	align-items: center;
	gap: 4px 12px;
	border-top: 1px solid var(--border-muted);
}
.rows .row:first-child { border-top: 0; }
.rows .row .desc {
	padding: 4px 12px 4px 0;
	font-size: 12px;
	line-height: 1.5;
	color: var(--fg-muted);
}

/* ---- 快捷键：按键居中 ---- */
.rows.keys .row { grid-template-columns: minmax(0, max-content) minmax(0, 1fr); }
.rows.keys .copy .code {
	white-space: nowrap;
	text-align: center;
	font-weight: 600;
	font-size: 12px;
	color: var(--fg-default);
	background: var(--canvas-default);
	border-color: var(--border-subtle);
}

/* ---- 备注块（多行说明） ---- */
.note { border-top: 1px solid var(--border-muted); padding: 12px; }
.note:first-child { border-top: 0; }
.note-title {
	font-family: var(--mono);
	font-size: 12px;
	font-weight: 600;
	color: var(--fg-muted);
	margin-bottom: 6px;
}

.term {
	position: relative;
	background: var(--canvas-inset);
	border: 1px solid var(--border-default);
	border-radius: var(--radius-med);
	font-family: var(--mono);
	font-size: 12px;
	line-height: 1.625;
	color: var(--fg-default);
}
.term pre {
	margin: 0;
	padding: 10px 12px;
	overflow-x: auto;
	white-space: pre;
	tab-size: 4;
}

/* 「复制整段」做成 GitHub 小按钮：浅灰底 + 边框 + 内阴影 */
.copy-inline {
	position: absolute;
	top: 6px;
	right: 6px;
	padding: 3px 8px;
	border: 1px solid var(--border-default);
	border-radius: var(--radius-small);
	background: var(--canvas-subtle);
	color: var(--fg-default);
	font: inherit;
	font-size: 12px;
	font-weight: 500;
	line-height: 16px;
	cursor: pointer;
	box-shadow: var(--shadow-small);
	opacity: 0;
	transition: opacity .12s, background-color .12s, border-color .12s;
}
.term:hover .copy-inline,
.copy-inline:focus-visible { opacity: 1; }
/* 悬停用官方的 bgColor-neutral-muted，而不是手写的灰 */
.copy-inline:hover { background: var(--neutral-muted); }
.copy-inline[data-copied] {
	opacity: 1;
	background: var(--success-muted);
	border-color: var(--success-emphasis);
	color: var(--success-fg);
}

/* 触屏没有 hover，直接常显 */
@media (hover: none) { .copy-inline { opacity: 1; } }

/* ==========================================================================
   5. 小工具区
   ========================================================================== */
/* 这里不能用 margin 简写，否则会覆盖 .wrap 的 margin: 0 auto 而贴到屏幕左侧 */
.tools {
	margin-top: 8px;
	margin-bottom: 32px;
	margin-left: auto;
	margin-right: auto;
}
.tools > h2 {
	font-size: 16px;
	font-weight: 600;
	margin-bottom: 4px;
}
.tools > p.hint {
	font-size: 12px;
	color: var(--fg-muted);
	margin-bottom: 12px;
}

.tool-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
	gap: 12px;
}

.tool {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	padding: 12px;
	background: var(--canvas-default);
	border: 1px solid var(--border-default);
	border-radius: var(--radius-med);
	color: inherit;
	transition: border-color .12s, background-color .12s;
}
.tool:hover {
	text-decoration: none;
	background: var(--canvas-subtle);
}
.tool .ico { font-size: 18px; line-height: 1.3; flex: 0 0 auto; }
.tool .name { font-size: 14px; font-weight: 600; color: var(--accent-fg); }
.tool .d { display: block; font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
.tool .path {
	display: block;
	font-family: var(--mono);
	font-size: 11px;
	color: var(--fg-subtle);
	margin-top: 6px;
	overflow-wrap: anywhere;
}

footer {
	border-top: 1px solid var(--border-default);
	padding: 16px 0 32px;
	text-align: center;
	font-size: 12px;
	color: var(--fg-muted);
}

/* ==========================================================================
   6. 两栏改上下堆叠
   --------------------------------------------------------------------------
   实测（Chrome，内容区 1012px）：最长的命令需要约 845px 才能不出现横向滚动条，
   所以 1012px 以下两栏已经没有意义——1024px 视口下命令列会被挤到 93px，
   命令全都要横向滚动。因此宽度不足 1080px 时直接改为上下堆叠。
      1440 / 1280 / 1152px → 两栏（命令列 325/552/215px，说明列 ≥364px）
      ≤1080px              → 堆叠（命令占满一行，说明另起一行）
   ========================================================================== */
@media (max-width: 1080px) {
	/* 命令一行、说明一行 */
	.rows .row,
	.rows.keys .row {
		grid-template-columns: minmax(0, 1fr);
		gap: 2px;
		padding-bottom: 6px;
	}
	/* 说明文字与代码框左边框对齐：代码框边框落在 .copy 的内边距处 */
	.rows .row .desc,
	.rows.keys .row .desc {
		padding: 0 12px;
		font-size: 12px;
	}
	.rows.keys .copy .code { text-align: left; }
}

/* ==========================================================================
   7. 移动端
   ========================================================================== */
@media (max-width: 720px) {
	:root { --stick-h: 88px; }

	/* 手机屏幕窄，左右留白收窄到 14px（用长写，避免清掉 .wrap 的纵向内边距） */
	.wrap {
		padding-left: 14px;
		padding-right: 14px;
	}

	.topbar { padding-top: 12px; }
	.topbar h1 { font-size: 15px; }
	.topbar .tagline { display: none; }

	.tab { padding: 8px 10px; }

	/* 手机端上下留白同步收窄，标题字号保持 16px 不再放大 */
	.page { padding-top: 16px; }
	.panel-head { margin-bottom: 16px; }

	.group-head { padding: 7px 10px; }
	.group-head .meta { display: none; }

	.copy { padding: 6px 10px; }
	.copy .code { font-size: 12px; padding: 4px 8px; }

	/* 命令条已占满整行，纵向空间充裕、横向没有，改为折行显示，
	   长命令不再需要左右拖动（复制内容取自 data-copy，不受折行影响） */
	.copy .code,
	.rows.keys .copy .code {
		white-space: pre-wrap;
		overflow-wrap: anywhere;
		overflow-x: visible;
	}

	/* 与上面的堆叠规则同步收窄左内边距，保持与代码框左边缘对齐 */
	.rows .row .desc,
	.rows.keys .row .desc { padding: 0 10px; }

	.note { padding: 10px; }
	.term { font-size: 11.5px; }
	.tool-grid { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
	html { scroll-behavior: auto; }
	* { transition: none !important; }
}

/* ==========================================================================
   8. 打印
   ========================================================================== */
@media print {
	.sticky { position: static; border-bottom: 1px solid #ccc; }
	.tabs, .tools, .copy .mark, .copy-inline { display: none !important; }
	.panel { display: block !important; }
	.group { break-inside: avoid; }
	.term pre { white-space: pre-wrap; }
}
</style>
</head>
<body>

<!-- ======================= 吸顶：页头 + Tab ======================= -->
<header class="sticky">
	<div class="wrap">
		<div class="topbar">
			<h1>常用命令速查</h1>
			<span class="tagline">点击任意命令即可复制</span>
		</div>
		<nav class="tabs" id="tabs" role="tablist" aria-label="命令分类"></nav>
	</div>
</header>

<!-- ======================= 内容区（由 JS 渲染） ======================= -->
<main class="wrap page" id="panels"></main>

<!-- ======================= 小工具链接区 ======================= -->
<section class="wrap tools" id="tools">
	<h2>小工具</h2>
	<p class="hint">放在本目录下的单文件工具页面，点开即用。</p>
	<div class="tool-grid" id="toolGrid"></div>
</section>

<footer class="wrap">
	<span id="footNote">共 0 条内容</span>
</footer>

<div class="sr-only" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
 *  ①  数据区 —— 日常只需要改这里
 * ==========================================================================
 *
 *  DATA 是分类数组，每一项是一个分类（对应顶部一个 Tab）：
 *
 *    { id, name, icon, blocks: [...] }
 *      id      锚点 / URL hash，同时也是 deep link，如 index.html#git
 *      name    Tab 上显示的名字
 *      icon    Tab 上的小图标（emoji，可省略）
 *      blocks  该分类下的分组卡片数组
 *
 *  block 有两种写法：
 *
 *    1) 命令 / 快捷键列表
 *       { g: "分组标题", items: [...] }
 *
 *       item 里二选一：
 *         cmd   要复制的命令（渲染成可点击复制的代码条）
 *         k     要复制的快捷键（渲染成居中的按键条）
 *
 *       另外可选：
 *         d     右侧的说明文字
 *         h     这一条上面的小标题（用来给多条命令做段落分隔）
 *
 *    2) 纯文本备注（整段复制，保留缩进）
 *       { g: "分组标题", notes: [{ title: "小标题", text: "内容" }] }
 *
 *  想加一条命令，就在对应 items 里加一行 { cmd: "...", d: "..." } 即可。
 * ========================================================================== */

var DATA = [
	/* ---------------------------- Bash ---------------------------- */
	{
		id: "bash",
		name: "Bash",
		icon: "⌨️",
		blocks: [
			{
				g: "文件与目录",
				items: [
					{ cmd: "pwd",       d: "显示当前所在目录（print working directory）" },
					{ cmd: "ls",        d: "列出当前目录下的文件" },
					{ cmd: "ls -alh",   d: "列出全部文件，含隐藏文件、权限、人类可读的大小" },
					{ cmd: "cd /",      d: "进入根目录" },
					{ cmd: "cd ~",      d: "回到自己的家目录（只敲 cd 也可以）" },
					{ cmd: "cd ..",     d: "回到上一级目录" },
					{ cmd: "cd -",      d: "回到刚才所在的目录" },
					{ cmd: "cd /var/www", d: "直接进入某个完整路径（这里以 /var/www 为例）" },
					{ cmd: "cp file foo",    d: "复制文件：把 file 复制成 foo，原文件保留" },
					{ cmd: "cp -r dir foo",  d: "递归复制整个目录" },
					{ cmd: "mv file foo",    d: "重命名：把 file 改名成 foo" },
					{ cmd: "mv foo ~/Desktop", d: "移动：把 foo 移动到桌面（不改名）" },
					{ cmd: "rm file",   d: "删除文件" },
					{ cmd: "rmdir dir", d: "删除空目录" },
					{ cmd: "rm -rf dir", d: "递归强制删除目录及其中所有内容，危险，务必确认路径" },
					{ cmd: "mkdir music", d: "新建一个目录" },
					{ cmd: "man man",   d: "查看某个命令的手册，这里是查看 man 自己" }
				]
			},
			{
				g: "压缩与解压",
				items: [
					{ cmd: "tar xvf wordpress.tar",        d: "解压 tar 格式的文件" },

					"复制整段" +
				"</button>" +
				"<pre>" + esc(note.text) + "</pre>" +
			"</div>" +
			"</div>";
	}

	function blockHTML(block) {
		var isKeys = !!(block.items && block.items.length && block.items[0].k != null);
		var body, count;

		if (block.items) {
			count = block.items.length;
			body = '<div class="rows' + (isKeys ? " keys" : "") + '">' +
				block.items.map(itemHTML).join("") + "</div>";
		} else {
			var notes = block.notes || [];
			count = notes.length;
			body = notes.map(noteHTML).join("");
		}

		return '<section class="group">' +
			'<div class="group-head"><h3>' + esc(block.g || "") + "</h3>" +
				'<span class="meta">' + count + (block.items ? " 条" : " 段") + "</span></div>" +
			'<div class="group-body">' + body + "</div>" +
			"</section>";
	}

	function panelHTML(cat) {
		var blocks = cat.blocks || [];
		var total = blocks.reduce(function (n, b) {
			return n + (b.items ? b.items.length : (b.notes || []).length);
		}, 0);

		return '<section class="panel" id="panel-' + esc(cat.id) + '" role="tabpanel"' +
			' aria-labelledby="tab-' + esc(cat.id) + '" tabindex="0">' +
			'<div class="panel-head"><h2>' + esc(cat.name) + "</h2>" +
				'<span class="count">' + blocks.length + " 个分组 · " + total + " 条内容</span></div>" +
			blocks.map(blockHTML).join("") +
			"</section>";
	}

	function tabHTML(cat, index) {
		return '<button type="button" class="tab" role="tab" id="tab-' + esc(cat.id) + '"' +
			' aria-controls="panel-' + esc(cat.id) + '" aria-selected="false"' +
			' tabindex="' + (index === 0 ? "0" : "-1") + '" data-tab="' + esc(cat.id) + '">' +
			(cat.icon ? '<span class="ico" aria-hidden="true">' + esc(cat.icon) + "</span>" : "") +
			"<span>" + esc(cat.name) + "</span>" +
			"</button>";
	}

	/* ---------- 渲染整页 ---------- */
	function render() {
		tabsEl.innerHTML   = DATA.map(tabHTML).join("");
		panelsEl.innerHTML = DATA.map(panelHTML).join("");

		gridEl.innerHTML = TOOLS.map(function (t) {
			return '<a class="tool" href="' + esc(t.href) + '">' +
				'<span class="ico" aria-hidden="true">' + esc(t.icon || "🔧") + "</span>" +
				"<span>" +
					'<span class="name">' + esc(t.name) + "</span>" +
					'<span class="d">' + esc(t.desc || "") + "</span>" +
					'<span class="path">' + esc(t.href) + "</span>" +
				"</span>" +
				"</a>";
		}).join("");

		var grand = DATA.reduce(function (n, c) {
			return n + (c.blocks || []).reduce(function (m, b) {
				return m + (b.items ? b.items.length : (b.notes || []).length);
			}, 0);
		}, 0);
		footEl.textContent = DATA.length + " 个分类 · " + grand + " 条内容 · " +
			TOOLS.length + " 个小工具";
	}

	/* ---------- 分类切换 ---------- */
	var tabEls = [];

	function activate(id, opts) {
		opts = opts || {};
		var found = DATA.some(function (c) { return c.id === id; });
		if (!found) id = DATA.length ? DATA[0].id : "";

		tabEls.forEach(function (t) {
			var on = t.dataset.tab === id;
			t.setAttribute("aria-selected", on ? "true" : "false");
			t.tabIndex = on ? 0 : -1;
		});

		[].forEach.call(panelsEl.children, function (p) {
			p.classList.toggle("is-active", p.id === "panel-" + id);
		});

		if (opts.scrollIntoView) {
			var active = tabsEl.querySelector('.tab[data-tab="' + id + '"]');
			if (active && active.scrollIntoView) {
				active.scrollIntoView({ block: "nearest", inline: "center" });
			}
		}
		if (opts.updateHash !== false && location.hash !== "#" + id) {
			history.replaceState(null, "", "#" + id);
		}
	}

	/* ---------- 复制 ---------- */
	function fallbackCopy(text) {
		var ta = document.createElement("textarea");
		ta.value = text;
		ta.setAttribute("readonly", "");
		ta.style.position = "fixed";
		ta.style.top = "-1000px";
		document.body.appendChild(ta);
		ta.select();
		var ok = false;
		try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
		document.body.removeChild(ta);
		return ok;
	}

	function copy(text) {
		if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
			return navigator.clipboard.writeText(text).then(
				function () { return true; },
				function () { return fallbackCopy(text); }
			);
		}
		return Promise.resolve(fallbackCopy(text));
	}

	function flash(btn, label) {
		if (!btn) return;
		var prev = btn.textContent;
		btn.setAttribute("data-copied", "1");
		if (btn.classList.contains("copy-inline")) btn.textContent = "已复制 ✓";
		clearTimeout(btn._t);
		btn._t = setTimeout(function () {
			btn.removeAttribute("data-copied");
			if (btn.classList.contains("copy-inline")) btn.textContent = prev;
		}, 1200);
		toastEl.textContent = (label.length > 40 ? label.slice(0, 40) + "…" : label) + " 已复制";
	}

	function handleCopy(btn, text) {
		copy(text).then(function (ok) {
			if (ok) flash(btn, text);
			else toastEl.textContent = "复制失败，请手动选中后复制";
		});
	}

	/* ---------- 事件绑定 ---------- */

	// Tab：点击
	tabsEl.addEventListener("click", function (e) {
		var btn = e.target.closest ? e.target.closest(".tab") : null;
		if (btn) activate(btn.dataset.tab, { scrollIntoView: true });
	});

	// Tab：键盘方向键（符合 tablist 习惯）
	tabsEl.addEventListener("keydown", function (e) {
		if (["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(e.key) === -1) return;
		var current = -1;
		tabEls.forEach(function (t, i) {
			if (t.getAttribute("aria-selected") === "true") current = i;
		});
		if (current < 0) return;
		e.preventDefault();
		var next = current;
		if (e.key === "ArrowLeft")  next = (current - 1 + tabEls.length) % tabEls.length;
		if (e.key === "ArrowRight") next = (current + 1) % tabEls.length;
		if (e.key === "Home")       next = 0;
		if (e.key === "End")        next = tabEls.length - 1;
		activate(tabEls[next].dataset.tab, { scrollIntoView: true });
		tabEls[next].focus();
	});

	// 复制：统一事件委托
	document.addEventListener("click", function (e) {
		if (!e.target.closest) return;

		var inline = e.target.closest("[data-copy-inline]");
		if (inline) { handleCopy(inline, inline.getAttribute("data-copy-inline")); return; }

		var btn = e.target.closest("[data-copy]");
		if (btn) handleCopy(btn, btn.getAttribute("data-copy"));
	});

	// 浏览器前进 / 后退
	window.addEventListener("hashchange", function () {
		activate(location.hash.replace(/^#/, ""));
	});

	/* ---------- 启动 ---------- */
	render();
	tabEls = [].slice.call(tabsEl.querySelectorAll(".tab"));
	activate(location.hash.replace(/^#/, "") || (DATA[0] && DATA[0].id) || "");
})();
</script>
</body>
</html>
