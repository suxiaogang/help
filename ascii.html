<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII Banner Generator</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --line: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --preview-bg: #191a1c;
      --preview-fg: #bdbec3;
      --radius: 14px;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body { padding: 24px 18px 32px; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .controls, .output-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .text-field { grid-column: 1 / -1; }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    textarea, select, input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #10151c;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      outline: none;
      height: 41px;
    }

    textarea:focus, select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.15);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
      font-family: var(--mono);
      line-height: 1.4;
    }

    .output-card { padding: 12px; }

    .output-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .output-head label { margin: 0; }

    .output-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .output-tools button { flex: 0 0 auto; }

    .status {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status.error { color: var(--danger); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: #062315;
      height: 41px;
    }

    button:hover { background: var(--accent-2); }

    button.ghost {
      background: #273140;
      color: var(--text);
    }

    button.ghost:hover { background: #324155; }

    pre {
      margin: 0;
      background: var(--preview-bg);
      color: var(--preview-fg);
      border-radius: 10px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.15;
      white-space: pre;
      overflow-x: auto;
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      background: var(--preview-bg);
      z-index: 20;
      display: none;
      padding: 24px;
    }

    .fullscreen.open { display: block; }

    .fullscreen pre {
      min-height: calc(100vh - 90px);
    }

    .fullscreen .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .status { display: none; }
      .output-head { flex-direction: column; align-items: flex-start; gap: 8px; }
      .output-tools { width: 100%; justify-content: space-between; }
      .output-tools button { flex: 1; }
      button span { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Create ASCII text banners online</h1>
    <p class="sub">用 FIGlet 将文字转成 ASCII 横幅。输入文本、选择字体与间距即可实时生成。</p>

    <section class="controls">
      <div class="text-field">
        <label for="bannerText">Banner text / 横幅文本</label>
        <textarea id="bannerText" spellcheck="false">Hello</textarea>
      </div>
      <div>
        <label for="fontSelect">Font / 字体</label>
        <select id="fontSelect"></select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button type="button" class="ghost" id="randomFontBtn"><span>Pick Random / </span>随机选择</button>
      </div>
      <div>
        <label for="hLayout">Horizontal / 水平间距</label>
        <select id="hLayout">
          <option value="default">Normal</option>
          <option value="full">Wide</option>
          <option value="fitted">Fitted</option>
          <option value="controlled smushing">Narrow</option>
          <option value="universal smushing">Squeezed</option>
        </select>
      </div>
      <div>
        <label for="vLayout">Vertical / 垂直间距</label>
        <select id="vLayout">
          <option value="default">Normal</option>
          <option value="full">Wide</option>
          <option value="fitted">Fitted</option>
          <option value="controlled smushing">Narrow</option>
          <option value="universal smushing">Squeezed</option>
        </select>
      </div>
    </section>

    <section class="output-card">
      <div class="output-head">
        <label>Banner / 输出</label>
        <div class="output-tools">
          <span class="status" id="status">Loading fonts…</span>
          <button type="button" class="ghost" id="fullscreenBtn"><span></span>Fullscreen / </span>全屏</button>
          <button type="button" id="copyBtn"><span>Copy / </span>复制</button>
        </div>
      </div>
      <pre id="output" aria-live="polite"></pre>
    </section>
  </div>

  <div class="fullscreen" id="fullscreen">
    <div class="bar">
      <strong>ASCII Banner</strong>
      <button type="button" class="ghost" id="closeFullscreen">Close / 关闭</button>
    </div>
    <pre id="fullscreenOutput"></pre>
  </div>

  <script type="module">
    import figlet from "https://cdn.jsdelivr.net/npm/figlet@1.11.4/dist/figlet.mjs";

    const FONT_CDN = "https://cdn.jsdelivr.net/npm/figlet@1.11.4/fonts";
    const FEATURED = [
      "Standard", "ANSI Shadow", "Big", "Slant", "Doom", "Bloody", "DOS Rebel",
      "Calvin S", "3D-ASCII", "Banner3-D", "Colossal", "Doh", "Isometric1",
      "Nancyj", "Patorjk's Cheese", "Roman", "Star Wars", "Sub-Zero", "Tinker-Toy"
    ];

    figlet.defaults({
      font: "Standard",
      fontPath: FONT_CDN,
      fetchFontIfMissing: true
    });

    const els = {
      text: document.getElementById("bannerText"),
      font: document.getElementById("fontSelect"),
      hLayout: document.getElementById("hLayout"),
      vLayout: document.getElementById("vLayout"),
      output: document.getElementById("output"),
      status: document.getElementById("status"),
      copy: document.getElementById("copyBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      fullscreen: document.getElementById("fullscreen"),
      fullscreenOutput: document.getElementById("fullscreenOutput"),
      closeFullscreen: document.getElementById("closeFullscreen"),
      randomFontBtn: document.getElementById("randomFontBtn")
    };

    let allFonts = [];
    let lastBanner = "";
    let renderToken = 0;

    function setStatus(message, isError = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
    }

    function fillFonts(fonts) {
      const featured = FEATURED.filter((name) => fonts.includes(name));
      const rest = fonts
        .filter((name) => !featured.includes(name))
        .sort((a, b) => a.localeCompare(b));

      const current = els.font.value;
      els.font.replaceChildren();

      const addGroup = (label, items) => {
        if (!items.length) return;
        const group = document.createElement("optgroup");
        group.label = label;
        for (const name of items) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          group.appendChild(option);
        }
        els.font.appendChild(group);
      };

      addGroup("Featured / 精选", featured);
      addGroup("All fonts / 全部", rest);

      if ([...els.font.options].some((opt) => opt.value === current)) {
        els.font.value = current;
      } else if (fonts.includes("Standard")) {
        els.font.value = "Standard";
      } else if (els.font.options.length) {
        els.font.selectedIndex = 0;
      }

      if (els.font.value && els.font.value !== current) scheduleRender();
    }

    async function render() {
      const token = ++renderToken;
      const text = els.text.value || " ";
      const font = els.font.value || "Standard";
      setStatus(`Rendering ${font}…`);

      try {
        const banner = await figlet.text(text, {
          font,
          horizontalLayout: els.hLayout.value,
          verticalLayout: els.vLayout.value
        });
        if (token !== renderToken) return;
        lastBanner = banner;
        els.output.textContent = banner;
        els.fullscreenOutput.textContent = banner;
        setStatus(`${font} · ${banner.split("\n").length} lines`);
      } catch (error) {
        if (token !== renderToken) return;
        lastBanner = "";
        els.output.textContent = "";
        els.fullscreenOutput.textContent = "";
        setStatus(error?.message || "Failed to render banner", true);
      }
    }

    let timer = 0;
    function scheduleRender() {
      clearTimeout(timer);
      timer = setTimeout(render, 80);
    }

    async function copyBanner() {
      if (!lastBanner) return;
      try {
        await navigator.clipboard.writeText(lastBanner);
        setStatus("Copied / 已复制");
      } catch {
        setStatus("Copy failed / 复制失败", true);
      }
    }

    function pickRandomFont() {
      if (!allFonts.length) return;
      const randomIndex = Math.floor(Math.random() * allFonts.length);
      const randomFont = allFonts[randomIndex];
      els.font.value = randomFont;
      render();
    }

    els.text.addEventListener("input", scheduleRender);
    els.font.addEventListener("change", render);
    els.hLayout.addEventListener("change", render);
    els.vLayout.addEventListener("change", render);
    els.copy.addEventListener("click", copyBanner);
    els.fullscreenBtn.addEventListener("click", () => els.fullscreen.classList.add("open"));
    els.closeFullscreen.addEventListener("click", () => els.fullscreen.classList.remove("open"));
    els.randomFontBtn.addEventListener("click", pickRandomFont);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") els.fullscreen.classList.remove("open");
    });

    try {
      allFonts = await figlet.fonts();
      fillFonts(allFonts);
      els.font.value = allFonts.includes("Standard") ? "Standard" : allFonts[0];
      setStatus(`${allFonts.length} fonts ready`);
      await figlet.preloadFonts(["Standard"]);
      await render();
    } catch (error) {
      setStatus(error?.message || "Unable to load FIGlet fonts", true);
    }
  </script>
</body>
</html>
