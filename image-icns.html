<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICNS 图标转换</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- 页头 ---------- */
    header {
      flex: 0 0 auto;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px;
    }
    header .hint { font-size: 12px; color: var(--muted); }

    /* ---------- 两列：左窄右宽 ---------- */
    .layout {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(340px, 380px) minmax(0, 1fr);
      min-height: 0;
    }

    .column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .column.left { border-right: 1px solid var(--border); }

    .col-head {
      flex: 0 0 auto;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .col-head .actions { display: flex; gap: 6px; }

    .scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ---------- 按钮 ---------- */
    button {
      font: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    button:hover:not(:disabled) { background: #232c39; border-color: #3a4557; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #062315;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
    button.on { background: var(--accent); border-color: var(--accent); color: #062315; font-weight: 600; }
    button.mini { padding: 4px 9px; font-size: 11px; }

    /* ---------- 左列：上传 ---------- */
    .drop {
      flex: 0 0 auto;
      margin: 7px 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background-color .2s;
    }
    .drop:hover, .drop.dragover { border-color: var(--accent); background: rgba(61, 214, 140, .06); }
    .drop .inner { display: flex; align-items: center; gap: 10px; text-align: left; }
    .drop .icon { font-size: 19px; line-height: 1; flex: 0 0 auto; }
    .drop .text { color: var(--muted); font-size: 11px; line-height: 1.35; }
    .drop .text b { color: var(--text); }
    .drop input[type="file"] { display: none; }

    /* ---------- 面板区块 ---------- */
    .panel { padding: 0 14px 8px; }
    .group + .group { margin-top: 6px; }
    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .4px;
      margin-bottom: 6px;
    }
    .group-title .tools { display: flex; gap: 5px; }

    /* 形状选择 */
    .shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .shape {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 7px 3px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-2);
      cursor: pointer;
      font-size: 11px;
      color: var(--muted);
      transition: border-color .15s, background .15s, color .15s;
      user-select: none;
    }
    .shape:hover { border-color: #3a4557; }
    .shape.on { border-color: var(--accent); background: rgba(61, 214, 140, .12); color: var(--text); }
    .shape canvas { display: block; }

    /* 滑块 */
    .slider-row { display: flex; align-items: center; gap: 9px; }
    input[type="range"] {
      flex: 1 1 auto;
      min-width: 0;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }
    .slider-val {
      flex: 0 0 auto;
      min-width: 42px;
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
    }
    /* 玻璃质感参数行 */
    .gl-params { margin-top: 8px; }
    .gl-row + .gl-row { margin-top: 5px; }
    .gl-name { flex: 0 0 64px; font-size: 11px; color: var(--muted); white-space: nowrap; }
    /* 分段按钮组（玻璃质感等档位选择） */
    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .seg button { padding: 5px 4px; font-size: 11.5px; }
    .seg button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #062315;
      font-weight: 600;
    }

    /* 背景色板 */
    .color-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .color-row .sw2 {
      width: 19px; height: 19px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, .18);
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
    }
    .color-row .sw2:hover { transform: scale(1.12); }
    .color-row .sw2.on {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent);
    }
    .color-row input[type="color"] {
      width: 21px; height: 21px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: none;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .color-row.hidden { display: none; }

    /* 参数下方的补充说明 */
    .hint-line {
      margin-top: 5px;
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--muted);
    }
    .hint-line b { color: var(--text); font-weight: 600; }
    .hint-line.ok { color: var(--accent); }

    /* 尺寸清单：两列排布，省出约 100px 纵向空间 */
    .sizes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }
    .size {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 9px;
      background: var(--panel);
      cursor: pointer;
      transition: background .12s;
      user-select: none;
    }
    .size:hover { background: var(--panel-2); }
    .size input { accent-color: var(--accent); width: 13px; height: 13px; margin: 0; flex: 0 0 auto; cursor: pointer; }
    .size .tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      flex: 0 0 auto;
    }
    .size .dim { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
    .size.retina .tag { color: var(--accent); }

    /* 导出区 */
    .export-box { display: flex; flex-direction: column; gap: 8px; }
    .export-box button { width: 100%; padding: 10px; font-size: 13px; }

    .facts {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.45;
    }
    .facts b { color: var(--text); font-weight: 600; }

    /* ---------- 右列：预览 ---------- */
    .preview {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }
    .empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      padding: 20px;
    }
    .empty .big { font-size: 38px; line-height: 1; opacity: .5; }

    .swatches {
      /* 248(预览窗口) + 20(卡片内边距) + 余量 */
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .sw {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }
    .sw .frame {
      /* 棋盘格，用于显示透明区域 */
      background-image:
        linear-gradient(45deg, #222a36 25%, transparent 25%, transparent 75%, #222a36 75%),
        linear-gradient(45deg, #222a36 25%, transparent 25%, transparent 75%, #222a36 75%);
      background-size: 12px 12px;
      background-position: 0 0, 6px 6px;
      background-color: #161b22;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 预览窗口本身就是「图像边界」，不加内边距。
         若这里留一圈边距，小尺寸图标看起来就像已经加了四周留白。 */
      width: 248px;
      height: 248px;
      padding: 0;
      overflow: hidden;
    }
    /* 舞台 = 图像边界 = 棋盘格范围。
       1× 时位图正好铺满整个舞台，所见即导出结果；
       放大时靠滚动查看，且不会把图像边界顶出卡片。 */
    .sw .stage {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: auto;
    }
    .sw canvas {
      display: block;
      flex: 0 0 auto;
      margin: auto;   /* 居中；放大溢出时也不会裁掉左上角 */
      border-radius: 2px;
    }
    .sw .cap {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      text-align: center;
    }
    .sw.retina .cap { color: var(--accent); }
    .sw .cap2 { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: -4px; }

    /* 结构校验 */
    .inspect { padding: 14px 18px; border-top: 1px solid var(--border); flex: 0 0 auto; }
    .inspect table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
    .inspect th, .inspect td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
    .inspect th { color: var(--muted); font-weight: 600; font-size: 11px; }
    .inspect td { color: var(--text); }
    .inspect td.dim { color: var(--muted); }
    .inspect .ok { color: var(--accent); }
    .inspect .wrap { max-height: 168px; overflow-y: auto; }

    /* ---------- 状态条 ---------- */
    footer {
      flex: 0 0 auto;
      padding: 9px 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    footer .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); flex: 0 0 auto;
    }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3542; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4557; }

    @media (max-width: 820px) {
      html, body { height: auto; }
      body { overflow: visible; }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      .column.left { border-right: none; border-bottom: 1px solid var(--border); }
      .column.left { flex: 0 0 auto; }
      .scroll { overflow: visible; }
      .preview { min-height: 260px; }
      .col-head { flex-wrap: wrap; padding: 10px 12px; }
      .col-head .actions { flex-wrap: wrap; gap: 6px; }
      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ICNS 图标转换</h1>
    <span class="hint">把图片打包成 macOS .icns 应用图标 · 纯前端生成，图片不上传</span>
  </header>

  <div class="layout">

    <!-- ================= 左列：设置 ================= -->
    <section class="column left">

      <div class="drop" id="drop">
        <div class="inner">
          <div class="icon">🍎</div>
          <div class="text"><b>点击选择图片</b>，或拖拽到这里<br />也可 Ctrl/⌘ + V 粘贴</div>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/*" />
      </div>

      <div class="scroll">
        <div class="panel">

          <!-- 图标形状 -->
          <div class="group">
            <div class="group-title"><span>图标形状</span></div>
            <div class="shapes" id="shapes"></div>
          </div>

          <!-- 背景 -->
          <div class="group">
            <div class="group-title"><span>背景</span></div>
            <div class="seg" id="bgSeg">
              <button type="button" data-bg="0" class="on">无</button>
              <button type="button" data-bg="1">纯色</button>
              <button type="button" data-bg="2">渐变</button>
            </div>
            <div class="color-row" id="bgColors"></div>
            <div class="hint-line" id="bgHint"></div>
          </div>

          <!-- 四周留白 -->
          <div class="group">
            <div class="group-title">
              <span>四周留白</span>
              <span class="tools">
                <button type="button" class="mini" id="padStd"
                        title="恢复成 macOS 标准图标网格：每边留白 10%">macOS 标准</button>
              </span>
            </div>
            <div class="slider-row">
              <input type="range" id="padRange" min="0" max="25" step="1" value="10" />
              <span class="slider-val" id="padVal">10%</span>
            </div>
            <div class="hint-line" id="padHint"></div>
          </div>

          <!-- 玻璃质感 -->
          <div class="group">
            <div class="group-title">
              <span>玻璃质感</span>
              <span class="tools">
                <button type="button" class="mini" id="glassReset" style="display:none"
                        title="把当前档位的所有参数恢复成默认值">恢复默认</button>
              </span>
            </div>
            <div class="seg" id="glassSeg">
              <button type="button" data-glass="0" class="on">关闭</button>
              <button type="button" data-glass="1">柔和</button>
              <button type="button" data-glass="2">明显</button>
            </div>
            <div class="hint-line" id="glassHint"></div>
            <div class="gl-params" id="glassParams" hidden></div>
          </div>

          <!-- 包含尺寸 -->
          <div class="group">
            <div class="group-title">
              <span>包含尺寸<small style="color:var(--muted);font-weight:400;margin-left:5px">悬停看用途</small></span>
              <span class="tools">
                <button type="button" class="mini" id="presetAll">全选</button>
                <button type="button" class="mini" id="presetNone">清空</button>
              </span>
            </div>
            <div class="sizes" id="sizeList"></div>
          </div>

          <!-- 导出 -->
          <div class="group">
            <div class="group-title"><span>导出</span></div>
            <div class="export-box">
              <button type="button" class="primary" id="exportBtn" disabled title="无论勾选多少尺寸，都只会下载 1 个 .icns 文件（多尺寸打包在同一个文件内）">生成并下载 .icns</button>
              <div class="facts" id="facts">尚未选择图片</div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ================= 右列：预览 ================= -->
    <section class="column right">

      <div class="col-head">
        <span>尺寸预览</span>
        <div class="actions">
          <button type="button" class="mini" id="zoom1" data-zoom="1">1×</button>
          <button type="button" class="mini" id="zoom2" data-zoom="2">2×</button>
          <button type="button" class="mini" id="zoom4" data-zoom="4">4×</button>
        </div>
      </div>

      <div class="preview" id="preview">
        <div class="empty" id="empty">
          <div class="big">🖼️</div>
          <div>选择一张图片开始</div>
          <div style="font-size:11.5px;color:var(--muted)">建议使用正方形、1024×1024 以上的高清源图</div>
        </div>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="inspect">
        <div class="group-title" style="margin-bottom:6px">
          <span>输出结构</span>
          <span class="tools"><button type="button" class="mini" id="inspectBtn" disabled>解析校验</button></span>
        </div>
        <div class="facts" id="inspectHint">生成后点击「解析校验」，会把 .icns 按块读回来核对。</div>
        <div class="wrap" id="inspectWrap" hidden>
          <table id="inspectTable"></table>
        </div>
      </div>

    </section>
  </div>

  <footer>
    <span class="dot"></span><span id="statusText">等待选择图片…</span>
  </footer>

<script>
(function () {
  "use strict";

  /* =========================================================
     icns 容器格式
     ------------------------------------------------------------
     整体结构（全部大端）：
         'icns'            4 字节魔数
         <文件总长度>      4 字节，含头 8 字节
         随后若干「块」重复：
             <块类型>      4 字节，如 'ic09'
             <块长度>      4 字节，含块头 8 字节
             <负载>        块长度 - 8 字节

     下面列出的块类型负载直接是一整张 PNG，无需任何压缩，
     因此浏览器里用 canvas.toBlob('image/png') 就能拼出来。
     ========================================================= */
  const SIZES = [
    { type: 'ic11', px: 32,   note: "菜单栏" },
    { type: 'ic12', px: 64,   note: "小尺寸" },
    { type: 'ic07', px: 128,  note: "标准尺寸" },
    { type: 'ic08', px: 256,  note: "大尺寸" },
    { type: 'ic09', px: 512,  note: "超大尺寸" },
    { type: 'ic10', px: 1024, note: "最高尺寸" },
    { type: 'ic13', px: 256,  note: "128@2x", retina: true },
    { type: 'ic14', px: 512,  note: "256@2x", retina: true }
  ];

  const SHAPES = [
    { key: "none",     label: "原样" },
    { key: "squircle", label: "圆角" },
    { key: "round",    label: "圆角矩形" },
    { key: "circle",   label: "圆形" }
  ];

  var STAGE = 248;        // 预览窗口边长，须与 .sw .frame 的 CSS 尺寸一致

  /* macOS 标准图标网格：
     实测本机 21 个系统应用图标，主体（不含投影）每边留白中位数 9.8%，
     内容边长 80.5%——换算到 1024 画布正是留白 100px / 内容 824px，
     与 Apple AppIcon 规范一致。滑块取整后取 10%。 */
  var PAD_STD = 10;
  var SVG_NS = "http://www.w3.org/2000/svg";

  // ---- DOM ----
  var drop       = document.getElementById("drop");
  var fileInput  = document.getElementById("fileInput");
  var shapesEl   = document.getElementById("shapes");
  var sizeListEl = document.getElementById("sizeList");
  var padRange   = document.getElementById("padRange");
  var padVal     = document.getElementById("padVal");
  var padHint    = document.getElementById("padHint");
  var exportBtn  = document.getElementById("exportBtn");
  var factsEl    = document.getElementById("facts");
  var swatchesEl = document.getElementById("swatches");
  var emptyEl    = document.getElementById("empty");
  var statusText = document.getElementById("statusText");
  var inspectBtn = document.getElementById("inspectBtn");
  var inspectHint= document.getElementById("inspectHint");
  var inspectWrap= document.getElementById("inspectWrap");
  var inspectTable=document.getElementById("inspectTable");

  // ---- 状态 ----
  var sourceImg = null;      // 原图
  var sourceName = "icon";   // 输出文件名（不含扩展名）
  var shape = "none";
  var bgMode = 0;         // 0 无 / 1 纯色 / 2 渐变
  var bgColor = "#0a84ff";
  var glass = 0;          // 0 关闭 / 1 柔和 / 2 明显
  var padPct = PAD_STD;   // 默认即 macOS 标准网格
  var zoom = 1;
  var picked = {};           // type -> bool
  var lastBytes = null;      // 最近一次生成的 icns

  /* =========================================================
     形状裁剪路径
     ========================================================= */

  // macOS 图标用的是「超椭圆」而非普通圆角矩形，n≈5 时最接近系统观感
  // (x, y) 为内容框左上角，size 为边长——形状必须贴合内容框，
  // 若按整张画布裁切，留白 >0 时图片会被缩到框内、四角原样保留，
  // 看起来就是圆角失效。
  function squirclePath(ctx, x, y, size) {
    var c = size / 2, a = size / 2, n = 5, steps = 256;
    var ox = x + c, oy = y + c;
    ctx.beginPath();
    for (var i = 0; i <= steps; i++) {
      var t = (i / steps) * Math.PI * 2;
      var ct = Math.cos(t), st = Math.sin(t);
      var px = ox + a * Math.sign(ct) * Math.pow(Math.abs(ct), 2 / n);
      var py = oy + a * Math.sign(st) * Math.pow(Math.abs(st), 2 / n);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function shapePath(ctx, x, y, size) {
    if (shape === "circle") {
      ctx.beginPath();
      ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
    } else if (shape === "round") {
      var r = size * 0.2;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, size, size, r);
      } else {

        ctx.arcTo(x + size, y, x + size, y + size, r);
        ctx.arcTo(x + size, y + size, x, y + size, r);
        ctx.arcTo(x, y + size, x, y, r);
        ctx.arcTo(x, y, x + size, y, r);
        ctx.closePath();
      }

  /* =========================================================
     渲染：预览与导出共用同一个函数，保证两者完全一致
     ========================================================= */
  function drawSource(ctx, ox, box) {

    var k = Math.min(box / sourceImg.width, box / sourceImg.height);
    var w = Math.max(1, Math.round(sourceImg.width * k));
    var h = Math.max(1, Math.round(sourceImg.height * k));

     渐变由主色自动派生（顶端提亮、底端压暗），

     ========================================================= */
  var PALETTE = [
    ["#0a84ff", "系统蓝"], ["#5e5ce6", "靛蓝"],   ["#bf5af2", "紫"],
    ["#ff375f", "粉红"],   ["#ff453a", "红"],     ["#ff9f0a", "橙"],
    ["#ffd60a", "黄"],     ["#30d158", "绿"],     ["#40c8e0", "青"],
    ["#8e8e93", "灰"],     ["#1c1c1e", "近黑"],   ["#ffffff", "白"]
  ];

  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function shade(hex, amt) {
    var c = hexToRgb(hex);
    var f = amt < 0 ? 0 : 255;
    var t = amt < 0 ? -amt : amt;
    var m = function (v) {
      return Math.round(amt < 0 ? v + (f - v) * t : v + (f - v) * t);
    };
    var to2 = function (v) { return ("0" + Math.max(0, Math.min(255, v)).toString(16)).slice(-2); };
    return "#" + to2(m(c.r)) + to2(m(c.g)) + to2(m(c.b));

    if (bgMode === 1) {

    } else {
      // 温和的线性渐变：顶亮底暗，不做彩虹色
      var g = ctx.createLinearGradient(0, 0, 0, size);
      g.addColorStop(0, shade(bgColor, 0.16));
      g.addColorStop(1, shade(bgColor, -0.10));

    }
    ctx.fillRect(0, 0, size, size);
  }

  // 源图是否含透明像素
  function sourceHasAlpha() {
    if (!sourceImg) return false;
    try {
      var s = 24;
      var cv = document.createElement("canvas");
      cv.width = cv.height = s;
      var c = cv.getContext("2d");
      c.drawImage(sourceImg, 0, 0, s, s);
      var d = c.getImageData(0, 0, s, s).data;
      for (var i = 3; i < d.length; i += 4) if (d[i] < 250) return true;

  function renderIcon(size) {
    var cv = document.createElement("canvas");
    cv.width = size;
    cv.height = size;

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    var pad = Math.round(size * padPct / 100);
    var box = Math.max(1, size - pad * 2);

    if (glass > 0) {
      renderGlass(ctx, box, pad);
      return cv;

    // 形状裁切贴合「内容框」，留白只是把内容框整体缩小
    if (shape !== "none") {

  /* =========================================================

     ------------------------------------------------------------
     Liquid Glass 的辨识度来自「边缘」，而不是整块面板：
       1) 折射：靠近轮廓的一圈，内容像被厚玻璃的倒角弯折、拉伸；
       2) 高光边线：一条很细的镜面反光，亮度取决于「位置」而不是边的朝向：
          左上角最亮、右下角次之、右上与左下只剩底光，
          因此每条边内部都是渐变——顺时针看，上边 强→弱、右边 弱→强、
          下边 强→弱、左边 弱→强；
       3) 边框与内发光：贴着轮廓一圈较宽的半透明亮边（外缘最亮、向内淡出），

     ========================================================= */
  var GLASS = [
    null,
    // band 边缘带宽 · refr 折射位移峰值 · rim 高光线粗（均为内容框边长的比例）
    // bdW 边框宽度 · rimA 高光线 / bdA 边框 / glowA 内发光 / bloomA 对角处的宽柔光 / shadeA 内阴影 的最大不透明度
    { band: 0.060, refr: 0.020, rim: 0.0035, fl: 0.18, rimA: 0.70, bdW: 0.016, bdA: 0.24, glowA: 0.13, bloomA: 0.08, shadeA: 0.20 },

  function mkCanvas(w, h) {
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));

  }

  // 到轮廓的内向距离与外法线。(u, v) ∈ [-1, 1]，形状内接于单位方框。
  // 结果写进这三个变量，避免逐像素分配对象。
  var E_D = 0, E_NX = 0, E_NY = 0;
  function edgeAt(u, v) {
    var au = u < 0 ? -u : u, av = v < 0 ? -v : v;
    var su = u < 0 ? -1 : 1, sv = v < 0 ? -1 : 1;
    if (shape === "circle") {
      var r = Math.sqrt(u * u + v * v) || 1e-6;
      E_D = 1 - r; E_NX = u / r; E_NY = v / r;
    } else if (shape === "round") {
      var k = 0.4;                       // 半径 = 边长 20% = 半边长 40%
      var qx = au - (1 - k), qy = av - (1 - k);
      if (qx > 0 && qy > 0) {

      } else {

      var F = u4 * au + v4 * av;
      if (F < 1e-9) { E_D = 1; E_NX = 0; E_NY = -1; return; }
      var f = Math.pow(F, 0.2);          // 一次齐次的「半径」，边界处 f=1
      var s = f / F;

  function renderGlass(ctx, box, pad) {

    var bdW = Math.max(1.5, box * P.bdW);              // 边框宽度
    var A = box * P.refr;                              // 折射位移峰值（px）
    // 位移不超过带宽的 0.42，否则映射会折叠；所以把折射拉高时，带宽会自动跟着变宽
    var W = Math.max(box * P.band, lw * 4, bdW * 1.4, A / 0.42, 3);   // 边缘带宽（px）
    var Wg = W * 0.65, Ws = W * 0.55;
    var innerR = Math.max(0, 1 - W / c), innerR2 = innerR * innerR;
    var sd = src.data;
    var out = cc.createImageData(box, box);
    var od = out.data;
    od.set(sd);

    // --- 2) 边缘带平均亮度：暗/彩色底以亮边为主，浅色底补内阴影 ---
    var step = Math.max(1, Math.floor(box / 64)), lsum = 0, lcnt = 0, x, y, u, v, i;
    for (y = 0; y < box; y += step) {
      v = (y + 0.5 - c) / c;
      for (x = 0; x < box; x += step) {
        u = (x + 0.5 - c) / c;
        if (u * u + v * v < innerR2) continue;
        edgeAt(u, v);
        var dd = E_D * c;
        if (dd < 0 || dd > W) continue;
        i = (y * box + x) * 4;
        if (sd[i + 3] < 128) continue;

    var shK = Math.min(1, Math.max(0, (lum - 0.50) / 0.30));
    var rimK = 0.40 + 0.60 * hiK, glowK = 0.20 + 0.80 * hiK, bdK = 0.35 + 0.65 * hiK;

    var lastX = box - 1;
    for (y = 0; y < box; y++) {

        if (u * u + v * v < innerR2) continue;       // 带外：保持原样

        var d = E_D * c;
        if (d >= W || d < -1) continue;
        var dc = d < 0 ? 0 : d;
        var nx = E_NX, ny = E_NY;

        // 受光程度：只看像素相对中心的方位角，而不是边的法线朝向。
        // 用法线的话，一条直边上处处相同；用方位角，同一条边从一端走到另一端就会渐变。
        //   左上 1.0 · 右下 ≈0.8 · 各边中点 ≈0.5 · 右上/左下 ≈0.18
        var pl = Math.sqrt(u * u + v * v) || 1e-6;
        var du = u / pl, dv = v / pl;
        var gg = (du - dv) * 0.7071;                 // 左上/右下对角线上为 0，右上 +1，左下 −1
        var hh = (du + dv) * 0.7071;                 // 左上 −1 … 右下 +1
        var lobe = 1 - gg * gg;
        lobe *= Math.sqrt(Math.sqrt(lobe));          // ^1.25：让两个弱角更弱
        lobe *= 0.89 - 0.11 * hh;                    // 右下比左上弱一档
        lobe = P.fl + (1 - P.fl) * lobe;

        // 折射：边缘像素取自更靠内的位置，位移向内平滑衰减到 0（带界处无接缝）；
        // 受光处位移略大，让对角处的弯折感更明显
        var q = 1 - dc / W;
        var sh = A * q * q * (0.7 + 0.3 * lobe);
        var fx = x - nx * sh, fy = y - ny * sh;
        var x0 = Math.floor(fx), y0 = Math.floor(fy);
        var wx = fx - x0, wy = fy - y0;
        var x1 = x0 + 1, y1 = y0 + 1;
        x0 = x0 < 0 ? 0 : (x0 > lastX ? lastX : x0);
        x1 = x1 < 0 ? 0 : (x1 > lastX ? lastX : x1);
        y0 = y0 < 0 ? 0 : (y0 > lastX ? lastX : y0);
        y1 = y1 < 0 ? 0 : (y1 > lastX ? lastX : y1);
        var i00 = (y0 * box + x0) * 4, i10 = (y0 * box + x1) * 4;
        var i01 = (y1 * box + x0) * 4, i11 = (y1 * box + x1) * 4;
        var a00 = sd[i00 + 3] * (1 - wx) * (1 - wy), a10 = sd[i10 + 3] * wx * (1 - wy);
        var a01 = sd[i01 + 3] * (1 - wx) * wy,       a11 = sd[i11 + 3] * wx * wy;
        var aSum = a00 + a10 + a01 + a11;            // 按 alpha 加权，透明像素不会把颜色拖黑
        var r = 0, g = 0, b = 0;
        if (aSum > 0) {
          r = (sd[i00] * a00 + sd[i10] * a10 + sd[i01] * a01 + sd[i11] * a11) / aSum;
          g = (sd[i00 + 1] * a00 + sd[i10 + 1] * a10 + sd[i01 + 1] * a01 + sd[i11 + 1] * a11) / aSum;
          b = (sd[i00 + 2] * a00 + sd[i10 + 2] * a10 + sd[i01 + 2] * a01 + sd[i11 + 2] * a11) / aSum;
        }
        var a = aSum / 255;

        var aShade = 0, aGlow = 0, aRim = 0;
        if (shK > 0 && dc < Ws) {
          var sq = 1 - dc / Ws;
          aShade = P.shadeA * shK * sq * sq * (0.55 + 0.45 * (1 - lobe));
        }
        if (dc < Wg) {
          var gq = 1 - dc / Wg, bq = 1 - dc / W;
          // 窄的贴边内发光 + 宽的对角柔光（后者只在左上、右下明显）
          aGlow = glowK * (P.glowA * (0.15 + 0.85 * lobe) * gq * gq * gq
                         + P.bloomA * lobe * lobe * bq * bq);
          if (aGlow > 0.95) aGlow = 0.95;
        }
        if (dc < bdW) {
          // 边框：贴边一段近乎平台，再向内平滑淡出；四个角都可见，只是强弱不同
          var bt = dc / bdW, bs = bt < 0.35 ? 0 : (bt - 0.35) / 0.65;
          var aBd = P.bdA * bdK * (0.5 + 0.5 * lobe) * (1 - bs * bs * (3 - 2 * bs));
          aGlow = aGlow + aBd * (1 - aGlow);
        }
        var rt = (dc - rimC) / rimS;
        if (rt > -3 && rt < 3) aRim = P.rimA * rimK * lobe * Math.exp(-rt * rt);

        var na, m1, m2;
        if (aShade > 0) {                            // 黑色盖上去
          na = aShade + a * (1 - aShade);
          m2 = a * (1 - aShade) / na;
          r *= m2; g *= m2; b *= m2; a = na;
        }
        if (aGlow > 0) {                             // 发光色 = 底图色向白色提亮，保留色相
          var t = 0.45 * a;
          var gr = 255 + (r - 255) * t, gg = 255 + (g - 255) * t, gb = 255 + (b - 255) * t;
          na = aGlow + a * (1 - aGlow);
          m1 = aGlow / na; m2 = a * (1 - aGlow) / na;
          r = gr * m1 + r * m2; g = gg * m1 + g * m2; b = gb * m1 + b * m2; a = na;
        }
        if (aRim > 0) {                              // 白色高光线
          na = aRim + a * (1 - aRim);
          m1 = aRim / na; m2 = a * (1 - aRim) / na;
          r = 255 * m1 + r * m2; g = 255 * m1 + g * m2; b = 255 * m1 + b * m2; a = na;
        }

        var o = (y * box + x) * 4;
        od[o] = r; od[o + 1] = g; od[o + 2] = b; od[o + 3] = a * 255;
      }
    }

    // --- 4) 贴到主画布并按形状裁切 ---
    var tmp = mkCanvas(box, box);
    tmp.getContext("2d").putImageData(out, 0, 0);
    ctx.save();
    shapePath(ctx, pad, pad, box);
    ctx.clip();
    ctx.drawImage(tmp, pad, pad);
    ctx.restore();
  }

  function canvasToPngBytes(cv) {
    return new Promise(function (resolve, reject) {
      cv.toBlob(function (blob) {
        if (!blob) { reject(new Error("canvas.toBlob 返回空")); return; }
        blob.arrayBuffer().then(function (buf) {
          resolve(new Uint8Array(buf));
        }, reject);
      }, "image/png");
    });

  /* =========================================================
     打包成 icns
     ========================================================= */
  function buildIcns(entries) {
    var parts = [];
    var total = 8;
    entries.forEach(function (e) {
      var len = e.bytes.length + 8;
      var head = new Uint8Array(8);
      for (var i = 0; i < 4; i++) head[i] = e.type.charCodeAt(i) & 0xff;
      new DataView(head.buffer).setUint32(4, len);
      parts.push(head, e.bytes);
      total += len;
    });

    var out = new Uint8Array(total);
    var dv = new DataView(out.buffer);
    out[0] = 0x69; out[1] = 0x63; out[2] = 0x6e; out[3] = 0x73; // 'icns'
    dv.setUint32(4, total);
    var off = 8;
    parts.forEach(function (p) { out.set(p, off); off += p.length; });
    return out;
  }

  // 读回校验：确认头部长度、每块长度、PNG 尺寸都对得上
  function inspectIcns(bytes) {

    var magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
    var declared = dv.getUint32(4);

    var off = 8, bad = null;

    while (off + 8 <= bytes.length) {
      var type = String.fromCharCode(bytes[off], bytes[off+1], bytes[off+2], bytes[off+3]);
      var len = dv.getUint32(off + 4);
      if (len < 8) { bad = "块 " + type + " 的长度字段非法（" + len + "）"; break; }
      if (off + len > bytes.length) { bad = "块 " + type + " 超出文件末尾"; break; }

      var p0 = bytes[off + 8], p1 = bytes[off + 9];
      var isPng = (p0 === 0x89 && p1 === 0x50);
      var px = "";
      if (isPng) {
        // PNG 的 IHDR 宽高固定在第 16..24 字节
        var pdv = new DataView(bytes.buffer, bytes.byteOffset + off + 8, len - 8);
        px = pdv.getUint32(16) + "×" + pdv.getUint32(20);
      }
      rows.push({ type: type, len: len, px: px, png: isPng });
      off += len;
    }
    if (!bad && off !== bytes.length) bad = "块长度之和不等于文件大小";
    if (!bad && declared !== bytes.length) bad = "头部声明长度与实际大小不符";

    return { magic: magic, declared: declared, actual: bytes.length, rows: rows, error: bad };
  }

  function humanSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  /* =========================================================
     选中哪些尺寸
     ========================================================= */
  function selectedSizes() {
    return SIZES.filter(function (s) { return picked[s.type]; });
  }

  /* =========================================================
     左栏：形状选择器
     ========================================================= */
  SHAPES.forEach(function (sh) {
    var el = document.createElement("div");
    el.className = "shape" + (sh.key === shape ? " on" : "");
    el.dataset.key = sh.key;
    el.title = { none: "不裁切，按原图输出",
                 squircle: "macOS 风格超椭圆（n=5）",
                 round: "普通圆角矩形，半径 20%",
                 circle: "圆形（内切）" }[sh.key];

    var cv = document.createElement("canvas");
    cv.width = cv.height = 24;
    var ctx = cv.getContext("2d");
    var saved = shape;
    shape = sh.key;
    // 只借用 shapePath，不裁切，画个填充块当示意
    var prevPad = padPct; padPct = 0;
    var filled = drawSample(ctx, 24);
    padPct = prevPad;
    shape = saved;
    if (filled) el.appendChild(cv);

    var lb = document.createElement("span");
    lb.textContent = sh.label;
    el.appendChild(lb);

    el.addEventListener("click", function () {
      shape = sh.key;
      [].forEach.call(shapesEl.children, function (c) {
        c.classList.toggle("on", c.dataset.key === shape);
      });
      syncGlassHint();
      scheduleRender();
    });
    shapesEl.appendChild(el);
  });

  // 形状缩略图：与 renderIcon 走同一条 shapePath
  function drawSample(ctx, size) {
    ctx.clearRect(0, 0, size, size);
    var c = size / 2;
    if (shape === "none") {
      ctx.fillStyle = "#3dd68c";
      ctx.fillRect(size * 0.14, size * 0.14, size * 0.72, size * 0.72);
      return true;
    }
    shapePath(ctx, 0, 0, size);
    ctx.fillStyle = "#3dd68c";
    ctx.fill();
    return true;
  }

  /* =========================================================
     左栏：尺寸清单
     ========================================================= */
  SIZES.forEach(function (s) {
    var el = document.createElement("label");
    el.className = "size" + (s.retina ? " retina" : "");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!picked[s.type];
    cb.addEventListener("change", function () {
      picked[s.type] = cb.checked;
      scheduleRender();
    });

    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = s.type;

    var dim = document.createElement("span");
    dim.className = "dim";
    dim.textContent = s.px;

    el.appendChild(cb);
    el.appendChild(tag);
    el.appendChild(dim);
    el.title = s.type + " = " + s.px + "×" + s.px + "（" + s.note + "）"
            + (s.retina ? " · Retina 槽位" : "");
    sizeListEl.appendChild(el);
  });

  document.getElementById("presetAll").addEventListener("click", function () {
    SIZES.forEach(function (s) { picked[s.type] = true; });
    syncChecks();
    scheduleRender();
  });
  document.getElementById("presetNone").addEventListener("click", function () {
    SIZES.forEach(function (s) { picked[s.type] = false; });
    syncChecks();
    scheduleRender();
  });
  function syncChecks() {
    [].forEach.call(sizeListEl.querySelectorAll("input"), function (cb, i) {
      cb.checked = !!picked[SIZES[i].type];
    });
  }

  /* =========================================================
     留白滑块
     ========================================================= */
  padRange.addEventListener("input", function () {
    padPct = parseInt(padRange.value, 10) || 0;
    padVal.textContent = padPct + "%";
    syncPadHint();
    scheduleRender();
  });

  /* macOS 标准图标网格常量 PAD_STD 定义见文件上方 */

  function syncPadHint() {
    var on = padPct === PAD_STD;
    var content = 100 - padPct * 2;
    padHint.className = "hint-line" + (on ? " ok" : "");
    padHint.innerHTML = on
      ? "已按 macOS 标准网格：内容约 <b>" + content + "%</b>（1024 画布上留白 " +
        Math.round(1024 * padPct / 100) + "px）"
      : "每边 <b>" + padPct + "%</b>，内容约 <b>" + content + "%</b>（1024 画布上留白 " +
        Math.round(1024 * padPct / 100) + "px）。图标铺满时在 Finder 里会显得偏大，" +
        "建议用 <b>macOS 标准</b>。";
  }

  document.getElementById("padStd").addEventListener("click", function () {
    padRange.value = PAD_STD;
    padPct = PAD_STD;
    padVal.textContent = padPct + "%";
    syncPadHint();
    scheduleRender();
  });

  /* =========================================================
     背景色
     ========================================================= */
  var bgSeg    = document.getElementById("bgSeg");
  var bgColors = document.getElementById("bgColors");
  var bgHint   = document.getElementById("bgHint");

  function syncBgHint() {
    bgColors.classList.toggle("hidden", bgMode === 0);
    if (bgMode === 0) {
      bgHint.className = "hint-line";
      bgHint.innerHTML = "给<b>透明背景</b>的 PNG 垫底色，铺满画布并随形状裁切。";
      return;
    }
    var noAlpha = sourceImg && !sourceHasAlpha();
    bgHint.className = "hint-line";
    bgHint.innerHTML = (bgMode === 1
        ? "纯色铺满 <b>" + bgColor.toUpperCase() + "</b>。"
        : "渐变由主色自动派生：顶亮底暗，<b>" + bgColor.toUpperCase() + "</b>。")
      + (noAlpha ? " 当前图片<b>没有透明区域</b>，底色会被完全盖住。" : "");
  }

  PALETTE.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sw2";
    b.style.background = p[0];
    b.title = p[1] + " " + p[0];
    b.dataset.color = p[0];
    b.addEventListener("click", function () {
      bgColor = p[0];
      bgPicker.value = p[0];
      syncBgSwatches();
      syncBgHint();
      scheduleRender();
    });
    bgColors.appendChild(b);
  });

  var bgPicker = document.createElement("input");
  bgPicker.type = "color";
  bgPicker.value = bgColor;
  bgPicker.title = "自定义颜色";
  bgPicker.addEventListener("input", function () {
    bgColor = bgPicker.value;
    syncBgSwatches();
    syncBgHint();
    scheduleRender();
  });
  bgColors.appendChild(bgPicker);

  function syncBgSwatches() {
    [].forEach.call(bgColors.querySelectorAll(".sw2"), function (b) {
      b.classList.toggle("on", b.dataset.color.toLowerCase() === bgColor.toLowerCase());
    });
  }
  syncBgSwatches();

  [].forEach.call(bgSeg.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      bgMode = parseInt(b.dataset.bg, 10) || 0;
      [].forEach.call(bgSeg.children, function (o) { o.classList.toggle("on", o === b); });
      syncBgHint();
      scheduleRender();
    });
  });

  /* =========================================================
     玻璃质感档位
     ========================================================= */
  var glassSeg  = document.getElementById("glassSeg");
  var glassHint = document.getElementById("glassHint");

  function syncGlassHint() {
    if (glass === 0) {
      glassHint.className = "hint-line";
      glassHint.innerHTML = "给轮廓边缘加上<b>折射、高光边线与内发光</b>，模拟 macOS Tahoe 的 <b>Liquid Glass</b>。只作用于边缘一圈，<b>中间画面不变</b>。";
      return;
    }
    var soft = glass === 1;
    glassHint.className = "hint-line";
    glassHint.innerHTML = (soft ? "<b>柔和</b>：" : "<b>明显</b>：")
      + "边缘<b>折射</b>、<b>高光边线</b>与<b>内发光</b>，<b>中间画面不变</b>。"
      + (shape === "none" ? " 原样形状下不明显，建议选圆角。" : "");
  }

  [].forEach.call(glassSeg.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      glass = parseInt(b.dataset.glass, 10) || 0;
      [].forEach.call(glassSeg.children, function (o) { o.classList.toggle("on", o === b); });
      syncGlassHint();
      syncGlassParams();
      scheduleRender();
    });
  });

  /* =========================================================
     玻璃质感参数滑块
     滑块直接改当前档位（柔和 / 明显）的参数，各档位的修改互不影响；
     「恢复默认」只重置当前档位。预览与导出用的是同一份参数。
     ========================================================= */
  var GLASS_DEF = [null, JSON.parse(JSON.stringify(GLASS[1])), JSON.parse(JSON.stringify(GLASS[2]))];
  var glassParams = document.getElementById("glassParams");
  var glassReset  = document.getElementById("glassReset");

  // 数值统一按百分比显示和输入；k 为 GLASS 里的字段，范围按「再大/再小就失真」来定
  var GLASS_UI = [
    { k: "bdW",    name: "边框宽度",   min: 0.4, max: 4.0,  step: 0.1,  d: 1 },  // 占内容宽度
    { k: "bdA",    name: "边框亮度",   min: 0,   max: 80,   step: 1,    d: 0 },
    { k: "rim",    name: "高光线粗细", min: 0.1, max: 1.0,  step: 0.05, d: 2 },  // 占内容宽度
    { k: "rimA",   name: "高光线亮度", min: 0,   max: 100,  step: 1,    d: 0 },
    { k: "glowA",  name: "内发光",     min: 0,   max: 60,   step: 1,    d: 0 },
    { k: "bloomA", name: "对角柔光",   min: 0,   max: 50,   step: 1,    d: 0 },
    { k: "refr",   name: "折射强度",   min: 0,   max: 5.0,  step: 0.1,  d: 1 },  // 边缘内容的位移量
    { k: "fl",     name: "弱角底光",   min: 5,   max: 60,   step: 1,    d: 0 },  // 右上/左下的相对亮度
    { k: "shadeA", name: "浅底内阴影", min: 0,   max: 60,   step: 1,    d: 0 }   // 仅浅色底图时生效
  ];
  var glassRows = {};

  GLASS_UI.forEach(function (it) {
    var row  = document.createElement("div");
    row.className = "slider-row gl-row";
    var name = document.createElement("span");
    name.className = "gl-name";
    name.textContent = it.name;
    var inp  = document.createElement("input");
    inp.type = "range"; inp.min = it.min; inp.max = it.max; inp.step = it.step;
    var val  = document.createElement("span");
    val.className = "slider-val";
    inp.addEventListener("input", function () {
      if (!glass) return;
      GLASS[glass][it.k] = parseFloat(inp.value) / 100;
      val.textContent = parseFloat(inp.value).toFixed(it.d) + "%";
      scheduleRender();
    });
    row.appendChild(name); row.appendChild(inp); row.appendChild(val);
    glassParams.appendChild(row);
    glassRows[it.k] = { inp: inp, val: val, it: it };
  });

  function syncGlassParams() {
    glassParams.hidden = glass === 0;
    glassReset.style.display = glass === 0 ? "none" : "";
    if (!glass) return;
    GLASS_UI.forEach(function (it) {
      var r = glassRows[it.k], v = GLASS[glass][it.k] * 100;
      r.inp.value = v;
      r.val.textContent = parseFloat(r.inp.value).toFixed(it.d) + "%";
    });
  }

  glassReset.addEventListener("click", function () {
    if (!glass) return;
    GLASS[glass] = JSON.parse(JSON.stringify(GLASS_DEF[glass]));
    syncGlassParams();
    scheduleRender();
  });

  /* =========================================================
     预览缩放
     ========================================================= */
  [].forEach.call(document.querySelectorAll("[data-zoom]"), function (b) {
    if (parseInt(b.dataset.zoom, 10) === 1) b.classList.add("on");
    b.addEventListener("click", function () {
      zoom = parseInt(b.dataset.zoom, 10);
      [].forEach.call(document.querySelectorAll("[data-zoom]"), function (o) {
        o.classList.toggle("on", o === b);
      });
      scheduleRender();
    });
  });

  /* =========================================================
     渲染调度：rAF + 定时器兜底
     （后台标签页里 rAF 可能不触发）
     ========================================================= */
  var rafId = null, timerId = null;
  function scheduleRender() {
    if (rafId) cancelAnimationFrame(rafId);
    if (timerId) clearTimeout(timerId);
    rafId = requestAnimationFrame(function () {
      rafId = null;
      render();
    });
    timerId = setTimeout(function () {
      timerId = null;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      render();
    }, 60);
  }

  function render() {
    if (!sourceImg) return;
    var list = selectedSizes();
    swatchesEl.textContent = "";
    emptyEl.style.display = "none";

    list.forEach(function (s) {
      var cell = document.createElement("div");
      cell.className = "sw" + (s.retina ? " retina" : "");

      var frame = document.createElement("div");
      frame.className = "frame";

      var stage = document.createElement("div");
      stage.className = "stage";

      var cv = renderIcon(s.px);
      // 一律铺满预览窗口：窗口边界即图像边界，
      // 这样看到的空白只可能来自「四周留白」，不会与窗口自身留白混淆。
      var show = STAGE * zoom;
      cv.style.width = show + "px";
      cv.style.height = show + "px";
      stage.appendChild(cv);
      frame.appendChild(stage);

      var cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = s.type + " · " + s.px + "×" + s.px;

      var cap2 = document.createElement("div");
      cap2.className = "cap2";
      cap2.textContent = (show === s.px)
        ? s.note
        : (show > s.px ? "放大 " + (Math.round(show / s.px * 10) / 10) + "× 查看"
                       : "显示 " + show + "px / 实际 " + s.px + "px");

      cell.appendChild(frame);
      cell.appendChild(cap);
      cell.appendChild(cap2);
      swatchesEl.appendChild(cell);
    });

    var ok = list.length > 0;
    exportBtn.disabled = !ok;
    factsEl.innerHTML = ok
      ? "导出 <b>1 个 .icns</b>，内含 " + list.length + " 个尺寸："
        + list.map(function (s) { return s.type; }).join(" ")
      : "请至少选择一个尺寸";
  }

  /* =========================================================
     载入图片
     ========================================================= */
  function loadFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type) && !/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(file.name)) {
      setStatus("不是图片文件：" + file.name);
      return;
    }
    setStatus("正在读取 " + file.name + " …");

    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      sourceImg = img;
      sourceName = file.name.replace(/\.[^.]+$/, "") || "icon";
      lastBytes = null;
      inspectWrap.hidden = true;
      inspectBtn.disabled = true;
      inspectHint.style.display = "";
      syncBgHint();
      scheduleRender();
      setStatus("已载入 " + file.name + "（" + img.naturalWidth + "×" + img.naturalHeight + "），调整后导出 .icns");
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus("图片解码失败：" + file.name);
    };
    img.src = url;
  }

  drop.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      drop.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      drop.classList.remove("dragover");
    });
  });
  drop.addEventListener("drop", function (e) {
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) loadFile(dt.files[0]);
  });

  document.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image/") === 0) {
        var f = items[i].getAsFile();
        if (f) { loadFile(f); e.preventDefault(); return; }
      }
    }
  });

  /* =========================================================
     导出
     ========================================================= */
  exportBtn.addEventListener("click", function () {
    if (!sourceImg) return;
    var list = selectedSizes();
    if (!list.length) { setStatus("请至少选择一个尺寸"); return; }

    exportBtn.disabled = true;
    setStatus("正在生成 .icns …");

    (async function () {
      var entries = [];
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var cv = renderIcon(s.px);
        var bytes = await canvasToPngBytes(cv);
        entries.push({ type: s.type, bytes: bytes });
      }
      var out = buildIcns(entries);
      lastBytes = out;

      var blob = new Blob([out], { type: "application/octet-stream" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = sourceName + ".icns";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

      factsEl.textContent = "1 个文件 · " + entries.length + " 个尺寸 · " + humanSize(out.length);
      inspectBtn.disabled = false;
      setStatus("已导出 " + sourceName + ".icns（" + humanSize(out.length) + "）");
    })().catch(function (err) {
      setStatus("生成失败：" + (err && err.message ? err.message : err));
    }).then(function () {
      exportBtn.disabled = false;
    });
  });

  /* =========================================================
     解析校验
     ========================================================= */
  inspectBtn.addEventListener("click", function () {
    if (!lastBytes) return;
    var r = inspectIcns(lastBytes);
    var html = "<thead><tr><th>块</th><th>负载</th><th>尺寸</th><th>字节</th></tr></thead><tbody>";
    r.rows.forEach(function (row) {
      html += "<tr><td>" + row.type + "</td>"
           + "<td class=\"" + (row.png ? "ok" : "dim") + "\">" + (row.png ? "PNG" : "非 PNG") + "</td>"
           + "<td>" + (row.px || "—") + "</td>"
           + "<td class=\"dim\">" + row.len + "</td></tr>";
    });
    html += "</tbody>";
    inspectTable.innerHTML = html;
    inspectWrap.hidden = false;
    inspectHint.style.display = "none";

    setStatus(r.error
      ? "校验发现问题：" + r.error
      : "校验通过：魔数 " + r.magic + "，头部长度 " + r.declared + " = 实际 " + r.actual + " 字节，共 " + r.rows.length + " 块");
  });

  /* =========================================================
     初始状态
     ========================================================= */
  setStatus("等待选择图片…");
  exportBtn.disabled = true;
  syncPadHint();
  syncBgHint();
  syncGlassHint();
  syncGlassParams();
})();
</script>
</body>
</html>
