<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>常用命令速查</title>
  <meta name="description" content="常用命令速查手册：Bash、Git、macOS 快捷键，点击即复制" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    /* 与各工具子页面共用同一套色板，改这里即可整体换肤 */
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --border-soft: #2a334080;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --success: #3dd68c;
      --success-soft: rgba(61, 214, 140, .14);
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin: 0; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    [id] { scroll-margin-top: 96px; }

    .wrap { width: 100%; max-width: 1012px; margin: 0 auto; padding: 0 16px; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ======================================================================
     *  吸顶：页头 + 分类 Tab
     * ==================================================================== */
    .sticky {
      position: -webkit-sticky; position: sticky;
      top: 0; z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .topbar {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; padding: 11px 0 0;   /* 与各子页面 header 的上内边距一致 */
    }
    .topbar h1 { font-size: 16px; font-weight: 600; }
    .topbar .tagline { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .back {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    .back:hover { color: var(--accent); text-decoration: none; }

    /* 维护入口：比「← 工具箱」再淡一档，不抢正文的视线 */
    .toplinks { display: inline-flex; align-items: baseline; gap: 14px; }
    .edit-link {
      font-size: 12px; color: #5d6878; white-space: nowrap;
      border-bottom: 1px dashed #3a4557;
    }
    .edit-link:hover { color: var(--accent); text-decoration: none; border-bottom-color: var(--accent-2); }

    .tabs {
      display: flex; gap: 4px;
      overflow-x: auto; scrollbar-width: none;
      margin-top: 4px;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; margin-bottom: -1px;
      border: 0; border-bottom: 2px solid transparent;
      border-radius: 7px 7px 0 0;
      background: transparent; color: var(--text);
      font: inherit; font-size: 13px; line-height: 20px;
      cursor: pointer; white-space: nowrap;
      transition: border-color .12s, background-color .12s;
    }
    .tab:hover { background: var(--panel-2); }
    .tab[aria-selected="true"] { font-weight: 600; border-bottom-color: var(--accent); }
    .tab .ico { font-size: 15px; line-height: 1; }

    /* ======================================================================
     *  内容区
     * ==================================================================== */
    /* 只调纵向留白。左右必须用长写：.page 与 .wrap 同权重且位置在后，
       简写里的 0 会把 .wrap 的左右 16px 内边距一起清掉，窄屏下卡片会贴边。 */
    .page { padding-top: 20px; padding-bottom: 0; }

    .panel { display: none; }
    .panel.is-active { display: block; }

    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .panel-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -.1px; }
    .panel-head .count { font-size: 12px; color: var(--muted); }

    .group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
      background: var(--panel);
    }

    .group-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 8px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .group-head h3 { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: -.2px; }
    .group-head .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .group-body { padding: 4px 0; }

    /* ======================================================================
     *  复制行
     * ==================================================================== */
    .copy {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 6px 12px;
      border: 0; background: transparent; color: inherit;
      font: inherit; text-align: left; cursor: pointer;
      transition: background-color .1s;
    }
    .copy:hover { background: var(--panel-2); }
    .copy[data-copied] { background: var(--success-soft); }

    .copy .code {
      flex: 1 1 auto; min-width: 0;
      font-family: var(--mono); font-size: 13px; line-height: 20px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      overflow-x: auto; white-space: nowrap;
      scrollbar-width: thin;
    }

    .copy .mark {
      flex: 0 0 auto; color: var(--muted);
      display: flex; align-items: center;
    }
    .copy .mark svg { display: block; }
    .copy:hover .mark { color: var(--accent); }
    .copy .mark .done { display: none; color: var(--success); }
    .copy[data-copied] .mark .idle { display: none; }
    .copy[data-copied] .mark .done { display: block; }

    /* 命令列用 max-content：列宽跟着最长的命令走，命令不被截出滚动条，
       说明列吃掉剩下的全部空间。窄屏（≤1080px）改为上下堆叠，见下方媒体查询。 */
    .rows { display: block; }
    .rows .row {
      display: grid;
      grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
      align-items: center;
      gap: 4px 12px;
      border-top: 1px solid var(--border-soft);
    }
    .rows .row:first-child { border-top: 0; }
    .rows .row .desc {
      padding: 4px 12px 4px 0;
      font-size: 12px; line-height: 1.5; color: var(--muted);
    }

    /* 页脚与各工具子页面一致：整条边框通栏，内容左对齐并带状态点。
       结构上与 .sticky 一样——外层负责边框，内层 .wrap 负责居中与留白。 */
    footer {
      flex: 0 0 auto;
      margin-top: 22px;
      border-top: 1px solid var(--border);
    }
    .wrap.foot-in {
      display: flex; align-items: center; gap: 8px;
      padding-top: 9px; padding-bottom: 22px;
      font-size: 12px; color: var(--muted);
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

    /* ======================================================================
     *  窄屏：命令一行、说明一行
     *  实测（Chrome，内容区 1012px）：最长的命令约需 845px 才不出现横向
     *  滚动条，所以 1080px 以下两栏已无意义，直接堆叠。
     * ==================================================================== */
    @media (max-width: 1080px) {
      .rows .row {
        grid-template-columns: minmax(0, 1fr);
        gap: 2px; padding-bottom: 6px;
      }
      /* 说明文字与代码框左边框对齐：代码框边框落在 .copy 的内边距处 */
      .rows .row .desc { padding: 0 12px; font-size: 12px; }
    }

    @media (max-width: 720px) {
      .wrap { padding-left: 14px; padding-right: 14px; }
      .topbar { padding-top: 12px; }
      .topbar h1 { font-size: 15px; }
      .topbar .tagline { display: none; }

      .tab { padding: 8px 10px; }

      .page { padding-top: 16px; }
      .panel-head { margin-bottom: 14px; }

      .group-head { padding: 7px 10px; }
      .group-head .meta { display: none; }

      .copy { padding: 6px 10px; }
      .copy .code { font-size: 12px; padding: 4px 8px; }

      /* 命令条已占满整行，纵向充裕而横向没有，改为折行显示，
         长命令不再需要左右拖动（复制内容取自 data-copy，不受折行影响） */
      .copy .code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        overflow-x: visible;
      }

      .rows .row .desc { padding: 0 10px; }

      .note { padding: 10px; }
      .term { font-size: 11.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }

    @media print {
      .sticky { position: static; }
      .tabs, .copy .mark, .back, .edit-link { display: none !important; }
      .panel { display: block !important; }
      .group { break-inside: avoid; }
      .term pre { white-space: pre-wrap; }
    }
  </style>
</head>
<body>

<!-- ======================= 吸顶：页头 + 分类 Tab ======================= -->
<header class="sticky">
	<div class="wrap">
		<div class="topbar">
			<h1>常用命令速查</h1>
			<span class="toplinks">
				<a class="back" href="index.html">← 工具箱</a>
				<a class="edit-link" id="editLink" href="commands-edit.html">编辑此页</a>
			</span>
			<span class="tagline">点击任意命令即可复制</span>
		</div>
		<nav class="tabs" id="tabs" role="tablist" aria-label="命令分类"></nav>
	</div>
</header>

<!-- ======================= 内容区（由 JS 渲染） ======================= -->
<main class="wrap page" id="panels"></main>

<footer>
	<div class="wrap foot-in">
		<span class="dot"></span><span id="footNote">加载中…</span>
	</div>
</footer>

<div class="sr-only" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
 *  ①  数据区 —— 命令内容不在本文件里，在 data/ 目录下的 JSON
 * ========================================================================== *
 *
 *  data/categories.json   分类清单（数组，顺序即顶部 Tab 的顺序）
 *      [
 *        { "id": "bash", "name": "Bash", "icon": "⌨️" },
 *        ...
 *      ]
 *
 *  data/<id>.json         该分类的内容，形如 { "blocks": [ ... ] }
 *
 *  数据格式详见 data/README.md。
 *
 *  · 加一条命令：在对应文件的 items 里加一项
 *      { "cmd": "要复制的命令", "d": "右侧说明" }
 *  · 加一个分类：在 categories.json 里加一项，再新建 data/<id>.json
 * ========================================================================== */

var DATA = [];

/* ==========================================================================
 *  ②  渲染逻辑 —— 一般不需要改动
 * ========================================================================== */

(function () {
	"use strict";

	var tabsEl   = document.getElementById("tabs");
	var panelsEl = document.getElementById("panels");
	var footEl   = document.getElementById("footNote");
	var toastEl  = document.getElementById("toast");

	/* ---------- 工具函数 ---------- */

	function esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
		});
	}

	// 一条数据实际要复制的文本
	function copyTextOf(item) {
		return item.cmd == null ? "" : item.cmd;
	}

	// Octicon: copy
	var ICON_COPY =
		'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
		'<path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>' +
		'<path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>';

	// Octicon: check
	var ICON_DONE =
		'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
		'<path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>';

	/* ---------- 渲染：可复制的代码条 ---------- */
	function copyBtnHTML(item) {
		var text = copyTextOf(item);
		return '<button type="button" class="copy" data-copy="' + esc(text) +
			'" title="点击复制：' + esc(text) + '"' +
			' aria-label="复制 ' + esc(text) + '">' +
			'<code class="code">' + esc(text) + "</code>" +
			'<span class="mark" aria-hidden="true">' +
				'<span class="idle">' + ICON_COPY + "</span>" +
				'<span class="done">' + ICON_DONE + "</span>" +
			"</span>" +
			"</button>";
	}

	/* 一条内容：{ cmd, d }，点一下复制 cmd。
	 * 之前还有 k（快捷键，居中按键条）、h（条目内小标题）和多行备注块，
	 * 现在统一成这一种单行结构。 */
	function itemHTML(item) {
		return '<div class="row">' + copyBtnHTML(item) +
			'<div class="desc">' + esc(item.d || "") + "</div>" +
			"</div>";
	}

	function blockHTML(block) {
		var items = block.items || [];
		return '<section class="group">' +
			'<div class="group-head"><h3>' + esc(block.g || "") + "</h3>" +
				'<span class="meta">' + items.length + " 条</span></div>" +
			'<div class="group-body">' +
				'<div class="rows">' + items.map(itemHTML).join("") + "</div>" +
			"</div></section>";
	}

	function panelHTML(cat) {
		var blocks = cat.blocks || [];
		var total = blocks.reduce(function (n, b) {
			return n + (b.items || []).length;
		}, 0);

		return '<section class="panel" id="panel-' + esc(cat.id) + '" role="tabpanel"' +
			' aria-labelledby="tab-' + esc(cat.id) + '" tabindex="0">' +
			'<div class="panel-head"><h2>' + esc(cat.name) + "</h2>" +
				'<span class="count">' + blocks.length + " 个分组 · " + total + " 条内容</span></div>" +
			blocks.map(blockHTML).join("") +
			"</section>";
	}

	function tabHTML(cat, index) {
		return '<button type="button" class="tab" role="tab" id="tab-' + esc(cat.id) + '"' +
			' aria-controls="panel-' + esc(cat.id) + '" aria-selected="false"' +
			' tabindex="' + (index === 0 ? "0" : "-1") + '" data-tab="' + esc(cat.id) + '">' +
			(cat.icon ? '<span class="ico" aria-hidden="true">' + esc(cat.icon) + "</span>" : "") +
			"<span>" + esc(cat.name) + "</span>" +
			"</button>";
	}

	/* ---------- 渲染整页 ---------- */
	function render() {
		tabsEl.innerHTML   = DATA.map(tabHTML).join("");
		panelsEl.innerHTML = DATA.map(panelHTML).join("");

		var grand = DATA.reduce(function (n, c) {
			return n + (c.blocks || []).reduce(function (m, b) {
				return m + (b.items || []).length;
			}, 0);
		}, 0);
		footEl.textContent = DATA.length + " 个分类 · " + grand + " 条内容 · 点击任意命令即可复制";
	}

	/* ---------- 分类切换 ---------- */
	var tabEls = [];

	function activate(id, opts) {
		opts = opts || {};
		var found = DATA.some(function (c) { return c.id === id; });
		if (!found) id = DATA.length ? DATA[0].id : "";

		tabEls.forEach(function (t) {
			var on = t.dataset.tab === id;
			t.setAttribute("aria-selected", on ? "true" : "false");
			t.tabIndex = on ? 0 : -1;
		});

		[].forEach.call(panelsEl.children, function (p) {
			p.classList.toggle("is-active", p.id === "panel-" + id);
		});

		if (opts.scrollIntoView) {
			var active = tabsEl.querySelector('.tab[data-tab="' + id + '"]');
			if (active && active.scrollIntoView) {
				active.scrollIntoView({ block: "nearest", inline: "center" });
			}
		}
		if (opts.updateHash !== false && location.hash !== "#" + id) {
			history.replaceState(null, "", "#" + id);
		}

		/* 「编辑此页」带上当前分类，点进去就落在同一个 Tab 上 */
		var edit = document.getElementById("editLink");
		if (edit) edit.href = "commands-edit.html#" + id;
	}

	/* ---------- 复制 ---------- */
	function fallbackCopy(text) {
		var ta = document.createElement("textarea");
		ta.value = text;
		ta.setAttribute("readonly", "");
		ta.style.position = "fixed";
		ta.style.top = "-1000px";
		document.body.appendChild(ta);
		ta.select();
		var ok = false;
		try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
		document.body.removeChild(ta);
		return ok;
	}

	function copy(text) {
		if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
			return navigator.clipboard.writeText(text).then(
				function () { return true; },
				function () { return fallbackCopy(text); }
			);
		}
		return Promise.resolve(fallbackCopy(text));
	}

	function flash(btn, label) {
		if (!btn) return;
		btn.setAttribute("data-copied", "1");
		clearTimeout(btn._t);
		btn._t = setTimeout(function () {
			btn.removeAttribute("data-copied");
		}, 1200);
		toastEl.textContent = (label.length > 40 ? label.slice(0, 40) + "…" : label) + " 已复制";
	}

	function handleCopy(btn, text) {
		copy(text).then(function (ok) {
			if (ok) flash(btn, text);
			else toastEl.textContent = "复制失败，请手动选中后复制";
		});
	}

	/* ---------- 事件绑定 ---------- */

	// Tab：点击
	tabsEl.addEventListener("click", function (e) {
		var btn = e.target.closest ? e.target.closest(".tab") : null;
		if (btn) activate(btn.dataset.tab, { scrollIntoView: true });
	});

	// Tab：键盘方向键（符合 tablist 习惯）
	tabsEl.addEventListener("keydown", function (e) {
		if (["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(e.key) === -1) return;
		var current = -1;
		tabEls.forEach(function (t, i) {
			if (t.getAttribute("aria-selected") === "true") current = i;
		});
		if (current < 0) return;
		e.preventDefault();
		var next = current;
		if (e.key === "ArrowLeft")  next = (current - 1 + tabEls.length) % tabEls.length;
		if (e.key === "ArrowRight") next = (current + 1) % tabEls.length;
		if (e.key === "Home")       next = 0;
		if (e.key === "End")        next = tabEls.length - 1;
		activate(tabEls[next].dataset.tab, { scrollIntoView: true });
		tabEls[next].focus();
	});

	// 复制：统一事件委托
	document.addEventListener("click", function (e) {
		if (!e.target.closest) return;

		var btn = e.target.closest("[data-copy]");
		if (btn) handleCopy(btn, btn.getAttribute("data-copy"));
	});

	// 浏览器前进 / 后退
	window.addEventListener("hashchange", function () {
		activate(location.hash.replace(/^#/, ""));
	});

	/* ---------- 数据加载 ----------
	 * 内容是异步取回来的，所以渲染要等数据到位。
	 * 一次性把所有分类并行取完再渲染：分类数不多（每个几 KB），
	 * 换来的是切 Tab 依旧是同步的，不用在每个 Tab 上做加载态。
	 * 新增分类时不必改这里——清单和文件名都是自描述的。
	 */
	function loadData() {
		return fetch("data/categories.json")
			.then(function (r) { return r.json(); })
			.then(function (cats) {
				return Promise.all(cats.map(function (c) {
					return fetch("data/" + c.id + ".json").then(function (r) { return r.json(); });
				})).then(function (bodies) {
					DATA = cats.map(function (c, i) {
						return { id: c.id, name: c.name, icon: c.icon, blocks: bodies[i].blocks };
					});
				});
			});
	}

	/* ---------- 启动 ---------- */
	loadData().then(function () {
		render();
		tabEls = [].slice.call(tabsEl.querySelectorAll(".tab"));
		activate(location.hash.replace(/^#/, "") || (DATA[0] && DATA[0].id) || "");
	});
})();
</script>
