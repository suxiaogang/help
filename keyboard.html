<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>键鼠设备</title>
  <meta name="description" content="正在使用的键盘、鼠标设备信息" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%E2%8C%A8%3C/text%3E%3C/svg%3E" />
  <style>
    /* 与其它工具子页面共用同一套色板 */
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --border-soft: #2a334080;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --success: #3dd68c;
      --success-soft: rgba(61, 214, 140, .14);
      --warn: #ffb340;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap { width: 100%; max-width: 1012px; margin: 0 auto; padding: 0 16px; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ======================================================================
     *  内容区
     * ==================================================================== */
    .page { padding-top: 20px; padding-bottom: 0; }

    .panel { display: block; padding-top: 0; }

    .panel-lead {
      margin: -4px 0 18px;
      font-size: 12.5px; line-height: 1.65; color: var(--muted);
    }

    .group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
      background: var(--panel);
    }

    .group-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 8px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .group-head h3 { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: -.2px; }
    .group-head .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .group-body { padding: 12px; }
    .group-note {
      padding: 8px 12px;
      border-top: 1px solid var(--border-soft);
      font-size: 12px; line-height: 1.6; color: var(--muted);
    }

    /* ======================================================================
     *  设备卡片
     * ==================================================================== */
    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .device {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .device-head {
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 10px;
    }
    .device-head h3 { font-size: 15px; font-weight: 600; }
    .device-head .kind {
      font-size: 10.5px; font-weight: 600; color: #062315;
      background: var(--accent); border-radius: 5px;
      padding: 1px 7px; white-space: nowrap;
    }
    .device-head .state {
      margin-left: auto;
      font-size: 11px; color: var(--muted);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .device-head .state::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
    }
    .device-head .state.on::before { background: var(--accent); }
    .device-head .state.warn::before { background: var(--warn); }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .chip {
      font-size: 11px; color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px; padding: 1px 9px;
      background: var(--bg);
    }

    .specs { margin: 0; display: grid; gap: 1px; }
    .specs > div {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 10px;
      padding: 5px 0;
      border-top: 1px solid var(--border-soft);
    }
    .specs > div:first-child { border-top: 0; }
    .specs dt { font-size: 12px; color: var(--muted); }
    .specs dd {
      margin: 0; font-size: 12px; color: var(--text);
      overflow-wrap: anywhere;
    }
    .specs dd.mono { font-family: var(--mono); font-size: 11.5px; }
    .specs dd.todo { color: var(--warn); }

    .device-note {
      margin-top: 12px;
      padding: 8px 10px;
      border-top: 1px solid var(--border-soft);
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* ======================================================================
     *  键位示意
     * ==================================================================== */
    .keymap {
      --u: 36px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .keymap-inner { display: inline-block; min-width: 100%; }
    .keymap-row {
      display: flex; gap: 4px;
      margin-bottom: 4px;
    }
    .keymap-row:last-child { margin-bottom: 0; }

    .cap {
      flex: 0 0 auto;
      width: calc(var(--u) * var(--w, 1) - 4px);
      height: var(--u);
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: var(--mono);
      font-size: 10.5px; font-weight: 600;
      color: var(--text);
      overflow: hidden; white-space: nowrap;
      -webkit-user-select: none; user-select: none;
    }
    .cap.mod { font-family: var(--sans); font-size: 9.5px; color: var(--muted); }
    .cap.todo { color: var(--warn); border-style: dashed; }
    .cap.gap { visibility: hidden; }

    /* ======================================================================
     *  可复制行
     * ==================================================================== */
    .rows { display: block; }

    .row {
      display: grid;
      grid-template-columns: minmax(0, max-content) minmax(0, 1fr) 16px;
      align-items: center;
      gap: 4px 14px;
      width: 100%;
      padding: 5px 0;
      border: 0; border-top: 1px solid var(--border-soft);
      background: transparent; color: inherit;
      font: inherit; text-align: left;
      cursor: pointer;
    }
    .row:first-child { border-top: 0; }
    .row:hover { background: var(--panel-2); }
    .row[data-copied] { background: var(--success-soft); }

    .row .kbd { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .row .desc { font-size: 12px; color: var(--muted); }

    .key {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 24px; height: 24px; padding: 0 7px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11px; font-weight: 600; color: var(--text);
    }
    .key.sym { font-family: var(--sans); }
    .row:hover .key { border-color: var(--accent-2); }
    .row .plus { color: var(--muted); font-size: 10px; }
    .row .mark {
      justify-self: end;
      color: #3a4557;
      display: flex; align-items: center;
      transition: color .12s;
    }
    .row:hover .mark { color: var(--muted); }
    .row[data-copied] .mark { color: var(--success); }
    .row .mark .done { display: none; }
    .row[data-copied] .mark .idle { display: none; }
    .row[data-copied] .mark .done { display: block; }

    /* ======================================================================
     *  备注 / FAQ
     * ==================================================================== */
    .notes { display: grid; gap: 10px; }
    .note {
      border-left: 2px solid var(--border);
      padding: 1px 0 1px 10px;
    }
    .note b { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
    .note p { font-size: 12px; line-height: 1.65; color: var(--muted); }

    .faq { border-top: 1px solid var(--border-soft); }
    .faq:first-child { border-top: 0; }
    .faq summary {
      cursor: pointer;
      padding: 7px 0;
      font-size: 12.5px; font-weight: 600;
      list-style: none;
    }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary::before {
      content: "＋"; display: inline-block; width: 16px;
      color: var(--muted); font-weight: 400;
    }
    .faq[open] summary::before { content: "－"; color: var(--accent); }
    .faq summary:hover { color: var(--accent); }
    .faq p {
      margin: 0 0 8px 16px;
      font-size: 12px; line-height: 1.7; color: var(--muted);
    }

    .todo {
      color: var(--warn);
      text-decoration: underline dashed rgba(255, 179, 64, .45);
      text-underline-offset: 3px;
      cursor: help;
    }

    /* ======================================================================
     *  页脚
     * ==================================================================== */
    footer {
      flex: 0 0 auto;
      margin-top: 22px;
      border-top: 1px solid var(--border);
    }
    .wrap.foot-in {
      display: flex; align-items: center; gap: 8px;
      padding-top: 9px; padding-bottom: 22px;
      font-size: 12px; color: var(--muted);
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

    /* ======================================================================
     *  窄屏
     * ==================================================================== */
    @media (max-width: 720px) {
      .wrap { padding-left: 14px; padding-right: 14px; }

      .page { padding-top: 16px; }
      .panel-lead { margin-bottom: 14px; }

      .group-head { padding: 7px 10px; }
      .group-head .meta { display: none; }
      .group-body { padding: 10px; }
      .group-note { padding: 7px 10px; }

      .device-grid { grid-template-columns: minmax(0, 1fr); }
      .device { padding: 12px; }

      .keymap { --u: 25px; }
      .cap { font-size: 8.5px; }
      .cap.mod { font-size: 8px; }

      /* 按键行改为上下两行，避免按键组合把说明挤没 */
      .row {
        grid-template-columns: minmax(0, 1fr);
        gap: 2px; padding: 7px 0;
      }
      .row .desc { font-size: 11.5px; }
      .row .mark { display: none; }

      .specs > div { grid-template-columns: 70px minmax(0, 1fr); }

      .device-note { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }

    @media print {
      .group, .device, .faq { break-inside: avoid; }
      .row .mark { display: none; }
    }
  </style>
</head>

    '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>' +
    '<path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>';

  var ICON_DONE =
    '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>';

  /* ---------- 各块渲染 ---------- */

  function deviceHTML(d) {
    var specs = (d.specs || []).map(function (s) {
      var cls = s[2] ? " " + s[2] : "";
      return "<div><dt>" + esc(s[0]) + "</dt>" +
        '<dd class="' + cls.trim() + '">' + esc(s[1]) + "</dd></div>";
    }).join("");

    var chips = (d.chips || []).map(function (c) {
      return '<span class="chip">' + esc(c) + "</span>";
    }).join("");

    var note = d.note ? '<div class="device-note">' + esc(d.note).replace(/\n/g, "<br>") + "</div>" : "";

    return '<article class="device">' +
      '<div class="device-head">' +
        '<span class="kind">' + esc(d.kind) + "</span>" +
        "<h3>" + esc(d.name) + "</h3>" +
        '<span class="state ' + esc(d.stateClass || "") + '">' + esc(d.state || "待确认") + "</span>" +
      "</div>" +
      '<div class="chips">' + chips + "</div>" +
      '<dl class="specs">' + specs + "</dl>" +
      note +
      "</article>";
  }

  function capHTML(cap) {
    var w = cap[1] || 1;
    var cls = cap[2] ? " " + cap[2] : "";
    return '<span class="cap' + cls + '" style="--w:' + w + '">' + esc(cap[0]) + "</span>";
  }

  function keymapHTML(rows) {
    return '<div class="group-body"><div class="keymap"><div class="keymap-inner">' +
      rows.map(function (row) {
        return '<div class="keymap-row">' + row.map(capHTML).join("") + "</div>";
      }).join("") +
      "</div></div></div>";
  }

  function keyOf(k) {
    return k.map(function (x) {
      return '<span class="key' + (/^[A-Za-z0-9]+$/.test(x) ? "" : " sym") + '">' + esc(x) + "</span>";
    }).join('<span class="plus">+</span>');
  }

  function rowHTML(item) {
    var text = item.k.join(" + ");
    return '<button type="button" class="row" data-copy="' + esc(text) + '"' +
      ' title="点击复制：' + esc(text) + '" aria-label="复制 ' + esc(text) + '">' +
      '<span class="kbd">' + keyOf(item.k) + "</span>" +
      '<span class="desc">' + esc(item.d || "") + "</span>" +
      '<span class="mark" aria-hidden="true">' +
        '<span class="idle">' + ICON_COPY + "</span>" +
        '<span class="done">' + ICON_DONE + "</span>" +
      "</span>" +
      "</button>";
  }

  function noteHTML(n) {
    return '<div class="note"><b>' + esc(n.b) + "</b><p>" + esc(n.p) + "</p></div>";
  }

  function faqHTML(f) {
    return '<details class="faq"><summary>' + esc(f.q) + "</summary><p>" + esc(f.a) + "</p></details>";
  }

  function blockHTML(block) {
    var body = "";
    var headMeta = block.meta || (itemCount(block) ? itemCount(block) + " 条" : "");

    if (block.t === "devices") {
      body = '<div class="group-body"><div class="device-grid">' +
        (block.items || []).map(deviceHTML).join("") + "</div></div>";
    } else if (block.t === "keymap") {
      body = keymapHTML(block.rows || []);
    } else if (block.t === "rows") {
      body = '<div class="group-body"><div class="rows">' +
        (block.items || []).map(rowHTML).join("") + "</div></div>";
    } else if (block.t === "notes") {
      body = '<div class="group-body"><div class="notes">' +
        (block.items || []).map(noteHTML).join("") + "</div></div>";
    } else if (block.t === "faq") {
      body = '<div class="group-body">' +
        (block.items || []).map(faqHTML).join("") + "</div>";
    }

    var note = block.note ? '<div class="group-note">' + esc(block.note) + "</div>" : "";

    return '<section class="group">' +
      '<div class="group-head"><h3>' + esc(block.title || "") + "</h3>" +
        '<span class="meta">' + esc(headMeta) + "</span></div>" +
      body + note +
      "</section>";
  }



  /* ---------- 渲染整页 ---------- */
  function render() {
    var blocks = DATA[0].blocks || [];
    var total = blocks.reduce(function (n, b) { return n + itemCount(b); }, 0);

    var html = (DATA[0].lead ? '<p class="panel-lead">' + esc(DATA[0].lead) + "</p>" : "") +
      blocks.map(blockHTML).join("");

    panelsEl.innerHTML = html;
    footEl.textContent = total + " 条设备";
  }

  /* ---------- 复制 ---------- */
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
      return navigator.clipboard.writeText(text).then(
        function () { return true; },
        function () { return fallbackCopy(text); }
      );
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    btn.setAttribute("data-copied", "1");
    clearTimeout(btn._t);
    btn._t = setTimeout(function () {
      btn.removeAttribute("data-copied");
    }, 1200);
    toastEl.textContent = label + " 已复制";
  }

  function handleCopy(btn, text) {
    copy(text).then(function (ok) {
      if (ok) flash(btn, text);
      else toastEl.textContent = "复制失败，请手动选中后复制";
    });
  }

  /* ---------- 事件绑定 ---------- */

  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var btn = e.target.closest("[data-copy]");
    if (btn) handleCopy(btn, btn.getAttribute("data-copy"));
  });

  /* ---------- 启动 ---------- */
  render();
})();
</script>
</body>
</html>
