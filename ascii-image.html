<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image to ASCII Art</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --line: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --preview-bg: #191a1c;
      --preview-fg: #bdbec3;
      --radius: 14px;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body { padding: 24px 18px 32px; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .controls, .output-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .upload-field { grid-column: 1 / -1; }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    textarea, select, input[type="text"], input[type="number"], input[type="range"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #10151c;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      outline: none;
      height: 41px;
    }

    textarea:focus, select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.15);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
      font-family: var(--mono);
      line-height: 1.4;
    }

    input[type="range"] {
      padding: 0;
      height: 30px;
    }

    .range-value {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .upload-area {
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: rgba(61, 214, 140, 0.05);
    }

    .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(61, 214, 140, 0.1);
    }

    .upload-area .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-area .text {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .upload-area input[type="file"] {
      display: none;
    }

    .preview-container {
      position: relative;
      margin-top: 12px;
      display: none;
    }

    .preview-container.has-image { display: block; }

    .preview-image {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .remove-image {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 41px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .checkbox-group label {
      margin: 0;
      font-size: 0.85rem;
    }

    .output-card { padding: 12px; }

    .output-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .output-head label { margin: 0; }

    .output-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .output-tools button { flex: 0 0 auto; }

    .status {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status.error { color: var(--danger); }
    .status.loading { color: var(--accent); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: #062315;
      height: 41px;
    }

    button:hover { background: var(--accent-2); }

    button.ghost {
      background: #273140;
      color: var(--text);
    }

    button.ghost:hover { background: #324155; }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    pre {
      margin: 0;
      background: var(--preview-bg);
      color: var(--preview-fg);
      border-radius: 10px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.0;
      white-space: pre;
      overflow-x: auto;
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      background: var(--preview-bg);
      z-index: 20;
      display: none;
      padding: 24px;
    }

    .fullscreen.open { display: block; }

    .fullscreen pre {
      min-height: calc(100vh - 90px);
    }

    .fullscreen .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .status { display: none; }
      .output-head { flex-direction: column; align-items: flex-start; gap: 8px; }
      .output-tools { width: 100%; justify-content: space-between; }
      .output-tools button { flex: 1; }
      button span { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Image to ASCII Art</h1>
    <p class="sub">将图片转换为 ASCII 艺术字。支持拖拽上传、实时预览、多种字符集和颜色主题。</p>

    <section class="controls">
      <div class="upload-field">
        <label for="imageUpload">Upload Image / 上传图片</label>
        <div class="upload-area" id="uploadArea">
          <div class="icon">📷</div>
          <div class="text">拖拽图片到这里，或点击选择文件</div>
          <input type="file" id="imageUpload" accept="image/*" />
        </div>
        <div class="preview-container" id="previewContainer">
          <img class="preview-image" id="previewImage" alt="Preview" />
          <button class="remove-image" id="removeImage">移除</button>
        </div>
      </div>
      <div>
        <label for="charSet">Character Set / 字符集</label>
        <select id="charSet">
          <option value="standard">Standard (@%#*+=-:. )</option>
          <option value="detailed">Detailed ($@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\|()1{}[]?-_+~<>i!lI;:,"^`'. )</option>
          <option value="simple">Simple (#. )</option>
          <option value="blocks">Blocks (█▓▒░ )</option>
          <option value="binary">Binary (10 )</option>
        </select>
      </div>
      <div>
        <label for="outputWidth">Output Width / 输出宽度</label>
        <input type="range" id="outputWidth" value="150" min="20" max="300" />
        <div class="range-value" id="outputWidthValue">150 chars</div>
      </div>

      <div>
        <label for="contrast">Contrast / 对比度</label>
        <input type="range" id="contrast" value="0" min="0" max="200" />
        <div class="range-value" id="contrastValue">0</div>
      </div>
      <div>
        <label for="brightness">Brightness / 亮度</label>
        <input type="range" id="brightness" value="0" min="-100" max="100" />
        <div class="range-value" id="brightnessValue">0</div>
      </div>
      <div>
        <label for="colorTheme">Color Theme / 颜色主题</label>
        <select id="colorTheme">
          <option value="white">White on Black</option>
          <option value="black">Black on White</option>
          <option value="green">Green on Black</option>
          <option value="blue">Blue on Black</option>
          <option value="cyan">Cyan on Black</option>
          <option value="magenta">Magenta on Black</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="checkbox-group">
          <input type="checkbox" id="invert" />
          <label for="invert">Invert / 反转</label>
        </div>
      </div>
    </section>

    <section class="output-card">
      <div class="output-head">
        <label>ASCII Art / 输出</label>
        <div class="output-tools">
          <span class="status" id="status">Waiting for image / 等待图片</span>
          <button type="button" class="ghost" id="downloadBtn" disabled><span></span>Download PNG / 下载图片</button>
          <button type="button" class="ghost" id="fullscreenBtn"><span></span>Fullscreen / 全屏</button>
          <button type="button" id="copyBtn" disabled><span>Copy / </span>复制</button>
        </div>
      </div>
      <pre id="output" aria-live="polite"></pre>
    </section>

    <footer style="margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; color: var(--muted);">
      <p style="margin: 0 0 8px;">参考网站 / Reference Sites:</p>
      <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
        <a href="https://www.asciiart.eu/image-to-ascii" target="_blank" rel="noopener">ASCII Art Archive</a>
        <a href="https://www.ascii-magic.com/tools/image-to-ascii" target="_blank" rel="noopener">ASCII Magic</a>
        <a href="https://www.rockimg.com/picture-to-ascii.html" target="_blank" rel="noopener">ROCKIMG</a>
        <a href="https://coddy.tech/tools/ascii-art-generator" target="_blank" rel="noopener">Coddy</a>
      </div>
    </footer>
  </div>

  <div class="fullscreen" id="fullscreen">
    <div class="bar">
      <strong>ASCII Art</strong>
      <button type="button" class="ghost" id="closeFullscreen">Close / 关闭</button>
    </div>
    <pre id="fullscreenOutput"></pre>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const els = {
      uploadArea: document.getElementById("uploadArea"),
      imageUpload: document.getElementById("imageUpload"),
      previewContainer: document.getElementById("previewContainer"),
      previewImage: document.getElementById("previewImage"),
      removeImage: document.getElementById("removeImage"),
      outputWidth: document.getElementById("outputWidth"),
      outputWidthValue: document.getElementById("outputWidthValue"),
      charSet: document.getElementById("charSet"),
      contrast: document.getElementById("contrast"),
      contrastValue: document.getElementById("contrastValue"),
      brightness: document.getElementById("brightness"),
      brightnessValue: document.getElementById("brightnessValue"),
      colorTheme: document.getElementById("colorTheme"),
      invert: document.getElementById("invert"),
      output: document.getElementById("output"),
      status: document.getElementById("status"),
      copy: document.getElementById("copyBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      fullscreen: document.getElementById("fullscreen"),
      fullscreenOutput: document.getElementById("fullscreenOutput"),
      closeFullscreen: document.getElementById("closeFullscreen"),
      canvas: document.getElementById("canvas")
    };

    const ctx = els.canvas.getContext("2d");
    let currentImage = null;
    let lastOutput = "";
    let renderTimer = 0;
    let isRendering = false;

    const CHAR_SETS = {
      standard: "@%#*+=-:. ",
      detailed: "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ",
      simple: "#. ",
      blocks: "█▓▒░ ",
      binary: "10 "
    };

    const COLOR_THEMES = {
      white: { fg: "#ffffff", bg: "#000000" },
      black: { fg: "#000000", bg: "#ffffff" },
      green: { fg: "#00ff00", bg: "#000000" },
      blue: { fg: "#0000ff", bg: "#000000" },
      cyan: { fg: "#00ffff", bg: "#000000" },
      magenta: { fg: "#ff00ff", bg: "#000000" }
    };

    function setStatus(message, isError = false, isLoading = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
      els.status.classList.toggle("loading", isLoading);
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please select an image file / 请选择图片文件", true);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          els.previewImage.src = e.target.result;
          els.previewContainer.classList.add("has-image");
          setStatus("Image loaded / 图片已加载");
          scheduleRender();
        };
        img.onerror = () => {
          setStatus("Failed to load image / 图片加载失败", true);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      currentImage = null;
      els.previewImage.src = "";
      els.previewContainer.classList.remove("has-image");
      els.imageUpload.value = "";
      els.output.textContent = "";
      els.fullscreenOutput.textContent = "";
      lastOutput = "";
      els.copy.disabled = true;
      els.downloadBtn.disabled = true;
      setStatus("Waiting for image / 等待图片");
    }

    function getLuminance(r, g, b) {
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function applyContrast(luminance, contrast) {
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      return factor * (luminance - 128) + 128;
    }

    function applyBrightness(luminance, brightness) {
      return luminance + brightness;
    }

    function render() {
      if (!currentImage || isRendering) return;

      isRendering = true;
      setStatus("Rendering / 渲染中...", false, true);

      setTimeout(() => {
        try {
          const width = parseInt(els.outputWidth.value) || 150;
          const aspectRatio = currentImage.height / currentImage.width;
          const height = Math.floor(width * aspectRatio * 0.6);

          els.canvas.width = width;
          els.canvas.height = height;

          ctx.drawImage(currentImage, 0, 0, width, height);
          const imageData = ctx.getImageData(0, 0, width, height);
          const pixels = imageData.data;

          const charSet = CHAR_SETS[els.charSet.value] || CHAR_SETS.standard;
          const contrast = parseInt(els.contrast.value);
          const brightness = parseInt(els.brightness.value);
          const invert = els.invert.checked;

          let result = "";

          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const idx = (y * width + x) * 4;
              const r = pixels[idx];
              const g = pixels[idx + 1];
              const b = pixels[idx + 2];

              let luminance = getLuminance(r, g, b);
              luminance = applyContrast(luminance, contrast);
              luminance = applyBrightness(luminance, brightness);
              luminance = Math.max(0, Math.min(255, luminance));

              if (invert) {
                luminance = 255 - luminance;
              }

              const charIndex = Math.floor((luminance / 255) * (charSet.length - 1));
              result += charSet[charIndex];
            }
            result += "\n";
          }

          lastOutput = result;
          els.output.textContent = result;
          els.fullscreenOutput.textContent = result;
          els.copy.disabled = false;
          els.downloadBtn.disabled = false;

          const theme = COLOR_THEMES[els.colorTheme.value];
          els.output.style.color = theme.fg;
          els.output.style.backgroundColor = theme.bg;
          els.fullscreenOutput.style.color = theme.fg;
          els.fullscreenOutput.style.backgroundColor = theme.bg;

          setStatus(`${width} x ${height} characters`);
        } catch (error) {
          setStatus(error.message || "Render failed / 渲染失败", true);
        } finally {
          isRendering = false;
        }
      }, 50);
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 300);
    }

    async function copyOutput() {
      if (!lastOutput) return;
      try {
        await navigator.clipboard.writeText(lastOutput);
        setStatus("Copied / 已复制");
      } catch {
        setStatus("Copy failed / 复制失败", true);
      }
    }

    function downloadImage() {
      if (!lastOutput) return;

      const theme = COLOR_THEMES[els.colorTheme.value];
      const fontSize = 12;
      const lineHeight = fontSize;
      const lines = lastOutput.split("\n");
      const maxWidth = Math.max(...lines.map(line => line.length)) * fontSize * 0.6;
      const canvasWidth = maxWidth + 40;
      const canvasHeight = lines.length * lineHeight + 40;

      const canvas = document.createElement("canvas");
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      ctx.fillStyle = theme.fg;
      ctx.font = `${fontSize}px ${'SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace'}`;
      ctx.textBaseline = "top";

      lines.forEach((line, index) => {
        ctx.fillText(line, 20, 20 + index * lineHeight);
      });

      const link = document.createElement("a");
      link.download = "ascii-art.png";
      link.href = canvas.toDataURL("image/png");
      link.click();

      setStatus("Downloaded / 已下载");
    }

    function updateRangeValue(slider, valueDisplay, suffix = "") {
      const value = slider.value;
      valueDisplay.textContent = value + suffix;
    }

    els.uploadArea.addEventListener("click", () => els.imageUpload.click());
    els.imageUpload.addEventListener("change", (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    els.uploadArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      els.uploadArea.classList.add("dragover");
    });

    els.uploadArea.addEventListener("dragleave", () => {
      els.uploadArea.classList.remove("dragover");
    });

    els.uploadArea.addEventListener("drop", (e) => {
      e.preventDefault();
      els.uploadArea.classList.remove("dragover");
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    els.removeImage.addEventListener("click", removeImage);

    els.outputWidth.addEventListener("input", () => {
      updateRangeValue(els.outputWidth, els.outputWidthValue, " chars");
      scheduleRender();
    });
    els.charSet.addEventListener("change", scheduleRender);
    els.contrast.addEventListener("input", () => {
      updateRangeValue(els.contrast, els.contrastValue);
      scheduleRender();
    });
    els.brightness.addEventListener("input", () => {
      updateRangeValue(els.brightness, els.brightnessValue);
      scheduleRender();
    });
    els.colorTheme.addEventListener("change", () => {
      const theme = COLOR_THEMES[els.colorTheme.value];
      els.output.style.color = theme.fg;
      els.output.style.backgroundColor = theme.bg;
      els.fullscreenOutput.style.color = theme.fg;
      els.fullscreenOutput.style.backgroundColor = theme.bg;
    });
    els.invert.addEventListener("change", scheduleRender);

    els.copy.addEventListener("click", copyOutput);
    els.downloadBtn.addEventListener("click", downloadImage);
    els.fullscreenBtn.addEventListener("click", () => els.fullscreen.classList.add("open"));
    els.closeFullscreen.addEventListener("click", () => els.fullscreen.classList.remove("open"));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") els.fullscreen.classList.remove("open");
    });

    document.addEventListener("paste", (e) => {
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.startsWith("image/")) {
          const file = items[i].getAsFile();
          handleFile(file);
          break;
        }
      }
    });

    updateRangeValue(els.outputWidth, els.outputWidthValue, " chars");
    updateRangeValue(els.contrast, els.contrastValue);
    updateRangeValue(els.brightness, els.brightnessValue);

    els.downloadBtn.disabled = true;
    els.outputWidthValue.textContent = "150 chars";
  </script>
</body>
</html>
