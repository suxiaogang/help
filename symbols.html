<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>特殊符号速查</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --line: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --radius: 14px;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body { padding: 24px 18px 32px; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    /* ---------- Tab 导航 ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 20px;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s, background-color .15s;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab[aria-selected="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #062315;
    }
    .tab .ico { font-size: 15px; line-height: 1; }

    /* ---------- 符号网格 ---------- */
    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .symbol-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .15s, background-color .15s, transform .1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .symbol-card:hover {
      border-color: var(--accent);
      background: #1c2530;
    }
    .symbol-card:active { transform: scale(0.97); }
    .symbol-card.copied {
      border-color: var(--accent);
      background: rgba(61, 214, 140, 0.1);
    }

    .symbol-char {
      font-size: 1.6rem;
      line-height: 1;
      color: var(--text);
    }
    .symbol-card[data-font="mono"] .symbol-char {
      font-family: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }
    .symbol-card[data-font="symbol"] .symbol-char {
      font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", sans-serif;
    }
    .symbol-name {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .symbol-card.copied .symbol-name {
      color: var(--accent);
    }

    /* ---------- 状态栏 ---------- */
    .status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 10px 20px;
      background: var(--accent);
      color: #062315;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .status.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ---------- 分组标题 ---------- */
    .group-title {
      margin: 28px 0 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .group-title:first-of-type { margin-top: 0; }

    /* ---------- 响应式 ---------- */
    @media (max-width: 768px) {
      body { padding: 18px 12px 28px; }
      .symbol-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
      .symbol-char { font-size: 1.3rem; }
      .symbol-card { padding: 12px 6px; }
      .tab { padding: 6px 12px; font-size: 0.8rem; }
    }
  </style>
</head>

    /* ========== DOM ========== */
    var tabsEl = document.getElementById("tabs");
    var contentEl = document.getElementById("content");
    var statusEl = document.getElementById("status");
    var statusTimer = 0;

    /* ========== 渲染 Tab ========== */
    function renderTabs() {
      tabsEl.innerHTML = CATEGORIES.map(function (cat, i) {
        return '<button type="button" class="tab" role="tab"' +
          ' id="tab-' + cat.id + '"' +
          ' aria-controls="panel-' + cat.id + '"' +
          ' aria-selected="' + (i === 0 ? "true" : "false") + '"' +
          ' tabindex="' + (i === 0 ? "0" : "-1") + '"' +
          ' data-tab="' + cat.id + '">' +
          (cat.icon ? '<span class="ico" aria-hidden="true">' + cat.icon + '</span>' : '') +
          '<span>' + cat.name + '</span>' +
          '</button>';
      }).join("");
    }

    /* ========== 渲染内容 ========== */
    function renderContent(catId) {
      var cat = CATEGORIES.find(function (c) { return c.id === catId; });
      if (!cat) return;

      var html = '<h2 class="group-title">' + cat.name + '（' + cat.symbols.length + ' 个）</h2>';
      html += '<div class="symbol-grid">';

      cat.symbols.forEach(function (sym) {
        var fontAttr = cat.id === 'macos' ? ' data-font="symbol"' : '';
        html += '<div class="symbol-card" role="button" tabindex="0"' + fontAttr +
          ' data-copy="' + sym.char.replace(/"/g, '&quot;') + '" title="点击复制：' + sym.name + '"' +
          ' aria-label="复制 ' + sym.name + ' ' + sym.char + '">' +
          '<span class="symbol-char">' + sym.char + '</span>' +
          '<span class="symbol-name">' + sym.name + '</span>' +
          '</div>';
      });

      html += '</div>';
      contentEl.innerHTML = html;
    }

    /* ========== Tab 切换 ========== */
    function activate(catId, updateHash) {
      var cat = CATEGORIES.find(function (c) { return c.id === catId; });
      if (!cat) cat = CATEGORIES[0];

      // 更新 Tab 状态
      tabsEl.querySelectorAll('.tab').forEach(function (tab) {
        var on = tab.dataset.tab === cat.id;
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
        tab.tabIndex = on ? 0 : -1;
      });

      renderContent(cat.id);

      if (updateHash !== false) {
        history.replaceState(null, '', '#' + cat.id);
      }
    }

    /* ========== 复制 ========== */
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy') ? resolve() : reject();
        } catch (e) {
          reject(e);
        }
        document.body.removeChild(ta);
      });
    }

    function showStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(function () {
        statusEl.classList.remove('show');
      }, 1500);
    }

    function handleCopy(card) {
      var text = card.dataset.copy;
      copyText(text).then(function () {
        card.classList.add('copied');
        setTimeout(function () { card.classList.remove('copied'); }, 1000);
        showStatus('已复制：' + text);
      }).catch(function () {
        showStatus('复制失败，请手动复制');
      });
    }

    /* ========== 事件绑定 ========== */
    tabsEl.addEventListener('click', function (e) {
      var tab = e.target.closest('.tab');
      if (tab) activate(tab.dataset.tab);
    });

    tabsEl.addEventListener('keydown', function (e) {
      var tabs = Array.from(tabsEl.querySelectorAll('.tab'));
      var current = tabs.findIndex(function (t) { return t.getAttribute('aria-selected') === 'true'; });
      if (current < 0) return;

      var next = current;
      if (e.key === 'ArrowRight') next = (current + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = tabs.length - 1;
      else return;

      e.preventDefault();
      activate(tabs[next].dataset.tab);
      tabs[next].focus();
    });

    contentEl.addEventListener('click', function (e) {
      var card = e.target.closest('.symbol-card');
      if (card) handleCopy(card);
    });

    contentEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.symbol-card');
      if (card) {
        e.preventDefault();
        handleCopy(card);
      }
    });

    window.addEventListener('hashchange', function () {
      activate(location.hash.replace(/^#/, ''), false);
    });

    /* ========== 启动 ========== */
    renderTabs();
    activate(location.hash.replace(/^#/, '') || CATEGORIES[0].id, false);
  </script>
</body>
</html>
