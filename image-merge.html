<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片合并工具</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --accent-strong: #3dd68c;
      --danger: #ff6b6b;
      --ok: #3dd68c;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;          /* 整页不滚动，各区块自己管 */
    }

    /* ---------- 页头 ---------- */
    header {
      flex: 0 0 auto;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: .3px;
    }

    header .hint {
      font-size: 12px;
      color: var(--muted);
    }

    /* ---------- 两列布局：左窄右宽 ---------- */
    .layout {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(340px, 380px) minmax(0, 1fr);
      min-height: 0;            /* 关键：允许子项在 grid 中收缩，才不会出现外层滚动条 */
    }

    .column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .column.left  { border-right: 1px solid var(--border); }

    .col-head {
      flex: 0 0 auto;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .col-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---------- 按钮 ---------- */
    button {
      font: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      transition: background .15s, border-color .15s, opacity .15s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #232c39; border-color: #3a4557; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #062315;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }

    button.danger {
      background: transparent;
      border-color: rgba(248, 113, 113, .4);
      color: var(--danger);
    }
    button.danger:hover:not(:disabled) { background: rgba(248, 113, 113, .14); }

    /* ---------- 左列：添加区 ---------- */
    .drop {
      flex: 0 0 auto;
      margin: 12px 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background-color .2s;
    }
    .drop:hover,
    .drop.dragover {
      border-color: var(--accent);
      background: rgba(61, 214, 140, .06);
    }
    .drop .icon { font-size: 26px; }
    .drop .text { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
    .drop .text b { color: var(--text); }
    .drop input[type="file"] { display: none; }

    /* ---------- 左列：选项 ---------- */
    .options {
      flex: 0 0 auto;
      padding: 0 14px 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .field > label {
      display: block;
      margin: 0 0 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    select, input[type="color"] {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 9px;
      font: inherit;
      font-size: 12px;
      height: 34px;
      outline: none;
      cursor: pointer;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, .15);
    }
    input[type="color"] { padding: 3px; }

    input[type="range"] {
      width: 100%;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
    }

    .range-value {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      line-height: 1;
      margin-top: 3px;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      cursor: pointer;
      user-select: none;
      padding-top: 8px;
    }
    .switch input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .switch span { font-size: 12px; line-height: 1; }

    /* ---------- 左列：图片列表（唯一可滚动区） ---------- */
    .list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .item {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .item .idx {
      flex: 0 0 auto;
      width: 22px; height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-2);
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
    }

    .item .thumb {
      flex: 0 0 auto;
      width: 40px; height: 40px;
      border-radius: 6px;
      background: #0a0d12;
      object-fit: contain;
    }

    .item .info { flex: 1 1 auto; min-width: 0; }
    .item .name {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .meta {
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 2px;
    }

    .item .ops { flex: 0 0 auto; display: flex; gap: 4px; }
    .item .ops button { padding: 3px 7px; font-size: 11px; }

    /* ---------- 右列：预览 ---------- */
    /* flex + min-height:0 + img 的 max-height:100%，让预览图自动缩放到
       剩余可用高度内，长图也能一屏看全，不产生任何滚动条。 */
    .preview {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    /* 预览图铺满容器再由 object-fit 等比内缩。
       比 max-width/max-height 百分比更可靠：容器尺寸由 flex 决定（确定值），
       图一定完整落在可视区内，长图也不会撑出滚动条。 */
    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
    }

    .placeholder {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      line-height: 2;
      user-select: none;
    }
    .placeholder .big { font-size: 34px; display: block; margin-bottom: 4px; opacity: .5; }

    /* ---------- 右列：底部信息 + 导出 ---------- */
    .meta-bar {
      flex: 0 0 auto;
      padding: 8px 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 38px;
    }
    .meta-bar b { color: var(--text); font-weight: 600; font-family: var(--mono); }

    .status {
      flex: 0 0 auto;
      padding: 8px 18px;
      font-size: 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
    }
    .status.error { color: var(--danger); }
    .status.ok    { color: var(--ok); }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .status.error .dot { background: var(--danger); }
    .status.ok .dot    { background: var(--ok); }

    /* ---------- 响应式：窄屏改上下，允许整页滚动 ---------- */
    @media (max-width: 820px) {
      html, body { height: auto; }
      body { overflow: visible; }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        min-height: 0;
      }

      .column.left {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      /* 小屏上左列不再受限高压缩，列表给一个可用高度并内部滚动 */
      .list { max-height: 46vh; }

      /* 右列预览给一个稳定的可视高度，避免被内容挤扁 */
      .column.right { min-height: 60vh; }
      .preview { min-height: 40vh; }

      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>图片合并</h1>
    <span class="hint">多图合并成长图 · 全部在本地浏览器完成，图片不上传</span>
  </header>

  <div class="layout">

    <!-- ================= 左列：输入 ================= -->
    <section class="column left">

      <div class="col-head"><span>添加图片</span></div>

      <div class="drop" id="drop">
        <div class="icon">🖼️</div>
        <div class="text"><b>点击选择</b>（可多选），或把多张图片拖到这里<br />也可以直接 Ctrl/⌘ + V 粘贴</div>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>

      <div class="options">
        <div class="field">
          <label for="direction">合并方向</label>
          <select id="direction">
            <option value="vertical" selected>纵向（上下）</option>
            <option value="horizontal">横向（左右）</option>
          </select>
        </div>

        <div class="field">
          <label for="gutters">图片间距</label>
          <input type="range" id="gutters" min="0" max="60" step="1" value="0" />
          <div class="range-value" id="guttersValue">0 px</div>
        </div>

        <div class="field">
          <label for="borderColor">边框颜色</label>
          <input type="color" id="borderColor" value="#ffffff" />
        </div>

        <div class="field">
          <label for="borderWidth">边框宽度</label>
          <input type="range" id="borderWidth" min="0" max="60" step="1" value="0" />
          <div class="range-value" id="borderWidthValue">无边框</div>
        </div>

        <div class="field">
          <label for="canvasColor">画布底色</label>
          <input type="color" id="canvasColor" value="#ffffff" />
        </div>

        <div class="field">
          <label for="format">导出格式</label>
          <select id="format">
            <option value="image/jpeg" selected>JPG（最高质量）</option>
            <option value="image/png">PNG（保留透明）</option>
          </select>
        </div>

        <div class="field">
          <label for="maxWidth">统一宽度</label>
          <select id="maxWidth">
            <option value="0" selected>自适应最宽</option>
            <option value="800">800 px</option>
            <option value="1080">1080 px</option>
            <option value="1280">1280 px</option>
            <option value="1920">1920 px</option>
          </select>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <label class="switch">
            <input type="checkbox" id="transparent" />
            <span>透明背景（仅 PNG）</span>
          </label>
        </div>
      </div>

      <div class="col-head">
        <span>已添加 <b id="listCount">0</b> 张 · 按顺序合并</span>
        <div class="actions">
          <button type="button" id="clearBtn">清空</button>
        </div>
      </div>

      <div class="list" id="list"></div>
    </section>

    <!-- ================= 右列：输出 ================= -->
    <section class="column right">

      <div class="col-head">
        <span>合并预览</span>
        <span id="previewDim" style="font-family:var(--mono);font-weight:400"></span>
      </div>

      <div class="preview" id="preview"></div>

      <div class="meta-bar" id="metaBar"></div>

      <div class="col-head">
        <span>导出</span>
        <div class="actions">
          <button type="button" class="primary" id="exportBtn" disabled>导出图片</button>
        </div>
      </div>

      <div class="status" id="status"><span class="dot"></span><span id="statusText">还没有添加图片。</span></div>
    </section>
  </div>

  <script>
  (function () {
    "use strict";

    /* ============================================================
       常量
       ============================================================ */
    var JPEG_QUALITY = 1;   // JPG 固定最高质量

    /* ============================================================
       DOM
       ============================================================ */
    var drop        = document.getElementById("drop");
    var fileInput   = document.getElementById("fileInput");
    var direction   = document.getElementById("direction");
    var gutters     = document.getElementById("gutters");
    var guttersVal  = document.getElementById("guttersValue");
    var borderWidth = document.getElementById("borderWidth");
    var borderWVal  = document.getElementById("borderWidthValue");
    var borderCol   = document.getElementById("borderColor");
    var canvasCol   = document.getElementById("canvasColor");
    var formatSel   = document.getElementById("format");
    var maxWidthSel = document.getElementById("maxWidth");
    var transparent = document.getElementById("transparent");

    var list        = document.getElementById("list");
    var listCount   = document.getElementById("listCount");
    var clearBtn    = document.getElementById("clearBtn");
    var preview     = document.getElementById("preview");
    var previewDim  = document.getElementById("previewDim");
    var metaBar     = document.getElementById("metaBar");
    var exportBtn   = document.getElementById("exportBtn");
    var statusEl    = document.getElementById("status");
    var statusText  = document.getElementById("statusText");

    /* ============================================================
       状态
       ============================================================ */
    var items = [];          // [{ name, img, url }]
    var resultCanvas = null; // 完整分辨率的合并结果，用于导出

    /* ============================================================
       工具
       ============================================================ */
    function setStatus(text, kind) {
      statusText.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / 1024 / 1024).toFixed(2) + " MB";
    }

    function canvasToBlob(canvas, type, q) {
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error("导出失败"));
        }, type, q);
      });
    }

    function releaseAll() {
      items.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); });
      items = [];
      resultCanvas = null;
    }

    /* ============================================================
       添加图片
       ============================================================ */
    async function loadImageFile(file) {
      if (!/^image\//.test(file.type)) throw new Error(file.name + " 不是图片");
      if (file.size > 40 * 1024 * 1024) throw new Error(file.name + " 超过 40MB");

      if (typeof createImageBitmap === "function") {
        try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
        catch (e) { return await createImageBitmap(file); }
      }
      return await new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve(img); };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error(file.name + " 解码失败")); };
        img.src = url;
      });
    }

    async function addFiles(fileList) {
      var files = Array.prototype.slice.call(fileList || []);
      if (!files.length) return;

      setStatus("正在读取 " + files.length + " 张图片…");
      var failed = [];

      for (var i = 0; i < files.length; i++) {
        try {
          var img = await loadImageFile(files[i]);
          items.push({
            name: files[i].name || "图片 " + (items.length + 1),
            img: img,
            url: URL.createObjectURL(files[i])
          });
        } catch (e) { failed.push(e.message); }
      }

      renderList();
      await merge();

      if (failed.length) setStatus("部分图片添加失败：" + failed.join("；"), "error");
    }

    /* ============================================================
       列表
       ============================================================ */
    function renderList() {
      list.innerHTML = "";
      listCount.textContent = items.length;

      if (!items.length) {
        var empty = document.createElement("div");
        empty.style.cssText = "color:var(--muted);font-size:12px;text-align:center;padding:24px 0;line-height:1.8";
        empty.textContent = "还没有图片";
        list.appendChild(empty);
        return;
      }

      items.forEach(function (it, index) {
        var row = document.createElement("div");
        row.className = "item";

        var idx = document.createElement("span");
        idx.className = "idx";
        idx.textContent = index + 1;

        var thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.src = it.url;
        thumb.alt = it.name;

        var info = document.createElement("div");
        info.className = "info";

        var name = document.createElement("div");
        name.className = "name";
        name.textContent = it.name;
        name.title = it.name;

        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = it.img.width + "×" + it.img.height;

        info.appendChild(name);
        info.appendChild(meta);

        var ops = document.createElement("div");
        ops.className = "ops";

        var up = document.createElement("button");
        up.type = "button";
        up.textContent = "↑";
        up.title = "上移";
        up.disabled = index === 0;
        up.addEventListener("click", function () { move(index, -1); });

        var down = document.createElement("button");
        down.type = "button";
        down.textContent = "↓";
        down.title = "下移";
        down.disabled = index === items.length - 1;
        down.addEventListener("click", function () { move(index, 1); });

        var del = document.createElement("button");
        del.type = "button";
        del.className = "danger";
        del.textContent = "✕";
        del.title = "删除";
        del.addEventListener("click", function () { removeAt(index); });

        ops.appendChild(up);
        ops.appendChild(down);
        ops.appendChild(del);

        row.appendChild(idx);
        row.appendChild(thumb);
        row.appendChild(info);
        row.appendChild(ops);
        list.appendChild(row);
      });
    }

    async function move(index, delta) {
      var t = index + delta;
      if (t < 0 || t >= items.length) return;
      var tmp = items[index];
      items[index] = items[t];
      items[t] = tmp;
      renderList();
      await merge();
    }

    async function removeAt(index) {
      var it = items[index];
      if (it && it.url) URL.revokeObjectURL(it.url);
      items.splice(index, 1);
      renderList();
      await merge();
    }

    /* 空状态提示。placeholder 每次重新构建，
       避免 innerHTML 清空后旧节点变成游离元素。 */
    function showPlaceholder() {
      preview.innerHTML =
        '<div class="placeholder"><span class="big">🖼️</span>' +
        '在左侧添加图片后<br>这里会显示合并结果</div>';
    }

    function resetOutput() {
      showPlaceholder();
      previewDim.textContent = "";
      metaBar.innerHTML = "";
      exportBtn.disabled = true;
    }

    async function clearAll() {
      releaseAll();
      renderList();
      resetOutput();
      setStatus("已清空，可以重新添加图片。");
    }

    /* ============================================================
       核心：合并
       ------------------------------------------------------------
       1. 把每张图等比缩放到统一宽度，保证各段对齐
       2. 先算出「内容区」尺寸 = 各段尺寸之和 + 间距
       3. 边框是整幅合并图的一圈外框，画布 = 内容区 + 边框×2

       边框做成整幅外框而不是每张图各一圈，是为了解耦两个参数：
       如果每张图上下左右都加边框宽，两张相邻图之间的距离会变成
       「间距 + 2×边框宽」，一拖边框，图片间距就跟着变。
       改成整幅外框后，图片之间的距离始终等于间距值，边框只影响
       合并图整体的尺寸。
       ============================================================ */
    async function merge() {
      if (!items.length) {
        resultCanvas = null;
        resetOutput();
        setStatus("还没有添加图片。");
        return;
      }

      try {
        var dir    = direction.value;
        var gap    = parseInt(gutters.value, 10) || 0;
        var bw     = parseInt(borderWidth.value, 10) || 0;
        var limit  = parseInt(maxWidthSel.value, 10) || 0;

        // 统一宽度：指定值，或取最宽的一张
        var targetW = limit > 0
          ? limit
          : items.reduce(function (m, it) { return Math.max(m, it.img.width); }, 0);

        var sized = items.map(function (it) {
          var scale = targetW / it.img.width;
          return {
            src: it.img,
            w: targetW,
            h: Math.max(1, Math.round(it.img.height * scale))
          };
        });

        /* ---- 内容区尺寸（不含边框）---- */
        var contentW, contentH;
        if (dir === "vertical") {
          contentW = targetW;
          contentH = sized.reduce(function (h, s) { return h + s.h; }, 0)
                   + gap * (sized.length - 1);
        } else {
          contentW = sized.reduce(function (w, s) { return w + s.w; }, 0)
                   + gap * (sized.length - 1);
          contentH = Math.max.apply(null, sized.map(function (s) { return s.h; }));
        }

        /* ---- 画布 = 内容区 + 四周外框 ---- */
        var canvasW = contentW + bw * 2;
        var canvasH = contentH + bw * 2;

        var canvas = document.createElement("canvas");
        canvas.width = canvasW;
        canvas.height = canvasH;

        var ctx = canvas.getContext("2d");

        // 整幅铺边框色，等于画出一圈外框
        ctx.fillStyle = borderCol.value;
        ctx.fillRect(0, 0, canvasW, canvasH);

        // 内层再铺画布底色；PNG 且勾了透明就挖空
        var useTransparent = transparent.checked && formatSel.value === "image/png";
        if (useTransparent) {
          ctx.clearRect(bw, bw, contentW, contentH);
        } else {
          ctx.fillStyle = canvasCol.value;
          ctx.fillRect(bw, bw, contentW, contentH);
        }

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        // 逐张绘制，起点偏移一个边框宽度
        var offset = 0;
        for (var i = 0; i < sized.length; i++) {
          var s = sized[i];
          var dx, dy;

          if (dir === "vertical") {
            dx = bw;
            dy = bw + offset;
            offset += s.h + (i < sized.length - 1 ? gap : 0);
          } else {
            dx = bw + offset;
            dy = bw;
            offset += s.w + (i < sized.length - 1 ? gap : 0);
          }

          ctx.drawImage(s.src, 0, 0, s.src.width, s.src.height, dx, dy, s.w, s.h);
        }

        resultCanvas = canvas;
        exportBtn.disabled = false;
        previewDim.textContent = canvasW + " × " + canvasH + " px";

        showPreview(canvas);
        setMeta(dir, gap, bw, sized.length);

        var blob = await canvasToBlob(canvas, formatSel.value, JPEG_QUALITY);
        setStatus("已合并 " + sized.length + " 张 · 输出 " + canvasW + " × " + canvasH +
                  " px · 约 " + formatBytes(blob.size), "ok");
      } catch (err) {
        resultCanvas = null;
        exportBtn.disabled = true;
        setStatus("合并失败：" + (err && err.message ? err.message : err), "error");
      }
    }

    /* 预览图按当前可用空间动态缩放。
       先把结果缩到一张 ≤1200px 的缩略图，再交给 CSS 的
       max-width/max-height 按剩余空间等比显示 —— 这样即使是很长的
       合并图也能一屏看全，不会出现滚动条。
       完整分辨率始终保留在 resultCanvas 里，导出不受预览缩放影响。 */
    function showPreview(canvas) {
      var maxSide = 1200;
      var scale = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));

      var pc = document.createElement("canvas");
      pc.width  = Math.max(1, Math.round(canvas.width * scale));
      pc.height = Math.max(1, Math.round(canvas.height * scale));

      var pctx = pc.getContext("2d");
      pctx.imageSmoothingQuality = "high";
      pctx.drawImage(canvas, 0, 0, pc.width, pc.height);

      var img = new Image();
      img.alt = "合并结果预览";
      img.src = pc.toDataURL("image/png");

      preview.innerHTML = "";
      preview.appendChild(img);
    }

    function setMeta(dir, gap, bw, count) {
      var parts = [];
      parts.push("张数 <b>" + count + "</b>");
      parts.push("方向 <b>" + (dir === "vertical" ? "纵向" : "横向") + "</b>");
      parts.push("间距 <b>" + gap + "px</b>");
      parts.push("边框 <b>" + (bw > 0 ? bw + "px" : "无") + "</b>");
      parts.push("格式 <b>" + (formatSel.value === "image/png" ? "PNG" : "JPG") + "</b>");
      metaBar.innerHTML = parts.map(function (p) { return "<span>" + p + "</span>"; }).join("");
    }

    /* ============================================================
       导出
       ============================================================ */
    async function exportImage() {
      if (!resultCanvas) return;
      var isPng = formatSel.value === "image/png";
      var blob = await canvasToBlob(resultCanvas, formatSel.value, JPEG_QUALITY);
      var url = URL.createObjectURL(blob);

      var a = document.createElement("a");
      a.href = url;
      a.download = "merged." + (isPng ? "png" : "jpg");
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setStatus("已导出 merged." + (isPng ? "png" : "jpg") + "（" + formatBytes(blob.size) + "）", "ok");
    }

    /* ============================================================
       事件
       ============================================================ */
    drop.addEventListener("click", function () { fileInput.click(); });

    fileInput.addEventListener("change", function (e) {
      addFiles(e.target.files);
      fileInput.value = "";   // 允许重复选择同一批文件
    });

    ["dragenter", "dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault();
        drop.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      drop.addEventListener(ev, function () { drop.classList.remove("dragover"); });
    });
    drop.addEventListener("drop", function (e) {
      e.preventDefault();
      addFiles(e.dataTransfer && e.dataTransfer.files);
    });

    document.addEventListener("paste", function (e) {
      if (!e.clipboardData || !e.clipboardData.files) return;
      var files = Array.prototype.slice.call(e.clipboardData.files)
        .filter(function (f) { return /^image\//.test(f.type); });
      if (files.length) { addFiles(files); e.preventDefault(); }
    });

    gutters.addEventListener("input", function () {
      guttersVal.textContent = this.value + " px";
    });

    borderWidth.addEventListener("input", function () {
      borderWVal.textContent = this.value === "0" ? "无边框" : this.value + " px";
    });

    [direction, borderWidth, borderCol, canvasCol, formatSel, maxWidthSel, transparent]
      .forEach(function (el) { el.addEventListener("change", merge); });
    gutters.addEventListener("change", merge);

    clearBtn.addEventListener("click", clearAll);
    exportBtn.addEventListener("click", exportImage);

    renderList();
    merge();
  })();
  </script>
</body>
</html>
