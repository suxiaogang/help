<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片转 GIF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --warn: #ffb340;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      flex: 0 0 auto; padding: 11px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header .hint { font-size: 12px; color: var(--muted); }

    .layout {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(340px, 380px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
    }
    .column { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .column.left { border-right: 1px solid var(--border); }

    .col-head {
      flex: 0 0 auto; padding: 9px 16px;
      font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .5px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; border-bottom: 1px solid var(--border);
    }
    .col-head .actions { display: flex; gap: 6px; }

    .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }

    button {
      font: inherit; font-size: 12px; padding: 6px 12px;
      border-radius: 7px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text);
      cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    button:hover:not(:disabled) { background: #232c39; border-color: #3a4557; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #062315; font-weight: 600; }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
    button.mini { padding: 4px 9px; font-size: 11px; }

    .drop {
      flex: 0 0 auto; margin: 8px 14px;
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 9px 14px; text-align: center; cursor: pointer;
      transition: border-color .2s, background-color .2s;
    }
    .drop:hover, .drop.dragover { border-color: var(--accent); background: rgba(61, 214, 140, .06); }
    .drop .inner { display: flex; align-items: center; gap: 10px; text-align: left; }
    .drop .icon { font-size: 19px; line-height: 1; flex: 0 0 auto; }
    .drop .text { color: var(--muted); font-size: 11px; line-height: 1.35; }
    .drop .text b { color: var(--text); }
    .drop input[type="file"] { display: none; }

    .panel { padding: 0 14px 8px; }
    .group + .group { margin-top: 6px; }
    .group-title {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: .4px; margin-bottom: 6px;
    }
    .group-title small { color: var(--muted); font-weight: 400; margin-left: 5px; }

    .seg { display: grid; gap: 6px; }
    .seg.c3 { grid-template-columns: repeat(3, 1fr); }
    .seg.c4 { grid-template-columns: repeat(4, 1fr); }
    .seg.c5 { grid-template-columns: repeat(5, 1fr); }
    .seg button { padding: 5px 2px; font-size: 11.5px; }
    .seg button.on { background: var(--accent); border-color: var(--accent); color: #062315; font-weight: 600; }

    .slider-row { display: flex; align-items: center; gap: 9px; margin-top: 7px; }
    input[type="range"] {
      flex: 1 1 auto; min-width: 0; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: var(--border); border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    .slider-val {
      flex: 0 0 auto; min-width: 56px; text-align: right;
      font-family: var(--mono); font-size: 11px; color: var(--text);
    }

    select {
      font: inherit; font-size: 11.5px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 8px; cursor: pointer; width: 100%;
    }

    .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    input[type="number"] {
      font: inherit; font-size: 11.5px; width: 64px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 8px; text-align: center;
    }

    .hint-line { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--muted); }
    .hint-line b { color: var(--text); font-weight: 600; }
    .hint-line.ok { color: var(--accent); }
    .hint-line.warn { color: var(--warn); }

    .actions-stack { display: flex; flex-direction: column; gap: 7px; }
    .actions-stack button { width: 100%; padding: 9px; font-size: 12.5px; }

    /* ---- 右列 ---- */
    .preview { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 16px; }
    .pv-top { flex: 0 0 auto; }
    .pv-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-top: 12px; padding-right: 2px; }

    .empty {
      height: 200px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px;
    }
    .empty .big { font-size: 38px; line-height: 1; opacity: .5; }

    .stage {
      height: clamp(220px, 44vh, 480px);
      background-image:
        linear-gradient(45deg, #222a36 25%, transparent 25%, transparent 75%, #222a36 75%),
        linear-gradient(45deg, #222a36 25%, transparent 25%, transparent 75%, #222a36 75%);
      background-size: 12px 12px;
      background-position: 0 0, 6px 6px;
      background-color: #161b22;
      border: 1px solid var(--border); border-radius: 9px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .stage img { max-width: 100%; max-height: 100%; display: block; }

    .meta {
      display: flex; gap: 18px; flex-wrap: wrap; margin-top: 9px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .meta .k { color: var(--muted); }
    .meta .v { color: var(--text); margin-left: 5px; }
    .meta .v.hl { color: var(--accent); font-weight: 600; }

    /* 帧条 */
    .strip { display: flex; gap: 7px; flex-wrap: wrap; }
    .fchip {
      position: relative; width: 94px; border-radius: 7px; overflow: hidden;
      border: 1px solid var(--border); background: #161b22;
      cursor: grab; touch-action: none;   /* 触屏拖拽时别触发页面滚动 */
      user-select: none; -webkit-user-select: none;
    }
    .fchip:hover { border-color: #3a4557; }
    /* 拖拽时的占位卡：留出空位，让其它卡的移位看得见 */
    .fchip.ghost {
      opacity: .28;
      border-style: dashed; border-color: var(--accent);
    }
    .fchip img, .fchip canvas { display: block; width: 100%; height: 66px; object-fit: cover; }
    /* 图片默认可被浏览器原生拖拽，一旦触发就会接管指针事件，
       导致自绘的拖拽排序完全失效。必须显式关掉。 */
    .fchip img, .fchip canvas { -webkit-user-drag: none; user-drag: none; }
    .fchip .no {
      position: absolute; left: 3px; top: 3px;
      font-family: var(--mono); font-size: 9.5px;
      background: rgba(0,0,0,.6); color: #fff;
      padding: 0 4px; border-radius: 3px;
    }
    .fchip .rm {
      position: absolute; right: 2px; top: 2px;
      width: 15px; height: 15px; line-height: 13px; text-align: center;
      font-size: 10px; padding: 0; border-radius: 4px;
      background: rgba(0,0,0,.6); border: none; color: #fff;
    }
    .fchip .rm:hover { background: var(--danger, #ff6b6b); }
    .fchip .nm {
      font-size: 9px; color: var(--muted); padding: 2px 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    }

    .progress { height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 9px; }
    .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

    body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
    body.dragging .fchip { cursor: grabbing; }

    footer {
      flex: 0 0 auto; padding: 9px 20px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3542; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4557; }

    @media (max-width: 820px) {
      html, body { height: auto; }
      body { overflow: visible; }
      .layout { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      .column.left { border-right: none; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .scroll { overflow: visible; }
      .preview { min-height: 0; }
      .empty { height: 160px; }
      .col-head { flex-wrap: wrap; padding: 9px 12px; }
      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>图片转 GIF</h1>
    <span class="hint">多张连续照片合成动图 · 按文件名排序，适配连拍 · 纯前端处理，照片不上传</span>
  </header>

  <div class="layout">

    <!-- ============ 左列 ============ -->
    <section class="column left">
      <div class="drop" id="drop">
        <div class="inner">
          <div class="icon">🖼️</div>
          <div class="text"><b>点击选择多张图片</b>，或拖拽到这里<br />也可 Ctrl/⌘ + V 粘贴</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>

      <div class="scroll">
        <div class="panel">

          <div class="group">
            <div class="group-title"><span>帧间隔</span><span id="durTotal" style="color:var(--muted);font-weight:400"></span></div>
            <div class="seg c4" id="durPresets">
              <button type="button" data-dur="100">0.1s</button>
              <button type="button" data-dur="200">0.2s</button>
              <button type="button" data-dur="300">0.3s</button>
              <button type="button" data-dur="500">0.5s</button>
              <button type="button" data-dur="800" class="on">0.8s</button>
              <button type="button" data-dur="1200">1.2s</button>
              <button type="button" data-dur="2000">2s</button>
              <button type="button" data-dur="custom">自定义</button>
            </div>
            <div class="slider-row">
              <input type="range" id="durRange" min="10" max="3000" step="10" value="800" />
              <span class="slider-val" id="durVal">800 ms</span>
            </div>
          </div>

          <div class="group">
            <div class="group-title"><span>循环</span></div>
            <div class="seg c3" id="loopSeg">
              <button type="button" data-loop="0" class="on">无限循环</button>
              <button type="button" data-loop="-1">播放一次</button>
              <button type="button" data-loop="n">指定次数</button>
            </div>
            <div class="row2" id="loopRow" style="display:none;margin-top:7px">
              <span class="hint-line" style="margin:0">重复播放</span>
              <input type="number" id="loopN" min="1" max="999" value="3" />
              <span style="font-size:11px;color:var(--muted)">次</span>
            </div>
          </div>

          <div class="group">
            <div class="group-title"><span>尺寸<small>缩小是最有效的减重手段</small></span></div>
            <select id="sizeSel">
              <option value="0">保持原始尺寸</option>
              <option value="2560">最长边 2560</option>
              <option value="2048">最长边 2048</option>
              <option value="1920">最长边 1920</option>
              <option value="1600">最长边 1600</option>
              <option value="1440">最长边 1440</option>
              <option value="1280">最长边 1280</option>
              <option value="1024">最长边 1024</option>
              <option value="960">最长边 960</option>
              <option value="800" selected>最长边 800</option>
              <option value="640">最长边 640</option>
              <option value="480">最长边 480</option>
              <option value="320">最长边 320</option>
              <option value="240">最长边 240</option>
            </select>
          </div>

          <div class="group">
            <div class="group-title"><span>颜色数<small>GIF 上限 256</small></span></div>
            <div class="seg c5" id="colorSeg">
              <button type="button" data-color="16">16</button>
              <button type="button" data-color="32">32</button>
              <button type="button" data-color="64">64</button>
              <button type="button" data-color="128">128</button>
              <button type="button" data-color="256" class="on">256</button>
            </div>
            <div class="hint-line">已用<b>全局调色板</b>：所有帧共用一份颜色表，避免逐帧变色造成的闪烁。</div>
          </div>

          <div class="group">
            <div class="group-title"><span>导出</span></div>
            <div class="actions-stack">
              <button type="button" class="primary" id="makeBtn" disabled>生成 GIF</button>
              <button type="button" id="dlBtn" disabled>下载 .gif</button>
            </div>
            <div class="progress" id="progWrap" style="display:none"><i id="progBar"></i></div>
            <div class="hint-line" id="statusLine"></div>
          </div>

        </div>
      </div>
    </section>

    <!-- ============ 右列 ============ -->
    <section class="column right">
      <div class="col-head">
        <span>动图预览</span>
        <div class="actions">
          <button type="button" class="mini" id="clearBtn" disabled>清空</button>
        </div>
      </div>

      <div class="preview" id="preview">
        <div class="pv-top">
          <div class="empty" id="empty">
            <div class="big">🎞️</div>
            <div>选择多张照片开始</div>
            <div style="font-size:11.5px;color:var(--muted)">照片会按<b>文件名</b>排序，连拍最省心</div>
          </div>

          <div id="gifWrap" hidden>
            <div class="stage" id="stage"></div>
            <div class="meta">
              <span><span class="k">帧数</span><span class="v" id="mFrames">—</span></span>
              <span><span class="k">尺寸</span><span class="v" id="mSize">—</span></span>
              <span><span class="k">时长</span><span class="v" id="mDur">—</span></span>
              <span><span class="k">体积</span><span class="v hl" id="mBytes">—</span></span>
            </div>
            <div class="hint-line" id="gifHint"></div>
          </div>
        </div>

        <div class="pv-list" id="listWrap">
          <div class="group-title" id="stripTitle" hidden><span>帧顺序<small>点 ✕ 可移除</small></span></div>
          <div class="strip" id="strip"></div>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <span class="dot"></span><span id="statusText">等待选择图片…</span>
  </footer>

<script>
/* gifenc v1.0.3 | MIT | https://github.com/mattdesl/gifenc
   已 vendor 进本文件，未改动其编码逻辑。 */

<script>
(function () {
  "use strict";

  /* =========================================================
     GIF 的两个硬约束（决定了下面所有设计）
     1) 每帧只有 256 色。若逐帧各自量化，静止背景会在帧间
        轻微变色，看起来像在「呼吸」。所以这里先把所有帧的
        采样合并后量化出**一份全局调色板**，每帧套用同一张表，
        首帧写出该表、后续帧不再带表（复用全局色表）。
     2) 帧延时以 10ms（centisecond）为单位存放在文件里，
        所以滑块按 10ms 步进，界面上不出现无法表达的小数。
     ========================================================= */

  var GIF_LIB = GifEnc;

  // ---- 状态 ----
  var frames = [];        // { file, name, w, h, url }
  var delay = 800;        // ms
  var loopMode = "0";     // "0" 无限 | "-1" 一次 | "n" 指定次数
  var loopN = 3;
  var maxEdge = 800;
  var colors = 256;
  var gifBlob = null;
  var busy = false;

  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("fileInput");
  var durRange = document.getElementById("durRange");
  var durVal = document.getElementById("durVal");
  var durTotal = document.getElementById("durTotal");
  var loopSeg = document.getElementById("loopSeg");
  var loopRow = document.getElementById("loopRow");
  var loopNEl = document.getElementById("loopN");
  var sizeSel = document.getElementById("sizeSel");
  var colorSeg = document.getElementById("colorSeg");
  var makeBtn = document.getElementById("makeBtn");
  var dlBtn = document.getElementById("dlBtn");
  var clearBtn = document.getElementById("clearBtn");
  var progWrap = document.getElementById("progWrap");
  var progBar = document.getElementById("progBar");
  var statusLine = document.getElementById("statusLine");
  var stage = document.getElementById("stage");
  var strip = document.getElementById("strip");
  var stripTitle = document.getElementById("stripTitle");
  var emptyEl = document.getElementById("empty");
  var gifWrap = document.getElementById("gifWrap");
  var gifHint = document.getElementById("gifHint");
  var statusText = document.getElementById("statusText");

  function setStatus(t) { statusText.textContent = t; }

  function humanSize(n) {
    if (!n) return "0 B";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  /* =========================================================
     读入：按文件名排序（连拍场景的关键）
     ========================================================= */
  function addFiles(list) {
    var arr = Array.prototype.slice.call(list).filter(function (f) {
      return /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(f.name);
    });
    if (!arr.length) { setStatus("没有可处理的图片文件"); return; }

    var start = frames.length;
    arr.forEach(function (f) {
      frames.push({ file: f, name: f.name, url: URL.createObjectURL(f), w: 0, h: 0 });
    });
    // 数字感知的自然排序：IMG_2 排在 IMG_10 前面
    frames.sort(function (a, b) {
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
    });

    setStatus("已加入 " + arr.length + " 张，共 " + frames.length + " 帧");
    invalidate();
    renderStrip();
  }

  function invalidate() {
    gifBlob = null;
    dlBtn.disabled = true;
    stage.textContent = "";
    gifWrap.hidden = true;
    emptyEl.style.display = "";
    makeBtn.disabled = frames.length < 2 || busy;
    clearBtn.disabled = frames.length === 0;
    syncSummary();
  }

  /* =========================================================
     帧列表
     ========================================================= */
  function renderStrip() {
    strip.textContent = "";
    stripTitle.hidden = frames.length === 0;

    frames.forEach(function (fr, i) {
      var chip = document.createElement("div");
      chip.className = "fchip";
      // 用指针事件而非 HTML5 draggable：后者在触屏上完全不可用
      chip.addEventListener("pointerdown", function (e) { startDrag(e, fr, chip); });

      var im = document.createElement("img");
      im.src = fr.url;
      im.alt = "";
      im.draggable = false;        // 关掉原生图片拖拽，否则会打断指针事件
      im.style.cssText = "display:block;width:100%;height:66px;object-fit:cover";
      chip.appendChild(im);

      var no = document.createElement("span");
      no.className = "no";
      no.textContent = i + 1;
      chip.appendChild(no);

      var rm = document.createElement("button");
      rm.className = "rm";
      rm.textContent = "✕";
      rm.title = "移除这一帧";
      rm.addEventListener("click", function (e) {
        e.stopPropagation();
        URL.revokeObjectURL(fr.url);
        frames.splice(i, 1);
        invalidate();
        renderStrip();
      });
      chip.appendChild(rm);

      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = fr.name;
      nm.title = fr.name;
      chip.appendChild(nm);

      strip.appendChild(chip);
    });
  }

  /* =========================================================
     拖拽排序
     ------------------------------------------------------------
     用指针事件而不是 HTML5 draggable——后者在触屏上完全不可用。
     监听器挂在 document 上：排序过程中整条列表会重渲染，卡片
     节点被替换后，节点自身的监听器就失效了。
     另：✕ 按钮上主动跳过，否则「移除」会被误判成「开始拖拽」。
     拖拽结果直接反映到 chips 的实时重排上，不额外做落点高亮——
     被拖的卡片显示为半透明虚线，占位即反馈。
     ========================================================= */
  var DRAG_THRESHOLD = 5;   // 超过该位移才算拖拽，否则当作普通点击

  function startDrag(e, fr, chip) {
    if (e.button != null && e.button !== 0) return;   // 只响应左键
    if (e.target.closest(".rm")) return;              // ✕ 上不启动拖拽
    if (frames.length < 2) return;
    // 阻止浏览器启动原生拖拽/框选，否则 pointermove 会被打断
    if (e.cancelable) e.preventDefault();

    var st = { x0: e.clientX, y0: e.clientY, active: false, last: null };

    function onMove(ev) {
      if (!st.active) {
        var dx = ev.clientX - st.x0, dy = ev.clientY - st.y0;
        if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        st.active = true;
        chip.classList.add("ghost");
        document.body.classList.add("dragging");
      }
      var target = chipUnder(ev.clientX, ev.clientY);
      // 目标没变就别再重排。卡片是边拖边让位的，每次 pointermove 都重算的话，
      // 松手前它会自己一路漂到末尾去。
      if (!target || target === st.last) return;
      st.last = target;
      if (target === "end") moveToEnd(fr);
      else moveBefore(target, fr);
    }

    function onUp() {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (!st.active) return;                    // 只是点了一下，不算拖拽
      document.body.classList.remove("dragging");
      renderStrip();
      if (gifBlob) invalidate();                 // 顺序变了，旧结果已失效
      setStatus("顺序已调整，可重新生成 GIF");
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  /* 指针要落到哪张卡之前。
     先定「行」再定「列」——行距只有 89px，如果改成找「距离最近的卡」，
     指针穿过换行缝隙时会把卡片在两行之间来回甩。
     ghost 不参与计算：重排会重建整个列表，按节点排除在重排后就失效了。
     返回具体卡片、"end"，无法判断时返回 null。 */
  function chipUnder(cx, cy) {
    var chips = [], tops = [], i, r, bestDy = Infinity, rowTop = null;
    for (i = 0; i < strip.children.length; i++) {
      if (strip.children[i].classList.contains("ghost")) continue;
      r = strip.children[i].getBoundingClientRect();
      chips.push({ el: strip.children[i], r: r });
      if (tops.indexOf(r.top) < 0) tops.push(r.top);
    }
    if (!chips.length) return null;
    tops.sort(function (a, b) { return a - b; });

    // 1) 落在哪一行（按行中心线找最近的一行）
    for (i = 0; i < tops.length; i++) {
      var dy = Math.abs(cy - (tops[i] + chips[0].r.height / 2));
      if (dy < bestDy) { bestDy = dy; rowTop = tops[i]; }
    }

    // 2) 这一行里，落在第几张之前（落在卡片右半边即算越过它）
    var row = chips.filter(function (c) { return c.r.top === rowTop; });
    if (!row.length) return null;            // 该行只剩被拖的那张，先不动
    var k = 0;
    while (k < row.length && row[k].r.left + row[k].r.width / 2 < cx) k++;
    if (k < row.length) return row[k].el;

    // 3) 已越过本行末尾 → 排到本行最后一张之后。
    //    排到最前不需要单独分支：落在第一张的左半边时 k 就是 0。
    var li = chips.indexOf(row[row.length - 1]);
    return li + 1 < chips.length ? chips[li + 1].el : "end";
  }

  // 把 fr 插到 target 前面
  function moveBefore(target, fr) {
    var chips = [].slice.call(strip.children);
    var tIdx = chips.indexOf(target);
    var from = frames.indexOf(fr);
    if (tIdx < 0 || from < 0) return;

    // 摘掉被拖项后，目标卡在剩余序列里的下标：它在被拖项之前就要前移一格
    var insertAt = from < tIdx ? tIdx - 1 : tIdx;
    if (insertAt === from) return;           // 位置没变，直接返回
    // 注意：下面两步必须成对出现，中途 return 会把 fr 丢掉
    frames.splice(from, 1);
    frames.splice(insertAt, 0, fr);

    renderStrip();
    // 重渲染后 ghost 换成了另一个节点，把样式补回去
    var moved = strip.children[insertAt];
    if (moved) moved.classList.add("ghost");
  }

  function moveToEnd(fr) {
    var from = frames.indexOf(fr);
    if (from < 0 || from === frames.length - 1) return;
    frames.push(frames.splice(from, 1)[0]);
    renderStrip();
    var moved = strip.children[frames.length - 1];
    if (moved) moved.classList.add("ghost");
  }

  /* =========================================================
     解码一帧 → 统一尺寸的 RGBA 像素
     ========================================================= */
  function decode(blob) {
    return new Promise(function (resolve, reject) {
      if (typeof createImageBitmap === "function") {
        createImageBitmap(blob, { imageOrientation: "from-image" })
          .then(resolve).catch(function () { fallback(); });
      } else fallback();
      function fallback() {
        var url = URL.createObjectURL(blob);
        var im = new Image();
        im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
        im.onerror = function () { URL.revokeObjectURL(url); reject(new Error("解码失败")); };
        im.src = url;
      }
    });
  }

  var work = document.createElement("canvas");
  var wctx = work.getContext("2d", { willReadFrequently: true });

  // 目标尺寸由第一帧决定，其余帧按 cover 填满，保证各帧严格对齐
  function targetSize(w, h) {
    if (!maxEdge) return { w: Math.max(1, w), h: Math.max(1, h) };
    var k = Math.min(1, maxEdge / Math.max(w, h));
    return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)) };
  }

  function raster(bitmap, tw, th) {
    work.width = tw; work.height = th;
    wctx.imageSmoothingEnabled = true;
    wctx.imageSmoothingQuality = "high";
    wctx.fillStyle = "#ffffff";           // 透明区铺白，避免 GIF 无半透明导致的黑边
    wctx.fillRect(0, 0, tw, th);
    var sw = bitmap.width, sh = bitmap.height;
    var k = Math.max(tw / sw, th / sh);   // cover：铺满且不变形
    var dw = sw * k, dh = sh * k;
    wctx.drawImage(bitmap, (tw - dw) / 2, (th - dh) / 2, dw, dh);
    return wctx.getImageData(0, 0, tw, th).data;
  }

  /* =========================================================
     生成 GIF
     ========================================================= */
  function makeGIF() {
    if (frames.length < 2 || busy) return;
    busy = true;
    makeBtn.disabled = true;
    gifBlob = null;
    dlBtn.disabled = true;
    progWrap.style.display = "";
    progBar.style.width = "0%";
    statusLine.className = "hint-line";
    setStatus("正在生成 GIF…");

    var first = frames[0];

    (async function () {
      var bmp0 = await decode(first.file);
      var t0 = targetSize(bmp0.width, bmp0.height);
      if (bmp0.close) bmp0.close();

      // ---- 第一遍：从若干帧采样，合并后量化出一份全局调色板 ----
      // 采样帧之间均匀抽取并缩到较小尺寸，既能覆盖整体色彩分布，
      // 又不必把全部帧像素留在内存里。
      var SAMPLE_N = Math.min(10, frames.length);
      var sw = Math.min(96, t0.w), sh = Math.max(1, Math.round(t0.h * sw / t0.w));
      var sampleCanvas = document.createElement("canvas");
      sampleCanvas.width = sw; sampleCanvas.height = sh * SAMPLE_N;
      var sctx = sampleCanvas.getContext("2d", { willReadFrequently: true });

      for (var s = 0; s < SAMPLE_N; s++) {
        var idx = Math.round(s * (frames.length - 1) / Math.max(1, SAMPLE_N - 1));
        var bm = await decode(frames[idx].file);
        sctx.drawImage(bm, 0, s * sh, sw, sh);
        if (bm.close) bm.close();
        statusLine.textContent = "分析配色… " + (s + 1) + " / " + SAMPLE_N;
        progBar.style.width = (5 + s * 8) + "%";
        await new Promise(function (r) { setTimeout(r, 0); });
      }
      var sampleData = sctx.getImageData(0, 0, sw, sh * SAMPLE_N).data;
      var palette = GIF_LIB.quantize(sampleData, colors, { format: "rgb565" });

      // ---- 第二遍：逐帧套用同一张调色板并写入 ----
      var repeat = loopMode === "0" ? 0 : loopMode === "-1" ? -1 : Math.max(1, loopN | 0);
      var colorDepth = Math.max(1, Math.ceil(Math.log2(palette.length)));
      var gif = GIF_LIB.GIFEncoder({ initialCapacity: Math.max(4096, t0.w * t0.h * frames.length / 4) });

      for (var i = 0; i < frames.length; i++) {
        var bm2 = await decode(frames[i].file);
        var rgba = raster(bm2, t0.w, t0.h);
        if (bm2.close) bm2.close();

        var indexed = GIF_LIB.applyPalette(rgba, palette, "rgb565");
        // palette 只在首帧给出 → 写入全局色表；
        // 之后不传即复用该表，这是消除闪色的关键。
        gif.writeFrame(indexed, t0.w, t0.h, {
          palette: i === 0 ? palette : null,
          delay: delay,
          repeat: repeat,
          colorDepth: colorDepth
        });

        statusLine.textContent = "编码中… " + (i + 1) + " / " + frames.length;
        progBar.style.width = (15 + (i + 1) * (80 / frames.length)) + "%";
        await new Promise(function (r) { setTimeout(r, 0); });
      }

      gif.finish();
      gifBlob = new Blob([gif.bytes()], { type: "image/gif" });
      progBar.style.width = "100%";

      showResult(t0);
      setTimeout(function () { progWrap.style.display = "none"; }, 500);
    })().catch(function (e) {
      statusLine.className = "hint-line warn";
      statusLine.textContent = "生成失败：" + (e && e.message ? e.message : e);
      setStatus("生成失败");
      progWrap.style.display = "none";
    }).then(function () {
      busy = false;
      makeBtn.disabled = frames.length < 2;
    });
  }

  function showResult(t) {
    var url = URL.createObjectURL(gifBlob);
    stage.textContent = "";
    var im = document.createElement("img");
    im.src = url;
    im.alt = "";
    stage.appendChild(im);

    gifWrap.hidden = false;
    emptyEl.style.display = "none";
    dlBtn.disabled = false;

    document.getElementById("mFrames").textContent = frames.length;
    document.getElementById("mSize").textContent = t.w + "×" + t.h;
    document.getElementById("mDur").textContent = (frames.length * delay / 1000).toFixed(1) + "s";
    document.getElementById("mBytes").textContent = humanSize(gifBlob.size);

    // 体积是 GIF 最容易踩坑的地方，如实提示
    var hint = "", cls = "hint-line ok";
    if (gifBlob.size > 8 * 1024 * 1024) {
      cls = "hint-line warn";
      hint = "体积偏大，QQ/微信等平台通常限制 <b>10MB</b>。建议减少帧数、缩短最长边或降低颜色数。";
    } else if (gifBlob.size > 2 * 1024 * 1024) {
      cls = "hint-line";
      hint = "体积约 <b>" + humanSize(gifBlob.size) + "</b>，部分平台对动图有大小限制，可适当降低颜色数或缩短最长边。";
    } else {
      hint = "已生成 <b>" + humanSize(gifBlob.size) + "</b>。GIF 仅支持 256 色且无半透明，深色渐变可能出现色带。";
    }
    gifHint.className = cls;
    gifHint.innerHTML = hint;

    setStatus("已生成 " + frames.length + " 帧动图，" + humanSize(gifBlob.size));
  }

  function syncSummary() {
    var total = frames.length * delay / 1000;
    durTotal.textContent = frames.length ? ("共 " + total.toFixed(1) + "s") : "";
  }

  /* =========================================================
     交互
     ========================================================= */
  // 这里只负责赋值与显示；档位高亮由调用方决定，
  // 否则它会在滑块刚点亮某档之后又把高亮清掉。
  function setDelay(ms) {
    delay = ms;
    durRange.value = Math.min(3000, Math.max(10, ms));
    durVal.textContent = ms + " ms";
    syncSummary();
  }

  function markPreset(v) {
    [].forEach.call(document.getElementById("durPresets").children, function (b) {
      var d = parseInt(b.dataset.dur, 10);
      b.classList.toggle("on", !isNaN(d) && d === v);
    });
  }

  [].forEach.call(document.getElementById("durPresets").children, function (b) {
    b.addEventListener("click", function () {
      var raw = b.dataset.dur;
      [].forEach.call(b.parentNode.children, function (o) { o.classList.toggle("on", o === b); });
      if (raw === "custom") { durRange.focus(); return; }   // 交给滑块
      var v = parseInt(raw, 10);
      setDelay(v);
      markPreset(v);
    });
  });

  durRange.addEventListener("input", function () {
    var v = parseInt(durRange.value, 10);
    setDelay(v);
    // 滑到与某档相同的值时把那档点亮，否则全部熄灭
    markPreset(v);
  });

  [].forEach.call(loopSeg.children, function (b) {
    b.addEventListener("click", function () {
      loopMode = b.dataset.loop;
      [].forEach.call(loopSeg.children, function (o) { o.classList.toggle("on", o === b); });
      loopRow.style.display = loopMode === "n" ? "grid" : "none";
    });
  });
  loopNEl.addEventListener("input", function () { loopN = parseInt(loopNEl.value, 10) || 1; });

  sizeSel.addEventListener("change", function () {
    maxEdge = parseInt(sizeSel.value, 10) || 0;
  });

  [].forEach.call(colorSeg.children, function (b) {
    b.addEventListener("click", function () {
      colors = parseInt(b.dataset.color, 10);
      [].forEach.call(colorSeg.children, function (o) { o.classList.toggle("on", o === b); });
    });
  });

  makeBtn.addEventListener("click", makeGIF);

  dlBtn.addEventListener("click", function () {
    if (!gifBlob) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(gifBlob);
    a.download = "animation.gif";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });

  clearBtn.addEventListener("click", function () {
    frames.forEach(function (f) { URL.revokeObjectURL(f.url); });
    frames = [];
    invalidate();
    renderStrip();
    setStatus("等待选择图片…");
  });

  drop.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      drop.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      drop.classList.remove("dragover");
    });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // 兜底：帧条内不允许任何原生拖拽
  strip.addEventListener("dragstart", function (e) { e.preventDefault(); });

  document.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var picked = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image/") === 0) {
        var f = items[i].getAsFile();
        if (f) picked.push(f);
      }
    }
    if (picked.length) { addFiles(picked); e.preventDefault(); }
  });

  /* =========================================================
     初始化
     ========================================================= */
  setStatus("等待选择图片…（至少 2 张）");
  setDelay(800);
  markPreset(800);
  makeBtn.disabled = true;
})();
</script>
</body>
</html>
