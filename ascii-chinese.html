<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中文汉字转 ASCII 字符画</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --line: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --preview-bg: #191a1c;
      --preview-fg: #bdbec3;
      --radius: 14px;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body { padding: 24px 18px 32px; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .controls, .output-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .text-field { grid-column: 1 / -1; }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    textarea, select, input[type="range"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #10151c;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      outline: none;
      height: 41px;
    }

    textarea:focus, select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.15);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
      font-family: var(--sans);
      line-height: 1.4;
    }

    input[type="range"] {
      padding: 0;
      height: 30px;
    }

    .range-value {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 41px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .checkbox-group label {
      margin: 0;
      font-size: 0.85rem;
    }

    .output-card { padding: 12px; }

    .output-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .output-head label { margin: 0; }

    .output-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .output-tools button { flex: 0 0 auto; }

    .status {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status.error { color: var(--danger); }
    .status.loading { color: var(--accent); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: #062315;
      height: 41px;
    }

    button:hover { background: var(--accent-2); }

    button.ghost {
      background: #273140;
      color: var(--text);
    }

    button.ghost:hover { background: #324155; }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    pre {
      margin: 0;
      background: var(--preview-bg);
      color: var(--preview-fg);
      border-radius: 10px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.0;
      white-space: pre;
      overflow-x: auto;
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      background: var(--preview-bg);
      z-index: 20;
      display: none;
      padding: 24px;
    }

    .fullscreen.open { display: block; }

    .fullscreen pre {
      min-height: calc(100vh - 90px);
    }

    .fullscreen .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .status { display: none; }
      .output-head { flex-direction: column; align-items: flex-start; gap: 8px; }
      .output-tools { width: 100%; justify-content: space-between; }
      .output-tools button { flex: 1; }
      button span { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>中文汉字转 ASCII 字符画</h1>
    <p class="sub">输入中文文字，选择字体与参数，实时生成 ASCII 字符画。原理：将文字渲染到画布上，再逐像素映射为 ASCII 字符。</p>

    <section class="controls">
      <div class="text-field">
        <label for="textInput">输入文字 / Text Input</label>
        <textarea id="textInput" spellcheck="false">你好世界</textarea>
      </div>
      <div>
        <label for="fontSelect">字体 / Font</label>
        <select id="fontSelect">
          <optgroup label="系统字体 / System">
            <option value="SimHei" selected>黑体 (SimHei)</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="PingFang SC">苹方 (PingFang SC)</option>
            <option value="SimSun">宋体 (SimSun)</option>
            <option value="KaiTi">楷体 (KaiTi)</option>
          </optgroup>
          <optgroup label="Web 字体 / Web">
            <option value="Noto Sans SC">Noto Sans SC</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label for="fontWeight">字重 / Weight</label>
        <select id="fontWeight">
          <option value="900" selected>Black (900)</option>
          <option value="700">Bold (700)</option>
          <option value="400">Regular (400)</option>
        </select>
      </div>
      <div>
        <label for="charSet">字符集 / Character Set</label>
        <select id="charSet">
          <option value="standard">Standard (@%#*+=-:. )</option>
          <option value="detailed">Detailed ($@B%8&WM#*…)</option>
          <option value="simple">Simple (#. )</option>
          <option value="blocks">Blocks (█▓▒░ )</option>
          <option value="binary">Binary (10 )</option>
        </select>
      </div>
      <div>
        <label for="outputWidth">输出宽度 / Output Width</label>
        <input type="range" id="outputWidth" value="150" min="20" max="300" />
        <div class="range-value" id="outputWidthValue">150 chars</div>
      </div>
      <div>
        <label for="contrast">对比度 / Contrast</label>
        <input type="range" id="contrast" value="0" min="0" max="200" />
        <div class="range-value" id="contrastValue">0</div>
      </div>
      <div>
        <label for="brightness">亮度 / Brightness</label>
        <input type="range" id="brightness" value="0" min="-100" max="100" />
        <div class="range-value" id="brightnessValue">0</div>
      </div>
      <div>
        <label for="colorTheme">颜色主题 / Color Theme</label>
        <select id="colorTheme">
          <option value="white">White on Black</option>
          <option value="black">Black on White</option>
          <option value="green">Green on Black</option>
          <option value="blue">Blue on Black</option>
          <option value="cyan">Cyan on Black</option>
          <option value="magenta">Magenta on Black</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="checkbox-group">
          <input type="checkbox" id="invert" />
          <label for="invert">反转 / Invert</label>
        </div>
      </div>
    </section>

    <section class="output-card">
      <div class="output-head">
        <label>ASCII Art / 输出</label>
        <div class="output-tools">
          <span class="status" id="status">输入文字后自动生成</span>
          <button type="button" class="ghost" id="resetBtn">Reset / 重置</button>
          <button type="button" class="ghost" id="downloadTxtBtn" disabled>Download TXT</button>
          <button type="button" class="ghost" id="downloadPngBtn" disabled>Download PNG</button>
          <button type="button" class="ghost" id="fullscreenBtn">Fullscreen / 全屏</button>
          <button type="button" id="copyBtn" disabled><span>Copy / </span>复制</button>
        </div>
      </div>
      <pre id="output" aria-live="polite"></pre>
    </section>
  </div>

  <div class="fullscreen" id="fullscreen">
    <div class="bar">
      <strong>ASCII Art</strong>
      <button type="button" class="ghost" id="closeFullscreen">Close / 关闭</button>
    </div>
    <pre id="fullscreenOutput"></pre>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const els = {
      textInput: document.getElementById("textInput"),
      fontSelect: document.getElementById("fontSelect"),
      fontWeight: document.getElementById("fontWeight"),
      charSet: document.getElementById("charSet"),
      outputWidth: document.getElementById("outputWidth"),
      outputWidthValue: document.getElementById("outputWidthValue"),
      contrast: document.getElementById("contrast"),
      contrastValue: document.getElementById("contrastValue"),
      brightness: document.getElementById("brightness"),
      brightnessValue: document.getElementById("brightnessValue"),
      colorTheme: document.getElementById("colorTheme"),
      invert: document.getElementById("invert"),
      output: document.getElementById("output"),
      fullscreenOutput: document.getElementById("fullscreenOutput"),
      status: document.getElementById("status"),
      copy: document.getElementById("copyBtn"),
      downloadPngBtn: document.getElementById("downloadPngBtn"),
      downloadTxtBtn: document.getElementById("downloadTxtBtn"),
      resetBtn: document.getElementById("resetBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      fullscreen: document.getElementById("fullscreen"),
      closeFullscreen: document.getElementById("closeFullscreen"),
      canvas: document.getElementById("canvas")
    };

    const ctx = els.canvas.getContext("2d");
    let lastOutput = "";
    let renderTimer = 0;
    let isRendering = false;
    let isComposing = false;

    const CHAR_SETS = {
      standard: "@%#*+=-:. ",
      detailed: "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ",
      simple: "#. ",
      blocks: "█▓▒░ ",
      binary: "10 "
    };

    const COLOR_THEMES = {
      white: { fg: "#ffffff", bg: "#000000" },
      black: { fg: "#000000", bg: "#ffffff" },
      green: { fg: "#00ff00", bg: "#000000" },
      blue: { fg: "#0000ff", bg: "#000000" },
      cyan: { fg: "#00ffff", bg: "#000000" },
      magenta: { fg: "#ff00ff", bg: "#000000" }
    };

    const FONT_STACKS = {
      "SimHei": '"SimHei", "STHeiti", "Heiti SC", "WenQuanYi Micro Hei", sans-serif',
      "Microsoft YaHei": '"Microsoft YaHei", "Microsoft YaHei UI", sans-serif',
      "PingFang SC": '"PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif',
      "SimSun": '"SimSun", "STSong", "Songti SC", serif',
      "KaiTi": '"KaiTi", "STKaiti", "Kaiti SC", serif',
      "Noto Sans SC": '"Noto Sans SC", "Noto Sans CJK SC", sans-serif'
    };

    function setStatus(message, isError, isLoading) {
      els.status.textContent = message;
      els.status.classList.toggle("error", !!isError);
      els.status.classList.toggle("loading", !!isLoading);
    }

    function getLuminance(r, g, b) {
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function applyContrast(luminance, contrast) {
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      return factor * (luminance - 128) + 128;
    }

    function applyBrightness(luminance, brightness) {
      return luminance + brightness;
    }

    function measureLines(fontStr, lines) {
      ctx.font = fontStr;
      let maxWidth = 0;
      for (const line of lines) {
        if (line.length > 0) {
          maxWidth = Math.max(maxWidth, ctx.measureText(line).width);
        }
      }
      return maxWidth;
    }

    async function render() {
      const text = els.textInput.value;
      if (!text.trim() || isRendering) return;

      isRendering = true;
      setStatus("渲染中…", false, true);

      setTimeout(async () => {
        try {
          const fontName = els.fontSelect.value;
          const fontStack = FONT_STACKS[fontName] || fontName;
          const weight = els.fontWeight.value;
          const outputWidth = parseInt(els.outputWidth.value) || 150;
          const lines = text.split("\n");

          // Wait for web fonts if needed
          if (fontName === "Noto Sans SC") {
            try {
              await document.fonts.load(weight + " 200px \"Noto Sans SC\"");
            } catch { /* proceed with fallback */ }
          }

          // Adaptive font size: ensure at least 4 source pixels per output char
          const targetSourcePx = 4;
          const minSourceWidth = outputWidth * targetSourcePx;
          let fontSize = 200;
          let fontStr = weight + " " + fontSize + "px " + fontStack;
          let maxWidth = measureLines(fontStr, lines);

          if (maxWidth > 0 && maxWidth < minSourceWidth) {
            fontSize = Math.min(600, Math.ceil(fontSize * minSourceWidth / maxWidth));
            fontStr = weight + " " + fontSize + "px " + fontStack;
            maxWidth = measureLines(fontStr, lines);
          }

          if (maxWidth === 0) {
            els.output.textContent = "";
            els.fullscreenOutput.textContent = "";
            lastOutput = "";
            setStatus("空文本");
            return;
          }

          // Cap canvas size for performance
          const maxCanvasWidth = 6000;
          if (maxWidth > maxCanvasWidth) {
            fontSize = Math.max(80, Math.floor(fontSize * maxCanvasWidth / maxWidth));
            fontStr = weight + " " + fontSize + "px " + fontStack;
            maxWidth = measureLines(fontStr, lines);
          }

          const lineHeight = fontSize * 1.35;
          const padding = Math.ceil(fontSize * 0.3);

          els.canvas.width = Math.ceil(maxWidth) + padding * 2;
          els.canvas.height = Math.ceil(lines.length * lineHeight) + padding * 2;

          // Canvas resize resets context state
          ctx.font = fontStr;
          ctx.fillStyle = "#ffffff";
          ctx.textBaseline = "top";

          for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], padding, padding + i * lineHeight);
          }

          // Downsample to target ASCII resolution
          const aspectRatio = els.canvas.height / els.canvas.width;
          const outputHeight = Math.max(1, Math.floor(outputWidth * aspectRatio * 0.6));

          const tmpCanvas = document.createElement("canvas");
          tmpCanvas.width = outputWidth;
          tmpCanvas.height = outputHeight;
          const tmpCtx = tmpCanvas.getContext("2d");
          tmpCtx.drawImage(els.canvas, 0, 0, outputWidth, outputHeight);

          const imageData = tmpCtx.getImageData(0, 0, outputWidth, outputHeight);
          const pixels = imageData.data;

          const charSet = CHAR_SETS[els.charSet.value] || CHAR_SETS.standard;
          const contrast = parseInt(els.contrast.value);
          const brightnessVal = parseInt(els.brightness.value);
          const invert = els.invert.checked;

          let result = "";
          for (let y = 0; y < outputHeight; y++) {
            for (let x = 0; x < outputWidth; x++) {
              const idx = (y * outputWidth + x) * 4;
              const r = pixels[idx];
              const g = pixels[idx + 1];
              const b = pixels[idx + 2];

              let luminance = getLuminance(r, g, b);
              luminance = applyContrast(luminance, contrast);
              luminance = applyBrightness(luminance, brightnessVal);
              luminance = Math.max(0, Math.min(255, luminance));

              if (invert) luminance = 255 - luminance;

              const charIndex = Math.floor((luminance / 255) * (charSet.length - 1));
              result += charSet[charIndex];
            }
            result += "\n";
          }

          lastOutput = result;
          els.output.textContent = result;
          els.fullscreenOutput.textContent = result;

          const theme = COLOR_THEMES[els.colorTheme.value];
          els.output.style.color = theme.fg;
          els.output.style.backgroundColor = theme.bg;
          els.fullscreenOutput.style.color = theme.fg;
          els.fullscreenOutput.style.backgroundColor = theme.bg;

          els.copy.disabled = false;
          els.downloadPngBtn.disabled = false;
          els.downloadTxtBtn.disabled = false;

          setStatus(outputWidth + " \u00d7 " + outputHeight + " characters");
        } catch (error) {
          setStatus(error.message || "渲染失败", true);
        } finally {
          isRendering = false;
        }
      }, 50);
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 300);
    }

    async function copyOutput() {
      if (!lastOutput) return;
      try {
        await navigator.clipboard.writeText(lastOutput);
        setStatus("Copied / 已复制");
      } catch {
        setStatus("Copy failed / 复制失败", true);
      }
    }

    function downloadPng() {
      if (!lastOutput) return;

      const theme = COLOR_THEMES[els.colorTheme.value];
      const fontSize = 12;
      const lineHeight = fontSize;
      const monoFont = "SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace";
      const lines = lastOutput.split("\n");
      const charWidth = fontSize * 0.6;
      const maxLineLen = lines.reduce((mx, l) => Math.max(mx, l.length), 0);
      const canvasWidth = Math.ceil(maxLineLen * charWidth) + 40;
      const canvasHeight = Math.ceil(lines.length * lineHeight) + 40;

      const canvas = document.createElement("canvas");
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const c = canvas.getContext("2d");

      c.fillStyle = theme.bg;
      c.fillRect(0, 0, canvasWidth, canvasHeight);

      c.fillStyle = theme.fg;
      c.font = fontSize + "px " + monoFont;
      c.textBaseline = "top";

      lines.forEach((line, index) => {
        c.fillText(line, 20, 20 + index * lineHeight);
      });

      const link = document.createElement("a");
      link.download = "ascii-art.png";
      link.href = canvas.toDataURL("image/png");
      link.click();

      setStatus("Downloaded PNG / 已下载 PNG");
    }

    function downloadTxt() {
      if (!lastOutput) return;

      const blob = new Blob([lastOutput], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = "ascii-art.txt";
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);

      setStatus("Downloaded TXT / 已下载 TXT");
    }

    function resetAll() {
      els.textInput.value = "你好世界";
      els.fontSelect.value = "SimHei";
      els.fontWeight.value = "900";
      els.charSet.value = "standard";
      els.outputWidth.value = "150";
      els.contrast.value = "0";
      els.brightness.value = "0";
      els.colorTheme.value = "white";
      els.invert.checked = false;

      updateRangeValue(els.outputWidth, els.outputWidthValue, " chars");
      updateRangeValue(els.contrast, els.contrastValue);
      updateRangeValue(els.brightness, els.brightnessValue);

      const theme = COLOR_THEMES["white"];
      els.output.style.color = theme.fg;
      els.output.style.backgroundColor = theme.bg;
      els.fullscreenOutput.style.color = theme.fg;
      els.fullscreenOutput.style.backgroundColor = theme.bg;

      scheduleRender();
    }

    function updateRangeValue(slider, display, suffix) {
      display.textContent = slider.value + (suffix || "");
    }

    // IME composition handling for Chinese input
    els.textInput.addEventListener("compositionstart", () => { isComposing = true; });
    els.textInput.addEventListener("compositionend", () => {
      isComposing = false;
      scheduleRender();
    });
    els.textInput.addEventListener("input", (e) => {
      if (!isComposing && !e.isComposing) scheduleRender();
    });

    els.fontSelect.addEventListener("change", scheduleRender);
    els.fontWeight.addEventListener("change", scheduleRender);
    els.charSet.addEventListener("change", scheduleRender);

    els.outputWidth.addEventListener("input", () => {
      updateRangeValue(els.outputWidth, els.outputWidthValue, " chars");
      scheduleRender();
    });
    els.contrast.addEventListener("input", () => {
      updateRangeValue(els.contrast, els.contrastValue);
      scheduleRender();
    });
    els.brightness.addEventListener("input", () => {
      updateRangeValue(els.brightness, els.brightnessValue);
      scheduleRender();
    });
    els.colorTheme.addEventListener("change", () => {
      const theme = COLOR_THEMES[els.colorTheme.value];
      els.output.style.color = theme.fg;
      els.output.style.backgroundColor = theme.bg;
      els.fullscreenOutput.style.color = theme.fg;
      els.fullscreenOutput.style.backgroundColor = theme.bg;
    });
    els.invert.addEventListener("change", scheduleRender);

    els.copy.addEventListener("click", copyOutput);
    els.downloadPngBtn.addEventListener("click", downloadPng);
    els.downloadTxtBtn.addEventListener("click", downloadTxt);
    els.resetBtn.addEventListener("click", resetAll);
    els.fullscreenBtn.addEventListener("click", () => els.fullscreen.classList.add("open"));
    els.closeFullscreen.addEventListener("click", () => els.fullscreen.classList.remove("open"));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") els.fullscreen.classList.remove("open");
    });

    updateRangeValue(els.outputWidth, els.outputWidthValue, " chars");
    updateRangeValue(els.contrast, els.contrastValue);
    updateRangeValue(els.brightness, els.brightnessValue);

    render();
  </script>
</body>
</html>
