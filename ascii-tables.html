<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII Table Generator</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --line: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --danger: #ff6b6b;
      --preview-bg: #191a1c;
      --preview-fg: #bdbec3;
      --radius: 14px;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body { padding: 24px 18px 32px; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .controls, .output-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .input-field { grid-column: 1 / -1; }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #10151c;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      outline: none;
      height: 41px;
    }

    textarea:focus, select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.15);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: var(--mono);
      line-height: 1.4;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 41px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .checkbox-group label {
      margin: 0;
      font-size: 0.85rem;
    }

    .output-card { padding: 12px; }

    .output-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .output-head label { margin: 0; }

    .output-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .output-tools button { flex: 0 0 auto; }

    .status {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status.error { color: var(--danger); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: #062315;
      height: 41px;
    }

    button:hover { background: var(--accent-2); }

    button.ghost {
      background: #273140;
      color: var(--text);
    }

    button.ghost:hover { background: #324155; }

    pre {
      margin: 0;
      background: var(--preview-bg);
      color: var(--preview-fg);
      border-radius: 10px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.15;
      white-space: pre;
      overflow-x: auto;
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      background: var(--preview-bg);
      z-index: 20;
      display: none;
      padding: 24px;
    }

    .fullscreen.open { display: block; }

    .fullscreen pre {
      min-height: calc(100vh - 90px);
    }

    .fullscreen .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .status { display: none; }
      .output-head { flex-direction: column; align-items: flex-start; gap: 8px; }
      .output-tools { width: 100%; justify-content: space-between; }
      .output-tools button { flex: 1; }
      button span { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ASCII Table Generator</h1>
    <p class="sub">快速格式化 ASCII 表格。适用于源代码注释和 GitHub Markdown！用制表符或4个空格分隔列。</p>

    <section class="controls">
      <div class="input-field">
        <label for="tableInput">Input / 输入</label>
        <textarea id="tableInput" spellcheck="false" placeholder="Col1&#9;Col2&#9;Col3&#10;Value 1&#9;Value 2&#9;123&#10;Value 3&#9;Value 4&#10;456">Col1	Col2	Col3
Value 1	Value 2	123
Value 3	Value 4	456</textarea>
      </div>
      <div>
        <label for="headerLocation">Header Location / 标题位置</label>
        <select id="headerLocation">
          <option value="none">None</option>
          <option value="first" selected>First Row</option>
          <option value="spreadsheet">Spreadsheet</option>
        </select>
      </div>
      <div>
        <label for="outputStyle">Output Style / 输出样式</label>
        <select id="outputStyle">
          <option value="ascii_mysql" selected>ASCII (MySQL style)</option>
          <option value="ascii_separated">ASCII (Separated)</option>
          <option value="ascii_compact">ASCII (Compact)</option>
          <option value="github">GitHub Markdown</option>
          <option value="reddit">Reddit Markdown</option>
          <option value="rst_grid">reStructuredText Grid</option>
          <option value="rst_simple">reStructuredText Simple</option>
          <option value="jira">Jira</option>
          <option value="ascii_rounded">ASCII (Rounded)</option>
          <option value="ascii_bubbles">ASCII (Bubbles)</option>
          <option value="ascii_girder">ASCII (Girder)</option>
          <option value="ascii_dots">ASCII (Dots)</option>
          <option value="unicode">Unicode</option>
          <option value="unicode_single">Unicode (Single Line)</option>
          <option value="mediawiki">MediaWiki</option>
          <option value="html">HTML</option>
        </select>
      </div>
      <div>
        <label for="commentStyle">Comment Style / 注释样式</label>
        <select id="commentStyle">
          <option value="">None</option>
          <option value="// ">C++/C#/Java/JS/Rust</option>
          <option value="# ">Python/Ruby/Perl</option>
          <option value="-- ">SQL/Lua</option>
          <option value="% ">MATLAB</option>
          <option value="* ">Docblock</option>
          <option value="  ">MediaWiki</option>
          <option value="    ">Reddit (4 spaces)</option>
          <option value="' ">VBA</option>
          <option value="REM ">BASIC</option>
          <option value="C ">Fortran IV</option>
          <option value="! ">Fortran 90</option>
          <option value="/*  */">CSS</option>
          <option value="<!--  -->">XML/HTML</option>
          <option value="| ">Reddit pipe</option>
        </select>
      </div>
      <div>
        <label for="maxColumnWidth">Max Column Width / 最大列宽</label>
        <input type="number" id="maxColumnWidth" value="30" min="5" max="200" />
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="checkbox-group">
          <input type="checkbox" id="autoFormat" checked />
          <label for="autoFormat">Auto-Format / 自动格式化</label>
        </div>
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="checkbox-group">
          <input type="checkbox" id="trimLines" checked />
          <label for="trimLines">Trim Lines / 去除空白</label>
        </div>
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="checkbox-group">
          <input type="checkbox" id="stripQuotes" />
          <label for="stripQuotes">Strip CSV Quotes / 去除引号</label>
        </div>
      </div>
    </section>

    <section class="output-card">
      <div class="output-head">
        <label>Output / 输出</label>
        <div class="output-tools">
          <span class="status" id="status"></span>
          <button type="button" class="ghost" id="fullscreenBtn"><span></span>Fullscreen / 全屏</button>
          <button type="button" id="copyBtn"><span>Copy / </span>复制</button>
        </div>
      </div>
      <pre id="output" aria-live="polite"></pre>
    </section>
  </div>

  <div class="fullscreen" id="fullscreen">
    <div class="bar">
      <strong>ASCII Table</strong>
      <button type="button" class="ghost" id="closeFullscreen">Close / 关闭</button>
    </div>
    <pre id="fullscreenOutput"></pre>
  </div>

  <script>
    const els = {
      input: document.getElementById("tableInput"),
      headerLocation: document.getElementById("headerLocation"),
      outputStyle: document.getElementById("outputStyle"),
      commentStyle: document.getElementById("commentStyle"),
      maxColumnWidth: document.getElementById("maxColumnWidth"),
      autoFormat: document.getElementById("autoFormat"),
      trimLines: document.getElementById("trimLines"),
      stripQuotes: document.getElementById("stripQuotes"),
      output: document.getElementById("output"),
      status: document.getElementById("status"),
      copy: document.getElementById("copyBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      fullscreen: document.getElementById("fullscreen"),
      fullscreenOutput: document.getElementById("fullscreenOutput"),
      closeFullscreen: document.getElementById("closeFullscreen")
    };

    let lastOutput = "";

    function setStatus(message, isError = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
    }

    function parseInput(text) {
      const lines = text.trim().split("\n");
      const rows = [];

      for (const line of lines) {
        if (!line.trim()) continue;

        let trimmedLine = els.trimLines.checked ? line.trim() : line;
        if (els.stripQuotes.checked) {
          trimmedLine = trimmedLine.replace(/^"|"$/g, "").replace(/""/g, '"');
        }

        const cells = trimmedLine.split(/\t| {4}/);
        if (cells.length > 0 && cells.some(c => c !== "")) {
          rows.push(cells);
        }
      }

      return rows;
    }

    function getColumnWidths(rows) {
      const numCols = Math.max(...rows.map(row => row.length));
      const widths = new Array(numCols).fill(0);

      for (const row of rows) {
        for (let i = 0; i < row.length; i++) {
          const len = row[i].length;
          if (len > widths[i]) widths[i] = len;
        }
      }

      const maxWidth = parseInt(els.maxColumnWidth.value) || 30;
      return widths.map(w => Math.min(w, maxWidth));
    }

    function padCell(cell, width) {
      if (els.autoFormat.checked) {
        return cell.padEnd(width);
      }
      return cell;
    }

    function generateAsciiMysql(rows, widths, headerRow) {
      const lines = [];

      const border = "+" + widths.map(w => "-" + "-".repeat(w) + "-").join("+") + "+";
      const separator = "|" + widths.map(w => " " + " ".repeat(w) + " ").join("|") + "|";

      lines.push(border);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("|" + padded.join("|") + "|");

        if (headerRow === i && headerRow !== -1) {
          lines.push(border);
        }
      }

      lines.push(border);
      return lines.join("\n");
    }

    function generateAsciiSeparated(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => padCell(cell, widths[idx] || 0));
        lines.push(padded.join(" | "));
      }

      return lines.join("\n");
    }

    function generateAsciiCompact(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => padCell(cell, widths[idx] || 0));
        lines.push(padded.join("  "));
      }

      return lines.join("\n");
    }

    function generateGithubMarkdown(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        lines.push("| " + row.join(" | ") + " |");

        if (headerRow === i && headerRow !== -1) {
          const sep = row.map(() => "---").join(" | ");
          lines.push("| " + sep + " |");
        }
      }

      return lines.join("\n");
    }

    function generateRedditMarkdown(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        lines.push(row.join(" | "));
      }

      return lines.join("\n");
    }

    function generateRstGrid(rows, widths, headerRow) {
      const lines = [];

      const border = "+" + widths.map(w => "-" + "-".repeat(w) + "-").join("+") + "+";
      const rowSep = "+" + widths.map(w => "=" + "=".repeat(w) + "=").join("+") + "+";

      lines.push(border);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("|" + padded.join("|") + "|");

        if (headerRow === i && headerRow !== -1) {
          lines.push(rowSep);
        } else {
          lines.push(border);
        }
      }

      return lines.join("\n");
    }

    function generateRstSimple(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        lines.push(row.join("  "));

        if (headerRow === i && headerRow !== -1) {
          lines.push(row.map(() => "=").join("  "));
        }
      }

      return lines.join("\n");
    }

    function generateJira(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        lines.push("|| " + row.join(" || ") + " ||");
      }

      return lines.join("\n");
    }

    function generateAsciiRounded(rows, widths, headerRow) {
      const lines = [];

      const border = "+" + widths.map(w => "-" + "-".repeat(w) + "-").join("+") + "+";
      const top = "╭" + widths.map(w => "─" + "─".repeat(w) + "─").join("┬") + "╮";
      const bottom = "╰" + widths.map(w => "─" + "─".repeat(w) + "─").join("┴") + "╯";
      const mid = "├" + widths.map(w => "─" + "─".repeat(w) + "─").join("┼") + "┤";

      lines.push(top);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("│" + padded.join("│") + "│");

        if (headerRow === i && headerRow !== -1) {
          lines.push(mid);
        }
      }

      lines.push(bottom);
      return lines.join("\n");
    }

    function generateAsciiBubbles(rows, widths, headerRow) {
      const lines = [];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " o " + padCell(cell, widths[idx] || 0) + " o ");
        lines.push(padded.join("o"));
      }

      return lines.join("\n");
    }

    function generateAsciiGirder(rows, widths, headerRow) {
      const lines = [];

      const border = "+" + widths.map(w => "-" + "-".repeat(w) + "-").join("+") + "+";

      lines.push(border);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("|" + padded.join("|") + "|");
        lines.push(border);
      }

      return lines.join("\n");
    }

    function generateAsciiDots(rows, widths, headerRow) {
      const lines = [];

      const border = ":" + widths.map(w => "." + ".".repeat(w) + ".").join(":") + ":";

      lines.push(border);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("|" + padded.join("|") + "|");
        lines.push(border);
      }

      return lines.join("\n");
    }

    function generateUnicode(rows, widths, headerRow) {
      const lines = [];

      const border = "┌" + widths.map(w => "─" + "─".repeat(w) + "─").join("┬") + "┐";
      const mid = "├" + widths.map(w => "─" + "─".repeat(w) + "─").join("┼") + "┤";
      const bottom = "└" + widths.map(w => "─" + "─".repeat(w) + "─").join("┴") + "┘";

      lines.push(border);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("│" + padded.join("│") + "│");

        if (headerRow === i && headerRow !== -1) {
          lines.push(mid);
        }
      }

      lines.push(bottom);
      return lines.join("\n");
    }

    function generateUnicodeSingle(rows, widths, headerRow) {
      const lines = [];

      const border = "┌" + widths.map(w => "─" + "─".repeat(w) + "─").join("┬") + "┐";
      const mid = "├" + widths.map(w => "─" + "─".repeat(w) + "─").join("┼") + "┤";
      const bottom = "└" + widths.map(w => "─" + "─".repeat(w) + "─").join("┴") + "┘";

      lines.push(border);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const padded = row.map((cell, idx) => " " + padCell(cell, widths[idx] || 0) + " ");
        lines.push("│" + padded.join("│") + "│");

        if (headerRow === i && headerRow !== -1) {
          lines.push(mid);
        }
      }

      lines.push(bottom);
      return lines.join("\n");
    }

    function generateMediaWiki(rows, widths, headerRow) {
      const lines = [];

      lines.push("{| class=\"wikitable\"");

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const isHeader = headerRow === i && headerRow !== -1;
        const tag = isHeader ? "!" : "|";

        for (const cell of row) {
          lines.push(`${tag} ${cell}`);
        }
        lines.push("|-");
      }

      lines.push("|}");
      return lines.join("\n");
    }

    function generateHtml(rows, widths, headerRow) {
      const lines = [];

      lines.push("<table>");

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const isHeader = headerRow === i && headerRow !== -1;
        const tag = isHeader ? "th" : "td";

        lines.push("  <tr>");
        for (const cell of row) {
          lines.push(`    <${tag}>${cell}</${tag}>`);
        }
        lines.push("  </tr>");
      }

      lines.push("</table>");
      return lines.join("\n");
    }

    function applyComment(text) {
      const comment = els.commentStyle.value;
      if (!comment) return text;

      const lines = text.split("\n");
      const prefix = comment.includes("  ") ? comment : comment.trim();

      if (comment.includes("/*") || comment.includes("<!--")) {
        const [start, end] = comment.split("  ");
        return start + "\n" + lines.map(l => " " + l).join("\n") + "\n" + end;
      }

      return lines.map(l => prefix + l).join("\n");
    }

    function render() {
      const rows = parseInput(els.input.value);
      if (rows.length === 0) {
        els.output.textContent = "";
        els.fullscreenOutput.textContent = "";
        lastOutput = "";
        setStatus("No data / 无数据");
        return;
      }

      const widths = getColumnWidths(rows);
      let headerRow = -1;

      if (els.headerLocation.value === "first") {
        headerRow = 0;
      } else if (els.headerLocation.value === "spreadsheet") {
        headerRow = 0;
      }

      const style = els.outputStyle.value;
      let output = "";

      switch (style) {
        case "ascii_mysql":
          output = generateAsciiMysql(rows, widths, headerRow);
          break;
        case "ascii_separated":
          output = generateAsciiSeparated(rows, widths, headerRow);
          break;
        case "ascii_compact":
          output = generateAsciiCompact(rows, widths, headerRow);
          break;
        case "github":
          output = generateGithubMarkdown(rows, widths, headerRow);
          break;
        case "reddit":
          output = generateRedditMarkdown(rows, widths, headerRow);
          break;
        case "rst_grid":
          output = generateRstGrid(rows, widths, headerRow);
          break;
        case "rst_simple":
          output = generateRstSimple(rows, widths, headerRow);
          break;
        case "jira":
          output = generateJira(rows, widths, headerRow);
          break;
        case "ascii_rounded":
          output = generateAsciiRounded(rows, widths, headerRow);
          break;
        case "ascii_bubbles":
          output = generateAsciiBubbles(rows, widths, headerRow);
          break;
        case "ascii_girder":
          output = generateAsciiGirder(rows, widths, headerRow);
          break;
        case "ascii_dots":
          output = generateAsciiDots(rows, widths, headerRow);
          break;
        case "unicode":
          output = generateUnicode(rows, widths, headerRow);
          break;
        case "unicode_single":
          output = generateUnicodeSingle(rows, widths, headerRow);
          break;
        case "mediawiki":
          output = generateMediaWiki(rows, widths, headerRow);
          break;
        case "html":
          output = generateHtml(rows, widths, headerRow);
          break;
        default:
          output = generateAsciiMysql(rows, widths, headerRow);
      }

      output = applyComment(output);
      lastOutput = output;
      els.output.textContent = output;
      els.fullscreenOutput.textContent = output;
      setStatus(`${rows.length} rows, ${widths.length} cols`);
    }

    async function copyOutput() {
      if (!lastOutput) return;
      try {
        await navigator.clipboard.writeText(lastOutput);
        setStatus("Copied / 已复制");
      } catch {
        setStatus("Copy failed / 复制失败", true);
      }
    }

    els.input.addEventListener("input", render);
    els.headerLocation.addEventListener("change", render);
    els.outputStyle.addEventListener("change", render);
    els.commentStyle.addEventListener("change", render);
    els.maxColumnWidth.addEventListener("input", render);
    els.autoFormat.addEventListener("change", render);
    els.trimLines.addEventListener("change", render);
    els.stripQuotes.addEventListener("change", render);
    els.copy.addEventListener("click", copyOutput);
    els.fullscreenBtn.addEventListener("click", () => els.fullscreen.classList.add("open"));
    els.closeFullscreen.addEventListener("click", () => els.fullscreen.classList.remove("open"));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") els.fullscreen.classList.remove("open");
    });

    render();
  </script>
</body>
</html>
