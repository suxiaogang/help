<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JSON 字符串转换器</title>
  <meta name="description" content="纯文字与 JSON 字符串双向转换工具" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c24'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='ui-monospace,Menlo,monospace' fill='%233dd68c' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1e2632;
      --border: #2a3340;
      --border-soft: #2a334080;
      --text: #e8edf4;
      --muted: #8b97a8;
      --accent: #3dd68c;
      --accent-2: #2bb673;
      --success: #3dd68c;
      --success-soft: rgba(61, 214, 140, .14);
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 16px; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .page { padding-top: 20px; padding-bottom: 0; }

    .panel-lead {
      margin: -4px 0 18px;
      font-size: 12.5px; line-height: 1.65; color: var(--muted);
    }

    .group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
      background: var(--panel);
    }

    .group-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 8px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .group-head h3 { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: -.2px; }

    .group-body { padding: 12px; }

    .converter {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: start;
    }

    .editor {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .editor label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .editor textarea {
      width: 100%;
      min-height: 350px;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
    }

    .editor textarea:focus {
      border-color: var(--accent);
      outline: none;
    }

    .editor textarea::placeholder {
      color: var(--border);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #062315;
    }

    .btn.primary:hover {
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    .btn.secondary {
      background: transparent;
    }

    .meta {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .meta .count {
      font-family: var(--mono);
    }

    .error {
      color: #ff6b6b;
      font-size: 11px;
      margin-top: 4px;
    }

    .success {
      color: var(--success);
      font-size: 11px;
      margin-top: 4px;
    }

    footer {
      flex: 0 0 auto;
      margin-top: 22px;
      border-top: 1px solid var(--border);
    }
    .wrap.foot-in {
      display: flex; align-items: center; gap: 8px;
      padding-top: 9px; padding-bottom: 22px;
      font-size: 12px; color: var(--muted);
    }
    footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

    @media (max-width: 720px) {
      .wrap { padding-left: 14px; padding-right: 14px; }
      .page { padding-top: 16px; }
      .converter {
        grid-template-columns: 1fr;
      }
      .actions {
        flex-direction: row;
        padding-top: 0;
      }
      .btn {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<main class="wrap page">
  <h1>JSON 字符串转换器</h1>
  <p class="panel-lead">将纯文字转换为 JSON 字符串，或将 JSON 字符串还原为纯文字。适用于配置文件、代码中的字符串字段等场景。</p>

  <section class="group">
    <div class="group-head">
      <h3>转换器</h3>
    </div>
    <div class="group-body">
      <div class="converter">
        <div class="editor">
          <label for="plainText">纯文字</label>
          <textarea id="plainText" placeholder="在此输入纯文字...&#10;支持换行、引号等特殊字符"></textarea>
          <div class="meta"><span class="count" id="plainCount">0</span> 字符</div>
        </div>

        <div class="actions">
          <button type="button" class="btn primary" id="toJSON">转 JSON →</button>
          <button type="button" class="btn" id="toPlain">← 转纯文字</button>
          <button type="button" class="btn secondary" id="clear">清空</button>
        </div>

        <div class="editor">
          <label for="jsonString">JSON 字符串</label>
          <textarea id="jsonString" placeholder="在此输入 JSON 字符串...&#10;例如：&quot;Hello\\nWorld&quot;"></textarea>
          <div class="meta"><span class="count" id="jsonCount">0</span> 字符</div>
          <div id="status"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="group">
    <div class="group-head">
      <h3>使用说明</h3>
    </div>
    <div class="group-body">
      <p style="font-size: 12px; line-height: 1.7; color: var(--muted);">
        <strong>纯文字 → JSON 字符串：</strong>输入普通文字（包含换行、引号等），点击"转 JSON"即可得到转义后的 JSON 字符串，可直接用于 JSON 配置文件或代码中。<br><br>
        <strong>JSON 字符串 → 纯文字：</strong>输入 JSON 字符串（带引号和转义符），点击"转纯文字"即可还原为可读的原始文字。<br><br>
        <strong>示例：</strong>纯文字 <code style="background:var(--panel-2);padding:2px 5px;border-radius:4px;font-family:var(--mono);">Hello\nWorld</code> 转换为 JSON 字符串 <code style="background:var(--panel-2);padding:2px 5px;border-radius:4px;font-family:var(--mono);">"Hello\\nWorld"</code>
      </p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot-in">
    <span class="dot"></span><span>JSON 字符串转换器</span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var plainText = document.getElementById("plainText");
  var jsonString = document.getElementById("jsonString");
  var plainCount = document.getElementById("plainCount");
  var jsonCount = document.getElementById("jsonCount");
  var status = document.getElementById("status");

  function updateCounts() {
    plainCount.textContent = plainText.value.length;
    jsonCount.textContent = jsonString.value.length;
  }

  function showStatus(msg, isError) {
    status.textContent = msg;
    status.className = isError ? "error" : "success";
    setTimeout(function () {
      status.textContent = "";
      status.className = "";
    }, 3000);
  }

  function toJSON() {
    var input = plainText.value;
    if (!input) {
      showStatus("请输入纯文字", true);
      return;
    }

    try {
      var result = JSON.stringify(input);
      jsonString.value = result;
      updateCounts();
      showStatus("转换成功", false);
    } catch (e) {
      showStatus("转换失败: " + e.message, true);
    }
  }

  function toPlain() {
    var input = jsonString.value.trim();
    if (!input) {
      showStatus("请输入 JSON 字符串", true);
      return;
    }

    try {
      var result = JSON.parse(input);
      if (typeof result !== "string") {
        showStatus("输入的不是字符串类型", true);
        return;
      }
      plainText.value = result;
      updateCounts();
      showStatus("转换成功", false);
    } catch (e) {
      showStatus("解析失败: " + e.message, true);
    }
  }

  function clearAll() {
    plainText.value = "";
    jsonString.value = "";
    updateCounts();
    status.textContent = "";
    status.className = "";
  }

  document.getElementById("toJSON").addEventListener("click", toJSON);
  document.getElementById("toPlain").addEventListener("click", toPlain);
  document.getElementById("clear").addEventListener("click", clearAll);

  plainText.addEventListener("input", updateCounts);
  jsonString.addEventListener("input", updateCounts);

  updateCounts();
})();
</script>
</body>
</html>
